name: Validate graphical FFU restore contract

on:
  push:
    branches: [feature/ffu-graphical-restore-contract]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Compile graphical FFU contracts
        run: python3 -m py_compile gui/rufusarm64_ffu_restore_logic.py gui/test_ffu_restore_logic.py
      - name: Run complete GUI logic suite
        run: PYTHONPATH=gui python3 -m unittest discover -s gui -p 'test_*.py'
      - name: Verify destructive command boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('gui/rufusarm64_ffu_restore_logic.py').read_text()
          for required in ('"restore"', '"--confirm"', '"--expected-review-binding"', 'normalize_ffu_restore_output'):
              if required not in source:
                  raise SystemExit(f'missing FFU restore contract token: {required}')
          for forbidden in ('--allow-fixed', '--unmount', '--yes', 'subprocess.', 'Gtk.', 'os.remove(', 'os.unlink('):
              if forbidden in source:
                  raise SystemExit(f'forbidden FFU restore contract primitive: {forbidden}')
          PY
      - name: Publish workflow-free product tree
        env:
          BRANCH: feature/ffu-graphical-restore-contract
        run: |
          git rm .github/workflows/check-ffu-graphical-restore-contract.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Build: remove graphical FFU restore validation workflow"
          git push origin "HEAD:${BRANCH}"
