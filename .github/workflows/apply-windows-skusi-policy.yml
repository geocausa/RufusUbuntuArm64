name: Apply Windows SkuSiPolicy support

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-windows-skusi-policy
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'parity/windows-skusi-policy'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: parity/windows-skusi-policy
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
      - name: Apply deterministic product changes
        run: |
          python3 .github/scripts/fix-windows-skusi-applicator.py
          python3 .github/scripts/apply-windows-skusi-policy.py
          gofmt -w \
            internal/windowsconfig/config.go \
            internal/windowsconfig/capabilities.go \
            internal/windowsconfig/skusi_policy_test.go \
            internal/windowsmedia/wimfeatures.go \
            internal/windowsmedia/wimfeatures_test.go \
            internal/windowsmedia/customizations.go \
            internal/windowsmedia/analysis.go \
            internal/windowsmedia/windowsmedia.go \
            cmd/rufus-linux/main.go
          go test ./internal/windowsconfig ./internal/windowsmedia ./cmd/rufus-linux
          PYTHONPATH=gui python3 gui/test_windows_skusi_policy.py
          python3 -m py_compile gui/rufusarm64.py gui/rufusarm64_logic.py gui/test_windows_skusi_policy.py
      - name: Publish one atomic product commit
        run: |
          paths=(
            internal/windowsconfig/config.go
            internal/windowsconfig/capabilities.go
            internal/windowsconfig/skusi_policy_test.go
            internal/windowsmedia/wimfeatures.go
            internal/windowsmedia/wimfeatures_test.go
            internal/windowsmedia/customizations.go
            internal/windowsmedia/analysis.go
            internal/windowsmedia/windowsmedia.go
            cmd/rufus-linux/main.go
            gui/rufusarm64.py
            gui/rufusarm64_logic.py
            gui/test_windows_skusi_policy.py
            CHANGELOG.md
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "SkuSiPolicy product changes are already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "windows: add guarded SkuSiPolicy deployment"
          git push origin HEAD:parity/windows-skusi-policy
