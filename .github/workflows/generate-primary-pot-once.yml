name: Generate primary gettext template once

on:
  push:
    branches:
      - feature/gettext-primary-ui

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/gettext-primary-ui
      - name: Generate deterministic template and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update-pot.py
          git rm .github/workflows/generate-primary-pot-once.yml
          git add po/rufusarm64.pot
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "i18n: generate primary UI gettext template"
          git push origin HEAD:feature/gettext-primary-ui
