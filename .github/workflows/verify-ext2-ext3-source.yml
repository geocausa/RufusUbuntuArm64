name: Verify ext2 and ext3 source before review

on:
  push:
    branches:
      - feature/ext2-ext3-data-format

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[ext-source-verified]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: feature/ext2-ext3-data-format
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.x'
      - name: Run focused source and contract checks
        run: |
          test -z "$(gofmt -l internal/nonbootable cmd/rufus-nonbootable-format)"
          go test ./internal/nonbootable ./cmd/rufus-nonbootable-format
          python3 -m py_compile gui/rufusarm64_nonbootable.py gui/rufusarm64_nonbootable_dialog.py
          PYTHONPATH=gui python3 -m unittest gui.test_nonbootable_format gui.test_nonbootable_dialog
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('docs/upstream-rufus-parity.json').read_text(encoding='utf-8'))
          assert data['project']['baseline'] == 'stage4/0.15.0'
          row = next(item for item in data['features'] if item['id'] == 'filesystems')
          assert all(name in row['notes'] for name in ('exFAT', 'ext2', 'ext3', 'ext4'))
          PY
      - name: Remove verifier and record pass
        run: |
          rm .github/workflows/verify-ext2-ext3-source.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/verify-ext2-ext3-source.yml
          git commit -m "test: record focused ext formatter verification [ext-source-verified]"
          git push origin HEAD:feature/ext2-ext3-data-format
