name: Apply corrected persistence localization once

on:
  pull_request:
    branches:
      - stage4/0.15.0

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/gettext-persistence-wizard
      - name: Apply embedded patch, repair generated source assertion, and test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/patch-persistence-i18n-once.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 - <<'PY'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          program = textwrap.dedent('\n'.join(lines[start + 1:end]))
          exec(compile(program, str(workflow), 'exec'), {'__name__': '__main__'})

          test_path = Path('gui/test_persistence_wizard_i18n.py')
          test_lines = test_path.read_text(encoding='utf-8').splitlines()
          matches = [index for index, line in enumerate(test_lines) if 'target_identity = str(device.get(' in line]
          if len(matches) != 1:
              raise SystemExit('generated target-identity assertion changed')
          test_lines[matches[0]] = "                          'target_identity = str(device.get(\"identity\") or \"\").strip()',"
          test_path.write_text('\n'.join(test_lines) + '\n', encoding='utf-8')
          PY
          python3 scripts/update-pot.py
          python3 -m py_compile gui/rufusarm64_i18n.py gui/test_i18n.py gui/test_persistence_wizard_i18n.py
          python3 -m unittest gui.test_persistence_wizard_i18n gui.test_i18n gui.test_persistence_logic gui.test_unified_persistence_ui
          python3 scripts/update-pot.py --check
          git rm --ignore-unmatch \
            .github/workflows/apply-persistence-i18n-fixed-once.yml \
            .github/workflows/patch-persistence-i18n-once.yml \
            .github/workflows/diagnose-persistence-i18n-once.yml \
            docs/persistence-i18n-diagnostic.txt
          git add \
            CHANGELOG.md \
            ROADMAP.md \
            docs/localization.md \
            docs/release-0.15.0.md \
            docs/upstream-rufus-parity.json \
            gui/rufusarm64_i18n.py \
            gui/test_acquisition_dialog_i18n.py \
            gui/test_checksum_dialog_i18n.py \
            gui/test_device_qualification_i18n.py \
            gui/test_ffu_dialog_i18n.py \
            gui/test_guarded_dialog_i18n_contract.py \
            gui/test_i18n.py \
            gui/test_persistence_wizard_i18n.py \
            gui/test_windows_options_dialog_i18n.py \
            packaging/rufusarm64-persistence \
            po/rufusarm64.pot
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "i18n: translate the persistent live USB wizard shell"
          git push origin HEAD:feature/gettext-persistence-wizard
