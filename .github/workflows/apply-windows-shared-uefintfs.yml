name: Apply shared Windows UEFI NTFS source

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-windows-shared-uefintfs
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.number == 408 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'parity/linux-iso-ntfs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: parity/linux-iso-ntfs
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.x'
      - name: Apply deterministic source transformation
        run: |
          python3 .github/scripts/apply_windows_shared_uefintfs.py
          gofmt -w internal/windowsmedia/windowsmedia.go
          go test ./internal/uefintfs ./internal/windowsmedia
      - name: Publish one atomic source commit
        run: |
          if git diff --quiet -- internal/windowsmedia/windowsmedia.go CHANGELOG.md; then
            echo "Shared source transformation is already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/windowsmedia/windowsmedia.go CHANGELOG.md
          git commit -m "windowsmedia: share UEFI:NTFS asset handling"
          git push origin HEAD:parity/linux-iso-ntfs
