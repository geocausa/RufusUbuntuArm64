name: Fix PR 415 CA 2023 error style

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fix-pr415-ca2023-error-style
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: parity/windows-ca2023-bootloaders
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
      - name: Correct lowercase error strings and verify
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ca = Path('internal/windowsmedia/ca2023.go')
          text = ca.read_text(encoding='utf-8')
          for old, new in (
              ('errors.New("Windows', 'errors.New("windows'),
              ('fmt.Errorf("Windows', 'fmt.Errorf("windows'),
          ):
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'no occurrences of {old!r} found in {ca}')
              text = text.replace(old, new)
          ca.write_text(text, encoding='utf-8')

          writer = Path('internal/windowsmedia/windowsmedia.go')
          text = writer.read_text(encoding='utf-8')
          old = 'errors.New("Windows CA 2023 original replacement total exceeds the inspected media total")'
          new = 'errors.New("windows CA 2023 original replacement total exceeds the inspected media total")'
          if text.count(old) != 1:
              raise SystemExit(f'expected one CA 2023 capacity error in {writer}, found {text.count(old)}')
          writer.write_text(text.replace(old, new), encoding='utf-8')
          PY
          gofmt -w internal/windowsmedia/ca2023.go internal/windowsmedia/windowsmedia.go
          audit_bin="${RUNNER_TEMP}/audit-tools"
          mkdir -p "${audit_bin}"
          GOBIN="${audit_bin}" go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          "${audit_bin}/staticcheck" ./internal/windowsmedia/...
          go test ./internal/windowsmedia ./internal/windowsconfig ./cmd/rufus-linux
      - name: Publish style-only product commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/windowsmedia/ca2023.go internal/windowsmedia/windowsmedia.go
          git commit -m "windowsmedia: normalize CA 2023 error strings"
          git push origin HEAD:parity/windows-ca2023-bootloaders
