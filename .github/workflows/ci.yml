name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize-iso-release:
    name: Normalize ISO release integration
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: feature/drive-backup-udf-iso
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
      - name: Normalize ISO package metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/build-deb.sh')
          lines = path.read_text().splitlines()
          first = 'install -Dm644 "${ROOT_DIR}/gui/rufusarm64_drive_backup_formats.py" \\'
          if not any('gui/rufusarm64_iso_capture.py' in line for line in lines):
              index = lines.index(first)
              lines[index + 2:index + 2] = [
                  'install -Dm644 "${ROOT_DIR}/gui/rufusarm64_iso_capture.py" \\',
                  '  "${PACKAGE_DIR}/usr/lib/rufusarm64/rufusarm64_iso_capture.py"',
                  'install -Dm644 "${ROOT_DIR}/gui/rufusarm64_drive_backup_iso.py" \\',
                  '  "${PACKAGE_DIR}/usr/lib/rufusarm64/rufusarm64_drive_backup_iso.py"',
              ]
          text = '\n'.join(lines) + '\n'
          if 'genisoimage' not in text:
              text = text.replace('xz-utils, zstd, qemu-utils', 'xz-utils, zstd, qemu-utils, genisoimage', 1)
          text = text.replace(
              'creates verified x86 BIOS/Legacy FreeDOS 1.4 media, and captures verified\n images of removable drives.',
              'creates verified x86 BIOS/Legacy FreeDOS 1.4 media, captures verified\n physical-drive images, and creates validated mounted-filesystem ISO/UDF remasters.',
              1,
          )
          path.write_text(text)
          PY
      - name: Normalize ISO schema contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('gui/rufusarm64_iso_capture.py')
          text = path.read_text()
          text = text.replace(
              '''    if required <= 0:\n        raise ValueError("Filesystem ISO report contains an invalid destination bound.")''',
              '''    if status == "passed" and required <= 0:\n        raise ValueError("Successful filesystem ISO report contains an invalid destination bound.")''',
              1,
          )
          text = text.replace(
              '''    if not isinstance(limitations, list) or set(limitations) != _REQUIRED_LIMITATIONS or len(limitations) != len(_REQUIRED_LIMITATIONS):''',
              '''    if (\n        not isinstance(limitations, list)\n        or not all(isinstance(item, str) for item in limitations)\n        or set(limitations) != _REQUIRED_LIMITATIONS\n        or len(limitations) != len(_REQUIRED_LIMITATIONS)\n    ):''',
              1,
          )
          path.write_text(text)
          PY
      - name: Normalize ISO GTK lifecycle contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('gui/rufusarm64_drive_backup_iso.py')
          text = path.read_text()
          text = text.replace(
              '''            if payload["source_bytes"] != source_bytes or payload["required_bytes"] != required_bytes:\n                raise ValueError("Filesystem ISO report does not match the reviewed plan.")''',
              '''            if payload["status"] == "passed":\n                if payload["source_bytes"] != source_bytes or payload["required_bytes"] != required_bytes:\n                    raise ValueError("Successful filesystem ISO report does not match the reviewed plan.")\n            elif payload["source_bytes"] not in {0, source_bytes} or payload["required_bytes"] not in {0, required_bytes}:\n                raise ValueError("Filesystem ISO failure report contains impossible plan evidence.")''',
              1,
          )
          path.write_text(text)
          PY
      - name: Normalize Go formatting
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cmd/rufus-device-backup/*.go internal/isocapture/*.go
          test -z "$(gofmt -l cmd/rufus-device-backup/*.go internal/isocapture/*.go)"
      - name: Qualify ISO command contracts
        shell: bash
        run: |
          mkdir -p dist/iso-normalize
          set -o pipefail
          go test -v ./cmd/rufus-device-backup 2>&1 | tee dist/iso-normalize/command.log
      - name: Upload focused ISO command diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iso-command-${{ github.run_id }}
          path: dist/iso-normalize/command.log
          if-no-files-found: error
      - name: Qualify ISO core contracts
        run: go test ./internal/isocapture
      - name: Qualify trusted resolver contracts
        run: go test ./internal/trustedexec
      - name: Qualify Python and GTK ISO contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile gui/rufusarm64_iso_capture.py gui/rufusarm64_drive_backup_iso.py gui/test_iso_capture.py gui/test_device_backup_dialog.py
          PYTHONPATH=gui python3 gui/test_iso_capture.py
          PYTHONPATH=gui python3 gui/test_device_backup.py
          PYTHONPATH=gui python3 gui/test_device_backup_dialog.py
      - name: Qualify ISO package metadata
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-deb.sh packaging/rufusarm64
          test "$(grep -Fc 'gui/rufusarm64_iso_capture.py' scripts/build-deb.sh)" -eq 1
          test "$(grep -Fc 'gui/rufusarm64_drive_backup_iso.py' scripts/build-deb.sh)" -eq 1
          grep -Fq 'genisoimage' scripts/build-deb.sh
      - name: Publish validated ISO source normalization
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- cmd/rufus-device-backup internal/isocapture gui/rufusarm64_iso_capture.py gui/rufusarm64_drive_backup_iso.py scripts/build-deb.sh; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cmd/rufus-device-backup internal/isocapture gui/rufusarm64_iso_capture.py gui/rufusarm64_drive_backup_iso.py scripts/build-deb.sh
          git commit -m 'backup: normalize ISO release integration'
          git push origin HEAD:feature/drive-backup-udf-iso
