name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-minimum:
    name: Go 1.22 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.x'
      - name: Align container reserve contracts
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('gui/rufusarm64_device_qualify.py')
          text = helper.read_text(encoding='utf-8')
          old = '    elif minimum <= 0 or minimum > required:\n'
          new = '    elif minimum > required:\n'
          if text.count(old) != 1:
              raise SystemExit('GTK container minimum guard is missing or ambiguous')
          helper.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('gui/test_device_backup.py')
          text = tests.read_text(encoding='utf-8')
          old = '                "container_minimum_bytes": 2 * 1024 * 1024,\n'
          new = '                "container_minimum_bytes": 0,\n'
          if text.count(old) != 1:
              raise SystemExit('GTK container plan fixture is missing or ambiguous')
          text = text.replace(old, new, 1)
          anchor = '        self.assertIn("Destination filesystem: /home/user", summary)\n'
          addition = anchor + '        self.assertNotIn("Minimum container estimate", summary)\n'
          if text.count(anchor) != 1:
              raise SystemExit('GTK summary assertion anchor is missing or ambiguous')
          tests.write_text(text.replace(anchor, addition, 1), encoding='utf-8')

          manual = Path('docs/rufusarm64-device-backup.1')
          text = manual.read_text(encoding='utf-8')
          old = '''source. Raw capture requires the source capacity. VHD and VHDX dry-run planning
uses QEMU's fully allocated bound for conservative free-space admission; the
smaller sparse-container estimate is informational only. Mounted removable
'''
          new = '''source. Raw capture requires the source capacity. VHD and VHDX dry-run planning
requires the complete source capacity plus a 12.5% policy reserve, with a
minimum 64 MiB margin. No sparse-size saving is promised. Mounted removable
'''
          if text.count(old) != 1:
              raise SystemExit('manual allocation paragraph is missing or ambiguous')
          text = text.replace(old, new, 1)
          old = '''Validate source metadata, format support, converter availability, destination
storage, conservative free-space bounds, and collision state without opening
'''
          new = '''Validate source metadata, format support, converter availability, destination
storage, the explicit conservative reserve, and collision state without opening
'''
          if text.count(old) != 1:
              raise SystemExit('manual dry-run paragraph is missing or ambiguous')
          manual.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          gofmt -w \
            internal/drivebackup/qemu_linux.go \
            internal/drivebackup/qemu_linux_test.go \
            internal/drivebackup/plan_linux.go
          go test ./internal/drivebackup ./cmd/rufus-device-backup
          PYTHONPATH=gui python3 -m unittest \
            gui.test_device_backup \
            gui.test_device_backup_dialog \
            gui.test_packaged_launcher
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            internal/drivebackup/qemu_linux.go \
            internal/drivebackup/qemu_linux_test.go \
            internal/drivebackup/plan_linux.go \
            gui/rufusarm64_device_qualify.py \
            gui/test_device_backup.py \
            docs/rufusarm64-device-backup.1
          git commit -m 'backup: use conservative VHD allocation reserve'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Compile and test the declared minimum Go version
        run: go test ./...

  wim-engine:
    name: Build bundled WIM engine
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install WIM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config git ca-certificates \
            libxml2-dev zlib1g-dev liblzma-dev libbz2-dev liblz4-dev libzstd-dev
      - name: Build and inspect the pinned ARM64 engine
        run: ./scripts/build-wimlib-arm64.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wimlib-arm64
          path: |
            vendor/wimlib/arm64/
            vendor/wimlib/source/wimlib-1.14.5-source.tar.gz
            vendor/wimlib/source/wimlib-1.14.5-source.tar.gz.sha256
          if-no-files-found: error

  uefi-md5sum-loader:
    name: Reproduce ARM64 uefi-md5sum loader
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install pinned loader build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git gzip nasm python3 python3-setuptools uuid-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu sbsigntool
      - name: Build twice and require identical provenance
        run: |
          bash scripts/build-uefi-md5sum-arm64.sh dist/uefi-md5sum-a
          bash scripts/build-uefi-md5sum-arm64.sh dist/uefi-md5sum-b
          for file in bootaa64.efi bootaa64.efi.sha256 provenance.json SOURCE-COMMITS.txt \
            uefi-md5sum-v1.2-source.tar.gz uefi-md5sum-v1.2-source.tar.gz.sha256; do
            cmp "dist/uefi-md5sum-a/${file}" "dist/uefi-md5sum-b/${file}"
          done
          printf '%s\n' \
            'Two independent Ubuntu 24.04 builds produced byte-for-byte identical artifacts.' \
            'The loader is unsigned and is not claimed Secure Boot compatible.' \
            > dist/uefi-md5sum-a/REPRODUCIBILITY.txt
          mkdir -p vendor/uefi-md5sum/arm64
          cp -a dist/uefi-md5sum-a/. vendor/uefi-md5sum/arm64/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uefi-md5sum-arm64
          path: vendor/uefi-md5sum/arm64/
          if-no-files-found: error

  test-and-package:
    name: Audit and package
    needs: [go-minimum, wim-engine, uefi-md5sum-loader]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wimlib-arm64
          path: vendor/wimlib
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: uefi-md5sum-arm64
          path: vendor/uefi-md5sum/arm64
      - name: Install audit validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck desktop-file-utils appstream lintian dosfstools e2fsprogs qemu-utils
          audit_bin="${RUNNER_TEMP}/rufusarm64-audit-tools"
          mkdir -p "${audit_bin}"
          GOBIN="${audit_bin}" go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          GOBIN="${audit_bin}" go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          GOBIN="${audit_bin}" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "${audit_bin}" >> "${GITHUB_PATH}"
      - name: Run pinned static, workflow, and vulnerability checks
        run: bash ./scripts/static-audit.sh
      - name: Exercise privileged loop-device invariants
        env:
          RUFUS_REAL_BLOCK_TEST: '1'
        run: |
          mkdir -p dist/audit-logs
          set -o pipefail
          {
            sudo modprobe loop || true
            go test -c -o "${RUNNER_TEMP}/safety-loop.test" ./internal/safety
            sudo env RUFUS_REAL_BLOCK_TEST="${RUFUS_REAL_BLOCK_TEST}" \
              "${RUNNER_TEMP}/safety-loop.test" \
              -test.run '^TestOpenReopenableDeviceSupportsFilesystemToolsOnLoop$' \
              -test.v
            go test -c -o "${RUNNER_TEMP}/devicequal-loop.test" ./internal/devicequal
            sudo env RUFUS_REAL_BLOCK_TEST="${RUFUS_REAL_BLOCK_TEST}" \
              "${RUNNER_TEMP}/devicequal-loop.test" \
              -test.run '^TestRunDeviceQualifiesRealLoopDevice$' \
              -test.v
            go test -c -o "${RUNNER_TEMP}/drivebackup-loop.test" ./internal/drivebackup
            sudo env RUFUS_REAL_BLOCK_TEST="${RUFUS_REAL_BLOCK_TEST}" \
              "${RUNNER_TEMP}/drivebackup-loop.test" \
              -test.run '^(TestCaptureDeviceCapturesRealReadOnlyLoopDevice|TestCaptureDeviceExportsVerifiedContainersFromRealReadOnlyLoop)$' \
              -test.v
          } 2>&1 | tee dist/audit-logs/privileged-loop-device.log
      - name: Resolve traceable build version
        id: version
        if: success()
        run: |
          project_version="$(tr -d '\r\n' < VERSION)"
          version="${project_version}"
          allow_nonrelease=0
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            pr_number="$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["number"])')"
            head_sha="$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["pull_request"]["head"]["sha"])')"
            version="${project_version}+pr${pr_number}.${head_sha:0:8}"
            allow_nonrelease=1
          fi
          dpkg --validate-version "${version}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "RUFUS_ALLOW_NONRELEASE_VERSION=${allow_nonrelease}" >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Full test, audit, and ARM64 package pass
        if: success()
        run: |
          mkdir -p dist/audit-logs
          set -o pipefail
          ./scripts/test.sh 2>&1 | tee dist/audit-logs/test-and-package.log
      - name: Confirm reproducible Debian package
        if: success()
        run: |
          set -o pipefail
          bash ./scripts/reproducible-package.sh 2>&1 | tee dist/audit-logs/reproducible-package.log
      - name: Upload complete audit logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-logs-${{ github.run_id }}-x86-64
          path: dist/audit-logs/
          if-no-files-found: warn
      - name: Upload ARM64 package
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rufusarm64-${{ steps.version.outputs.version }}-ubuntu-arm64
          path: |
            dist/rufusarm64_${{ steps.version.outputs.version }}_arm64.deb
            dist/rufusarm64_${{ steps.version.outputs.version }}_arm64.deb.sha256
          if-no-files-found: error

  native-arm64-smoke:
    name: Native ARM64 execution
    needs: [go-minimum, wim-engine, uefi-md5sum-loader]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wimlib-arm64
          path: vendor/wimlib
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: uefi-md5sum-arm64
          path: vendor/uefi-md5sum/arm64
      - name: Resolve traceable build version
        id: version
        run: |
          project_version="$(tr -d '\r\n' < VERSION)"
          version="${project_version}"
          allow_nonrelease=0
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            pr_number="$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["number"])')"
            head_sha="$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["pull_request"]["head"]["sha"])')"
            version="${project_version}+pr${pr_number}.${head_sha:0:8}"
            allow_nonrelease=1
          fi
          dpkg --validate-version "${version}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "RUFUS_ALLOW_NONRELEASE_VERSION=${allow_nonrelease}" >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Run the complete suite natively on ARM64
        run: |
          mkdir -p dist/audit-logs
          set -o pipefail
          ./scripts/test.sh 2>&1 | tee dist/audit-logs/native-arm64.log
      - name: Execute packaged ARM64 binaries
        if: success()
        run: |
          package_root="$(mktemp -d)"
          trap 'rm -rf "${package_root}"' EXIT
          dpkg-deb -x "dist/rufusarm64_${VERSION}_arm64.deb" "${package_root}"
          test "$("${package_root}/usr/lib/rufusarm64/rufusarm64-helper" version)" = "${VERSION}"
          test "$("${package_root}/usr/lib/rufusarm64/rufusarm64-persistence-helper" --help 2>&1 || true)" != ""
          test "$("${package_root}/usr/lib/rufusarm64/rufusarm64-device-qualify" version)" = "${VERSION}"
          test "$("${package_root}/usr/lib/rufusarm64/rufusarm64-device-backup" version)" = "${VERSION}"
          runtime_loader="${package_root}/usr/lib/rufusarm64/bootaa64-uefi-md5sum.efi"
          test "$(stat -c %s "${runtime_loader}")" -eq 40960
          test "$(sha256sum "${runtime_loader}" | awk '{print $1}')" = "543615a8e97fed1cb5293bee7bdfe10f9feb6979f191b20ab32dafdcf097b502"
          integrity_root="$(mktemp -d)"
          mkdir -p "${integrity_root}/EFI/BOOT"
          printf 'packaged arm64 loader' > "${integrity_root}/EFI/BOOT/BOOTAA64.EFI"
          "${package_root}/usr/lib/rufusarm64/rufusarm64-helper" uefi integrity manifest \
            --directory "${integrity_root}" > "${integrity_root}/md5sum.txt"
          "${package_root}/usr/lib/rufusarm64/rufusarm64-helper" uefi integrity verify \
            --directory "${integrity_root}" --json >/dev/null
          rm -rf "${integrity_root}"
          "${package_root}/usr/lib/rufusarm64/wimlib-imagex" --version
      - name: Upload native ARM64 logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-logs-${{ github.run_id }}-arm64
          path: dist/audit-logs/
          if-no-files-found: warn
