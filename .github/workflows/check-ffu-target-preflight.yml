name: Validate FFU read-only target preflight

on:
  push:
    branches:
      - feature/ffu-readonly-target-preflight

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.22.x'
          cache: true
      - name: Apply reviewed cleanup and format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/ffu/restore_target_preflight_linux.go')
          source = path.read_text()
          old = '''\tactualIdentity := device.IdentityToken(dev)
\tif validation.ExpectedTargetIdentity != actualIdentity {
\t\treturn FullFlashTargetPreflightPlan{}, errors.New("FFU target identity differs from the authenticated restore plan")
\t}
\tif dev.Size != validation.TargetSizeBytes {
\t\treturn FullFlashTargetPreflightPlan{}, fmt.Errorf("FFU target capacity changed from %d to %d bytes", validation.TargetSizeBytes, dev.Size)
\t}'''
          new = '''\tif dev.Size != validation.TargetSizeBytes {
\t\treturn FullFlashTargetPreflightPlan{}, fmt.Errorf("FFU target capacity changed from %d to %d bytes", validation.TargetSizeBytes, dev.Size)
\t}
\tactualIdentity := device.IdentityToken(dev)
\tif validation.ExpectedTargetIdentity != actualIdentity {
\t\treturn FullFlashTargetPreflightPlan{}, errors.New("FFU target identity differs from the authenticated restore plan")
\t}'''
          if old not in source:
              raise SystemExit('target capacity/identity block not found')
          path.write_text(source.replace(old, new))
          PY
          gofmt -w internal/ffu/restore_target_preflight_linux.go internal/ffu/restore_target_preflight_linux_test.go internal/ffu/restore_target_preflight_policy_contract_test.go
      - name: Test focused package
        run: go test -count=1 ./internal/ffu
      - name: Vet focused package
        run: go vet ./internal/ffu
      - name: Race focused package
        run: go test -race -count=1 ./internal/ffu
      - name: Staticcheck focused package
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          "$(go env GOPATH)/bin/staticcheck" ./internal/ffu
      - name: Cross-compile ARM64 focused package
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go test -c ./internal/ffu -o /tmp/ffu-arm64.test
      - name: Publish formatted product tree
        env:
          BRANCH: feature/ffu-readonly-target-preflight
        run: |
          git rm .github/workflows/check-ffu-target-preflight.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ffu-readonly-target-preflight.md internal/ffu/restore_target_preflight_linux.go internal/ffu/restore_target_preflight_linux_test.go internal/ffu/restore_target_preflight_policy_contract_test.go
          git commit -m "FFU: add read-only live target preflight"
          git push origin "HEAD:${BRANCH}"
