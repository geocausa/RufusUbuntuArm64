name: Apply translation-aware accessibility final once

on:
  pull_request:
    branches:
      - stage4/0.15.0

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/translation-aware-accessibility
      - name: Apply corrected reviewed accessibility patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/patch-translation-aware-accessibility-once.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == 'run: |')
          block = []
          for line in lines[start + 1:]:
              if not line:
                  block.append('')
              elif line.startswith('          '):
                  block.append(line[10:])
              else:
                  raise SystemExit(f'unexpected line outside run block: {line!r}')
          script = '\n'.join(block) + '\n'
          replacements = (
              (
                  "('    N_(\"_FreeDOS…\"),\\n', '    N_(\"_FreeDOS…\"),\\n",
                  "('    N_(\"FreeDOS…\"),\\n', '    N_(\"FreeDOS…\"),\\n    N_(\"_FreeDOS…\"),\\n",
              ),
              (
                  "('    N_(\"Post-operation actions\"),\\n', '    N_(\"Post-operation actions\"),\\n', \"existing post-operation message\"),",
                  "('    N_(\"Operation status details\"),\\n', '    N_(\"Operation status details\"),\\n    N_(\"Post-operation actions\"),\\n', \"post-operation accessibility name\"),",
              ),
          )
          for old, new in replacements:
              if script.count(old) != 1:
                  raise SystemExit(f'corrected patch tuple changed: {old}')
              script = script.replace(old, new, 1)

          extra = '''    (
                  '    N_("Choose the ISO or disk image that RufusArm64 will inspect before writing."),\\n',
                  '    N_("Choose an ISO or disk image that RufusArm64 will inspect before writing."),\\n    N_("Choose the ISO or disk image that RufusArm64 will inspect before writing."),\\n',
                  "image chooser accessibility description",
              ),
              (
                  '    N_("Request safe cancellation of the active operation and wait for its final state and cleanup."),\\n',
                  '    N_("Request safe cancellation and wait for cleanup to finish."),\\n    N_("Request safe cancellation of the active operation and wait for its final state and cleanup."),\\n',
                  "cancellation accessibility description",
              ),
'''
          anchor = 'additions = (\n'
          if script.count(anchor) != 1:
              raise SystemExit('catalog additions anchor changed')
          script = script.replace(anchor, anchor + extra, 1)
          Path('/tmp/accessibility-patch.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/accessibility-patch.sh
          git rm --ignore-unmatch \
            .github/workflows/apply-translation-aware-accessibility-final-once.yml \
            docs/accessibility-patch-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "ci: remove accessibility patch diagnostics"
          git push origin HEAD:feature/translation-aware-accessibility
