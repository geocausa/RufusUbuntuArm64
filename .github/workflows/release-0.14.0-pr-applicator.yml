name: Apply 0.14.0 release contract from PR

on:
  pull_request:
    branches:
      - stage3/0.14.0

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository == 'geocausa/RufusUbuntuArm64' &&
      github.event.pull_request.head.ref == 'release/0.14.0-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 3
      - name: Extract and run the reviewed one-shot applicator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "c03e40b2089c5d9bbdc145ae848f371983e795b6"
          python3 - <<'PYEXTRACT'
          from pathlib import Path

          source = Path('.github/workflows/release-0.14.0-applicator.yml').read_text(encoding='utf-8')
          begin = "          python3 - <<'PY'\n"
          end = "          PY\n"
          start = source.index(begin) + len(begin)
          stop = source.index(end, start)
          lines = source[start:stop].splitlines()
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-release.py').write_text(body, encoding='utf-8')
          PYEXTRACT
          python3 /tmp/apply-release.py
          rm -f .github/workflows/release-0.14.0-pr-applicator.yml
          python3 scripts/check-version-sync.py
          python3 -m json.tool docs/upstream-rufus-parity.json >/dev/null
          git diff --check
      - name: Commit clean release contract
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Release: prepare the 0.14.0 candidate contract"
          git push origin HEAD:release/0.14.0-candidate
