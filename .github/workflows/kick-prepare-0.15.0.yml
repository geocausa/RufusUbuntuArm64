name: Trigger RufusArm64 0.15.0 candidate applicator

on:
  push:
    branches:
      - release/0.15.0-candidate

permissions:
  contents: write

concurrency:
  group: trigger-rufusarm64-0.15.0-candidate
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'geocausa/RufusUbuntuArm64'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_PRODUCT_COMMIT: 78850300e2681f015b0ae90c10356094fc5daeca
      RELEASE_VERSION: 0.15.0
      RELEASE_DATE: 2026-07-28
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: release/0.15.0-candidate
          fetch-depth: 0
          persist-credentials: true
      - name: Execute and remove the reviewed one-shot applicator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/prepare-0.15.0-candidate.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = None
          for index, line in enumerate(lines):
              if line == '        run: |' and index > 0 and 'Apply synchronized candidate metadata exactly once' in lines[index - 1]:
                  start = index + 1
                  break
          if start is None:
              raise SystemExit('reviewed applicator run block not found')
          body = []
          for line in lines[start:]:
              if line.startswith('          '):
                  body.append(line[10:])
              elif line.strip() == '':
                  body.append('')
              else:
                  break
          script = '\n'.join(body) + '\n'
          script = script.replace('${{ github.event.pull_request.head.ref }}', 'release/0.15.0-candidate')
          marker = 'rm -f .github/workflows/prepare-0.15.0-candidate.yml\n'
          replacement = marker + 'rm -f .github/workflows/kick-prepare-0.15.0.yml\n'
          if marker not in script:
              raise SystemExit('temporary-workflow cleanup marker not found')
          script = script.replace(marker, replacement, 1)
          Path('/tmp/apply-0.15.0.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-0.15.0.sh
