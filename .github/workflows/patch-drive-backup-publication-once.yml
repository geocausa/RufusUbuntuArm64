name: Patch drive-backup publication rollback once

on:
  push:
    branches:
      - feature/drive-backup-publication-rollback
  pull_request:
    branches:
      - stage4/0.15.0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/drive-backup-publication-rollback
      - name: Add deterministic publication rollback seams and evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_between(path, start_marker, end_marker, replacement):
              text = path.read_text(encoding="utf-8")
              start = text.find(start_marker)
              end = text.find(end_marker, start)
              if start < 0 or end < 0 or text.find(start_marker, start + 1) >= 0:
                  raise SystemExit(f"publication block changed in {path}")
              path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          drive = Path("internal/drivebackup/executor_linux.go")
          drive_replacement = r'''type publicationOps struct {
              rename func(*os.File, string, string) error
              sync   func(*os.File) error
              unlink func(*os.File, string) error
          }

          func publishNoReplace(directory *os.File, temporaryName, outputName string) error {
              return publishNoReplaceWith(directory, temporaryName, outputName, publicationOps{
                  rename: renameNoReplaceAt,
                  sync: func(open *os.File) error {
                      return open.Sync()
                  },
                  unlink: func(open *os.File, name string) error {
                      return syscall.Unlinkat(int(open.Fd()), name)
                  },
              })
          }

          func publishNoReplaceWith(directory *os.File, temporaryName, outputName string, operations publicationOps) error {
              if operations.rename == nil || operations.sync == nil || operations.unlink == nil {
                  return errors.New("backup publication operations are incomplete")
              }
              if err := operations.rename(directory, temporaryName, outputName); err != nil {
                  return err
              }
              if syncErr := operations.sync(directory); syncErr != nil {
                  result := error(fmt.Errorf("sync backup destination directory: %w", syncErr))
                  if unlinkErr := operations.unlink(directory, outputName); unlinkErr != nil {
                      result = errors.Join(result, fmt.Errorf("rollback published backup destination: %w", unlinkErr))
                  }
                  if rollbackSyncErr := operations.sync(directory); rollbackSyncErr != nil {
                      result = errors.Join(result, fmt.Errorf("sync backup destination directory after rollback: %w", rollbackSyncErr))
                  }
                  return result
              }
              return nil
          }

          func renameNoReplaceAt(directory *os.File, temporaryName, outputName string) error {
              syscallNumber, err := renameat2SyscallNumber()
              if err != nil {
                  return err
              }
              temporaryPointer, err := syscall.BytePtrFromString(temporaryName)
              if err != nil {
                  return fmt.Errorf("encode backup temporary name: %w", err)
              }
              outputPointer, err := syscall.BytePtrFromString(outputName)
              if err != nil {
                  return fmt.Errorf("encode backup destination name: %w", err)
              }
              directoryFD := uintptr(directory.Fd())
              _, _, errno := syscall.Syscall6(
                  syscallNumber,
                  directoryFD,
                  uintptr(unsafe.Pointer(temporaryPointer)),
                  directoryFD,
                  uintptr(unsafe.Pointer(outputPointer)),
                  renameNoReplace,
                  0,
              )
              if errno != 0 {
                  return fmt.Errorf("publish backup without replacing an existing file: %w", errno)
              }
              return nil
          }

          '''
          replace_between(
              drive,
              "func publishNoReplace(directory *os.File, temporaryName, outputName string) error {",
              "func renameat2SyscallNumber()",
              drive_replacement,
          )

          iso = Path("internal/isocapture/destination_linux.go")
          iso_replacement = r'''type isoPublicationOps struct {
              rename func(*os.File, string, string) error
              sync   func(*os.File) error
              unlink func(*os.File, string) error
          }

          func publishISONoReplace(directory *os.File, temporaryName, destinationName string) error {
              return publishISONoReplaceWith(directory, temporaryName, destinationName, isoPublicationOps{
                  rename: isoRenameNoReplaceAt,
                  sync: func(open *os.File) error {
                      return open.Sync()
                  },
                  unlink: func(open *os.File, name string) error {
                      return syscall.Unlinkat(int(open.Fd()), name)
                  },
              })
          }

          func publishISONoReplaceWith(directory *os.File, temporaryName, destinationName string, operations isoPublicationOps) error {
              if operations.rename == nil || operations.sync == nil || operations.unlink == nil {
                  return errors.New("ISO publication operations are incomplete")
              }
              if err := operations.rename(directory, temporaryName, destinationName); err != nil {
                  return err
              }
              if syncErr := operations.sync(directory); syncErr != nil {
                  result := error(fmt.Errorf("sync ISO destination directory: %w", syncErr))
                  if unlinkErr := operations.unlink(directory, destinationName); unlinkErr != nil {
                      result = errors.Join(result, fmt.Errorf("rollback published ISO destination: %w", unlinkErr))
                  }
                  if rollbackSyncErr := operations.sync(directory); rollbackSyncErr != nil {
                      result = errors.Join(result, fmt.Errorf("sync ISO destination directory after rollback: %w", rollbackSyncErr))
                  }
                  return result
              }
              return nil
          }

          func isoRenameNoReplaceAt(directory *os.File, temporaryName, destinationName string) error {
              syscallNumber, err := isoRenameat2Number()
              if err != nil {
                  return err
              }
              temporaryPointer, err := syscall.BytePtrFromString(temporaryName)
              if err != nil {
                  return fmt.Errorf("encode ISO temporary name: %w", err)
              }
              destinationPointer, err := syscall.BytePtrFromString(destinationName)
              if err != nil {
                  return fmt.Errorf("encode ISO destination name: %w", err)
              }
              directoryFD := uintptr(directory.Fd())
              _, _, errno := syscall.Syscall6(
                  syscallNumber,
                  directoryFD,
                  uintptr(unsafe.Pointer(temporaryPointer)),
                  directoryFD,
                  uintptr(unsafe.Pointer(destinationPointer)),
                  isoRenameNoReplace,
                  0,
              )
              if errno != 0 {
                  return fmt.Errorf("publish ISO without replacing an existing file: %w", errno)
              }
              return nil
          }

          '''
          replace_between(
              iso,
              "func publishISONoReplace(directory *os.File, temporaryName, destinationName string) error {",
              "func isoRenameat2Number()",
              iso_replacement,
          )

          matrix_path = Path("docs/interruption-qualification.json")
          matrix = json.loads(matrix_path.read_text(encoding="utf-8"))
          gaps = matrix["residual_software_gaps"]
          matched = [gap for gap in gaps if gap.get("id") == "gap-drive-backup-publication"]
          if len(matched) != 1:
              raise SystemExit("drive-backup publication residual row changed")
          matrix["residual_software_gaps"] = [
              gap for gap in gaps if gap.get("id") != "gap-drive-backup-publication"
          ]
          entries = [
              {
                  "id": "drive-backup-source-truncation-cleanup",
                  "boundary": "drive-backup-publication",
                  "component": "raw drive backup",
                  "failure_mode": "the source becomes shorter than the reviewed capture size after private output creation",
                  "phase": "post-temporary-creation",
                  "status": "automated",
                  "test_file": "internal/drivebackup/backup_test.go",
                  "test_name": "TestCaptureRemovesIncompleteDestinationOnSourceTruncation",
                  "platforms": ["linux-amd64", "linux-arm64"],
                  "invariant": "The incomplete owner-private destination is removed and the failed report cannot expose completed hash evidence."
              },
              {
                  "id": "drive-backup-cancellation-cleanup",
                  "boundary": "drive-backup-publication",
                  "component": "raw drive backup",
                  "failure_mode": "the capture context is cancelled after partial destination mutation",
                  "phase": "post-temporary-creation",
                  "status": "automated",
                  "test_file": "internal/drivebackup/backup_test.go",
                  "test_name": "TestCaptureCancellationRemovesIncompleteDestination",
                  "platforms": ["linux-amd64", "linux-arm64"],
                  "invariant": "The partial destination is removed, cancellation byte accounting is retained, and completed evidence is cleared."
              },
              {
                  "id": "drive-backup-write-sync-failure",
                  "boundary": "drive-backup-publication",
                  "component": "raw drive backup copy engine",
                  "failure_mode": "destination write accounting or file synchronization fails before publication",
                  "phase": "post-temporary-creation",
                  "status": "automated",
                  "test_file": "internal/drivebackup/backup_test.go",
                  "test_name": "TestCopyClassifiesDestinationFailures",
                  "platforms": ["linux-amd64", "linux-arm64"],
                  "invariant": "Invalid, zero, erroring writes and synchronization failure are classified as failure and never retain completed digest evidence."
              },
              {
                  "id": "drive-backup-destination-directory-substitution",
                  "boundary": "drive-backup-publication",
                  "component": "raw and container drive backup",
                  "failure_mode": "the destination directory path is replaced after its descriptor was admitted",
                  "phase": "pre-publication",
                  "status": "automated",
                  "test_file": "internal/drivebackup/destination_linux_test.go",
                  "test_name": "TestDestinationRevalidationRejectsReplacedParent",
                  "platforms": ["linux-amd64", "linux-arm64"],
                  "invariant": "Publication is refused when the path no longer names the held destination directory."
              },
              {
                  "id": "drive-backup-directory-sync-rollback",
                  "boundary": "drive-backup-publication",
                  "component": "raw, VHD, and VHDX drive backup publication",
                  "failure_mode": "directory synchronization fails immediately after a successful no-replace rename",
                  "phase": "post-publication",
                  "status": "automated",
                  "test_file": "internal/drivebackup/publication_interruption_linux_test.go",
                  "test_name": "TestPublishNoReplaceRollsBackAfterDirectorySyncFailure",
                  "platforms": ["linux-amd64", "linux-arm64"],
                  "invariant": "The owned published name is removed, the rollback is synchronized, and no temporary or final name remains while failure is returned."
              },
              {
                  "id": "drive-backup-ambiguous-publication-rollback",
                  "boundary": "drive-backup-publication",
                  "component": "raw, VHD, and VHDX drive backup publication",
                  "failure_mode": "directory synchronization, rollback unlink, and rollback synchronization all fail after no-replace rename",
                  "phase": "post-publication",
                  "status": "automated",
                  "test_file": "internal/drivebackup/publication_interruption_linux_test.go",
                  "test_name": "TestPublishNoReplaceReportsAmbiguousRollbackFailure",
                  "platforms": ["linux-amd64", "linux-arm64"],
                  "invariant": "Every failure is joined into the returned error, success is impossible, and the ambiguous published name is retained rather than silently misreported."
              },
              {
                  "id": "drive-backup-symlink-publication-collision",
                  "boundary": "drive-backup-publication",
                  "component": "raw, VHD, and VHDX drive backup publication",
                  "failure_mode": "a symbolic-link destination appears before the no-replace rename",
                  "phase": "pre-publication",
                  "status": "automated",
                  "test_file": "internal/drivebackup/publication_interruption_linux_test.go",
                  "test_name": "TestPublishNoReplaceRefusesSymlinkDestinationWithoutChangingTarget",
                  "platforms": ["linux-amd64", "linux-arm64"],
                  "invariant": "The symbolic link and its target remain unchanged and the verified temporary capture remains available to the caller for owned cleanup."
              },
              {
                  "id": "iso-backup-directory-sync-rollback",
                  "boundary": "drive-backup-publication",
                  "component": "filesystem ISO/UDF drive backup publication",
                  "failure_mode": "directory synchronization fails immediately after a successful ISO no-replace rename",
                  "phase": "post-publication",
                  "status": "automated",
                  "test_file": "internal/isocapture/publication_interruption_linux_test.go",
                  "test_name": "TestPublishISONoReplaceRollsBackAfterDirectorySyncFailure",
                  "platforms": ["linux-amd64", "linux-arm64"],
                  "invariant": "The owned ISO name is removed, rollback is synchronized, and failure is returned without a temporary or final publication name."
              },
              {
                  "id": "iso-backup-ambiguous-publication-rollback",
                  "boundary": "drive-backup-publication",
                  "component": "filesystem ISO/UDF drive backup publication",
                  "failure_mode": "ISO directory synchronization, rollback unlink, and rollback synchronization all fail after no-replace rename",
                  "phase": "post-publication",
                  "status": "automated",
                  "test_file": "internal/isocapture/publication_interruption_linux_test.go",
                  "test_name": "TestPublishISONoReplaceReportsAmbiguousRollbackFailure",
                  "platforms": ["linux-amd64", "linux-arm64"],
                  "invariant": "Every failure is joined into the returned error, success and Published evidence remain impossible, and ambiguous output is visible to recovery."
              },
              {
                  "id": "iso-backup-symlink-publication-collision",
                  "boundary": "drive-backup-publication",
                  "component": "filesystem ISO/UDF drive backup publication",
                  "failure_mode": "a symbolic-link ISO destination appears before the no-replace rename",
                  "phase": "pre-publication",
                  "status": "automated",
                  "test_file": "internal/isocapture/publication_interruption_linux_test.go",
                  "test_name": "TestPublishISONoReplaceRefusesSymlinkDestinationWithoutChangingTarget",
                  "platforms": ["linux-amd64", "linux-arm64"],
                  "invariant": "The symbolic link and target remain unchanged and no-replace publication refuses the collision."
              }
          ]
          existing_ids = {entry["id"] for entry in matrix["entries"]}
          if existing_ids.intersection(entry["id"] for entry in entries):
              raise SystemExit("drive-backup publication executable rows already exist")
          physical_index = next(
              (index for index, entry in enumerate(matrix["entries"]) if entry.get("status") == "physical-only"),
              len(matrix["entries"]),
          )
          matrix["entries"][physical_index:physical_index] = entries
          matrix_path.write_text(json.dumps(matrix, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          documentation = Path("docs/interruption-crash-consistency.md")
          text = documentation.read_text(encoding="utf-8")
          old = "- interruption after root-history, catalog, or accepted-state cache publication, including forward-only recovery and malformed-cache refusal.\n\nThe acquisition-cache rows exercise the exact durable intermediate states rather than a generic error path. Refused stale, state-ahead, or truncated states leave the accepted-state file unchanged; the one recoverable catalog-ahead state advances only to authenticated metadata and never moves the accepted timestamp backwards.\n\nThe inventory deliberately keeps uncovered software cases visible. A missing drive-backup publication, partition/filesystem mutation, persistence materialization, or helper-process cleanup case may not disappear from review merely because another component has a similar test."
          new = "- interruption after root-history, catalog, or accepted-state cache publication, including forward-only recovery and malformed-cache refusal;\n- raw, dynamic-container, and filesystem-ISO backup cleanup, no-replace collision, directory substitution, post-rename sync rollback, and ambiguous rollback evidence.\n\nThe acquisition-cache rows exercise the exact durable intermediate states rather than a generic error path. Refused stale, state-ahead, or truncated states leave the accepted-state file unchanged; the one recoverable catalog-ahead state advances only to authenticated metadata and never moves the accepted timestamp backwards.\n\nThe drive-backup publication rows require rollback to remove and durably record the owned final name after a post-rename sync failure. If unlink or rollback synchronization fails, every error remains joined and the result is explicitly ambiguous rather than successful.\n\nThe inventory deliberately keeps uncovered software cases visible. A missing partition/filesystem mutation, persistence materialization, or helper-process cleanup case may not disappear from review merely because another component has a similar test."
          if text.count(old) != 1:
              raise SystemExit("interruption documentation drive-backup gap text changed")
          documentation.write_text(text.replace(old, new, 1), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          anchor = "- Qualified interrupted acquisition-cache states after root-history, catalog, and accepted-state publication, including forward-only recovery, rollback refusal, malformed-cache rejection, and unchanged-state evidence.\n"
          addition = anchor + "- Qualified raw/container and filesystem-ISO backup publication rollback, preserving no-replace collisions and surfacing unlink or rollback-sync failures as ambiguous rather than successful publication.\n"
          if text.count(anchor) != 1:
              raise SystemExit("drive-backup changelog anchor changed")
          changelog.write_text(text.replace(anchor, addition, 1), encoding="utf-8")
          PY
          gofmt -w \
            internal/drivebackup/executor_linux.go \
            internal/drivebackup/publication_interruption_linux_test.go \
            internal/isocapture/destination_linux.go \
            internal/isocapture/publication_interruption_linux_test.go
          go test ./internal/drivebackup ./internal/isocapture ./internal/qualification
          git rm .github/workflows/patch-drive-backup-publication-once.yml
          git add \
            CHANGELOG.md \
            docs/interruption-crash-consistency.md \
            docs/interruption-qualification.json \
            internal/drivebackup/executor_linux.go \
            internal/drivebackup/publication_interruption_linux_test.go \
            internal/isocapture/destination_linux.go \
            internal/isocapture/publication_interruption_linux_test.go
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "reliability: qualify drive-backup publication rollback"
          git push origin HEAD:feature/drive-backup-publication-rollback
