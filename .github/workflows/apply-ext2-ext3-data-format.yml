name: Apply ext2 and ext3 formatter tranche

on:
  push:
    branches:
      - feature/ext2-ext3-data-format

permissions:
  contents: write

concurrency:
  group: apply-ext2-ext3-data-format
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ext2-ext3-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: feature/ext2-ext3-data-format
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.x'
      - name: Apply reviewed source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "internal/nonbootable/plan.go",
              '\tFilesystemNTFS  = "ntfs"\n\tFilesystemExt4  = "ext4"\n',
              '\tFilesystemNTFS  = "ntfs"\n\tFilesystemExt2  = "ext2"\n\tFilesystemExt3  = "ext3"\n\tFilesystemExt4  = "ext4"\n',
          )
          replace_once(
              "internal/nonbootable/plan.go",
              '''\tFilesystemExt4: {\n\t\tdisplay:       "ext4",\n\t\tmkfs:          "mkfs.ext4",\n\t\tcheck:         "e2fsck",\n\t\tgptType:       "0FC63DAF-8483-4772-8E79-3D69D8477DE4",\n\t\tmbrType:       "83",\n\t\tmaxLabelBytes: 16,\n\t},\n''',
              '''\tFilesystemExt2: {\n\t\tdisplay:       "ext2",\n\t\tmkfs:          "mkfs.ext2",\n\t\tcheck:         "e2fsck",\n\t\tgptType:       "0FC63DAF-8483-4772-8E79-3D69D8477DE4",\n\t\tmbrType:       "83",\n\t\tmaxLabelBytes: 16,\n\t},\n\tFilesystemExt3: {\n\t\tdisplay:       "ext3",\n\t\tmkfs:          "mkfs.ext3",\n\t\tcheck:         "e2fsck",\n\t\tgptType:       "0FC63DAF-8483-4772-8E79-3D69D8477DE4",\n\t\tmbrType:       "83",\n\t\tmaxLabelBytes: 16,\n\t},\n\tFilesystemExt4: {\n\t\tdisplay:       "ext4",\n\t\tmkfs:          "mkfs.ext4",\n\t\tcheck:         "e2fsck",\n\t\tgptType:       "0FC63DAF-8483-4772-8E79-3D69D8477DE4",\n\t\tmbrType:       "83",\n\t\tmaxLabelBytes: 16,\n\t},\n''',
          )
          replace_once(
              "internal/nonbootable/plan.go",
              '''\tcase "ntfs":\n\t\treturn FilesystemNTFS, nil\n\tcase "ext4":\n\t\treturn FilesystemExt4, nil\n\tdefault:\n\t\treturn "", fmt.Errorf("filesystem must be FAT32, exFAT, NTFS, or ext4, not %q", value)\n''',
              '''\tcase "ntfs":\n\t\treturn FilesystemNTFS, nil\n\tcase "ext2":\n\t\treturn FilesystemExt2, nil\n\tcase "ext3":\n\t\treturn FilesystemExt3, nil\n\tcase "ext4":\n\t\treturn FilesystemExt4, nil\n\tdefault:\n\t\treturn "", fmt.Errorf("filesystem must be FAT32, exFAT, NTFS, ext2, ext3, or ext4, not %q", value)\n''',
          )

          replace_once(
              "internal/nonbootable/backend_linux.go",
              '''\tcase FilesystemExt4:\n\t\tname = "mkfs.ext4"\n\t\targs = append(args, "-F")\n\t\tif plan.Label != "" {\n\t\t\targs = append(args, "-L", plan.Label)\n\t\t}\n''',
              '''\tcase FilesystemExt2, FilesystemExt3, FilesystemExt4:\n\t\tname = "mkfs." + plan.Filesystem\n\t\targs = append(args, "-F")\n\t\tif plan.Label != "" {\n\t\t\targs = append(args, "-L", plan.Label)\n\t\t}\n''',
          )
          replace_once(
              "internal/nonbootable/backend_linux.go",
              '''\tcase FilesystemExt4:\n\t\treturn "e2fsck", []string{"-f", "-n", path}, nil\n''',
              '''\tcase FilesystemExt2, FilesystemExt3, FilesystemExt4:\n\t\treturn "e2fsck", []string{"-f", "-n", path}, nil\n''',
          )

          replace_once(
              "cmd/rufus-nonbootable-format/main.go",
              'flags.StringVar(&opts.filesystem, "filesystem", "fat32", "filesystem: fat32, exfat, ntfs, or ext4")',
              'flags.StringVar(&opts.filesystem, "filesystem", "fat32", "filesystem: fat32, exfat, ntfs, ext2, ext3, or ext4")',
          )
          replace_once(
              "cmd/rufus-nonbootable-format/main.go",
              '--filesystem fat32|exfat|ntfs|ext4',
              '--filesystem fat32|exfat|ntfs|ext2|ext3|ext4',
          )

          replace_once(
              "internal/nonbootable/plan_test.go",
              '''\t\t"exfat": FilesystemExFAT,\n\t\t"NTFS":  FilesystemNTFS,\n\t\t"ext4":  FilesystemExt4,\n''',
              '''\t\t"exfat": FilesystemExFAT,\n\t\t"NTFS":  FilesystemNTFS,\n\t\t"ext2":  FilesystemExt2,\n\t\t"EXT3":  FilesystemExt3,\n\t\t"ext4":  FilesystemExt4,\n''',
          )
          replace_once(
              "internal/nonbootable/plan_test.go",
              '''\t\tFilesystemExFAT: "exFAT",\n\t\tFilesystemNTFS:  "NTFS",\n\t\tFilesystemExt4:  "ext4",\n''',
              '''\t\tFilesystemExFAT: "exFAT",\n\t\tFilesystemNTFS:  "NTFS",\n\t\tFilesystemExt2:  "ext2",\n\t\tFilesystemExt3:  "ext3",\n\t\tFilesystemExt4:  "ext4",\n''',
          )
          replace_once(
              "internal/nonbootable/plan_test.go",
              'want: "FAT32, exFAT, NTFS, or ext4"',
              'want: "FAT32, exFAT, NTFS, ext2, ext3, or ext4"',
          )
          replace_once(
              "internal/nonbootable/plan_test.go",
              '''func TestBuildPlanRejectsUnsafeOrUnsupportedInput(t *testing.T) {\n''',
              '''func TestBuildPlanExt2AndExt3UseLinuxDataContracts(t *testing.T) {\n\tfor _, filesystem := range []string{FilesystemExt2, FilesystemExt3} {\n\t\trequest := baseRequest()\n\t\trequest.Scheme = SchemeMBR\n\t\trequest.Filesystem = filesystem\n\t\trequest.Label = "RUFUS-EXT"\n\t\tplan, err := BuildPlan(request)\n\t\tif err != nil {\n\t\t\tt.Fatalf("%s: %v", filesystem, err)\n\t\t}\n\t\tif plan.PartitionType != "83" || plan.FilesystemDisplay != filesystem {\n\t\t\tt.Fatalf("%s plan = %#v", filesystem, plan)\n\t\t}\n\t\twantTools := []string{"sfdisk", "blockdev", "mkfs." + filesystem, "e2fsck"}\n\t\tif !slices.Equal(plan.RequiredTools, wantTools) {\n\t\t\tt.Fatalf("%s tools = %#v, want %#v", filesystem, plan.RequiredTools, wantTools)\n\t\t}\n\t}\n}\n\nfunc TestBuildPlanRejectsUnsafeOrUnsupportedInput(t *testing.T) {\n''',
          )
          replace_once(
              "internal/nonbootable/plan_test.go",
              '"encoding/json"\n\t"strings"',
              '"encoding/json"\n\t"slices"\n\t"strings"',
          )

          replace_once(
              "internal/nonbootable/backend_contract_test.go",
              '''\t\tFilesystemNTFS:  {name: "ntfsfix", args: "-n /dev/sdb1"},\n\t\tFilesystemExt4:  {name: "e2fsck", args: "-f -n /dev/sdb1"},\n''',
              '''\t\tFilesystemNTFS:  {name: "ntfsfix", args: "-n /dev/sdb1"},\n\t\tFilesystemExt2:  {name: "e2fsck", args: "-f -n /dev/sdb1"},\n\t\tFilesystemExt3:  {name: "e2fsck", args: "-f -n /dev/sdb1"},\n\t\tFilesystemExt4:  {name: "e2fsck", args: "-f -n /dev/sdb1"},\n''',
          )

          replace_once(
              "internal/nonbootable/backend_loop_test.go",
              '''\t\t"mkfs.ntfs", "ntfsfix", "mkfs.ext4", "e2fsck",\n''',
              '''\t\t"mkfs.ntfs", "ntfsfix", "mkfs.ext2", "mkfs.ext3", "mkfs.ext4", "e2fsck",\n''',
          )
          replace_once(
              "internal/nonbootable/backend_loop_test.go",
              '''\t\t{name: "gpt-ntfs", scheme: SchemeGPT, filesystem: FilesystemNTFS, label: "RUFUS-NTFS"},\n\t\t{name: "mbr-ext4", scheme: SchemeMBR, filesystem: FilesystemExt4, label: "RUFUS-EXT4"},\n''',
              '''\t\t{name: "gpt-ntfs", scheme: SchemeGPT, filesystem: FilesystemNTFS, label: "RUFUS-NTFS"},\n\t\t{name: "gpt-ext2", scheme: SchemeGPT, filesystem: FilesystemExt2, label: "RUFUS-EXT2"},\n\t\t{name: "mbr-ext3", scheme: SchemeMBR, filesystem: FilesystemExt3, label: "RUFUS-EXT3"},\n\t\t{name: "mbr-ext4", scheme: SchemeMBR, filesystem: FilesystemExt4, label: "RUFUS-EXT4"},\n''',
          )

          replace_once(
              "gui/rufusarm64_nonbootable.py",
              '''    "ntfs": "NTFS",\n    "ext4": "ext4",\n''',
              '''    "ntfs": "NTFS",\n    "ext2": "ext2",\n    "ext3": "ext3",\n    "ext4": "ext4",\n''',
          )
          replace_once(
              "gui/rufusarm64_nonbootable.py",
              '''    "ntfs": ["sfdisk", "blockdev", "mkfs.ntfs", "ntfsfix"],\n    "ext4": ["sfdisk", "blockdev", "mkfs.ext4", "e2fsck"],\n''',
              '''    "ntfs": ["sfdisk", "blockdev", "mkfs.ntfs", "ntfsfix"],\n    "ext2": ["sfdisk", "blockdev", "mkfs.ext2", "e2fsck"],\n    "ext3": ["sfdisk", "blockdev", "mkfs.ext3", "e2fsck"],\n    "ext4": ["sfdisk", "blockdev", "mkfs.ext4", "e2fsck"],\n''',
          )
          replace_once(
              "gui/rufusarm64_nonbootable.py",
              '''    ("gpt", "ntfs"): "EBD0A0A2-B9E5-4433-87C0-68B6B72699C7",\n    ("gpt", "ext4"): "0FC63DAF-8483-4772-8E79-3D69D8477DE4",\n''',
              '''    ("gpt", "ntfs"): "EBD0A0A2-B9E5-4433-87C0-68B6B72699C7",\n    ("gpt", "ext2"): "0FC63DAF-8483-4772-8E79-3D69D8477DE4",\n    ("gpt", "ext3"): "0FC63DAF-8483-4772-8E79-3D69D8477DE4",\n    ("gpt", "ext4"): "0FC63DAF-8483-4772-8E79-3D69D8477DE4",\n''',
          )
          replace_once(
              "gui/rufusarm64_nonbootable.py",
              '''    ("mbr", "ntfs"): "07",\n    ("mbr", "ext4"): "83",\n''',
              '''    ("mbr", "ntfs"): "07",\n    ("mbr", "ext2"): "83",\n    ("mbr", "ext3"): "83",\n    ("mbr", "ext4"): "83",\n''',
          )
          replace_once(
              "gui/rufusarm64_nonbootable.py",
              'raise ValueError("Filesystem must be FAT32, exFAT, NTFS, or ext4.")',
              'raise ValueError("Filesystem must be FAT32, exFAT, NTFS, ext2, ext3, or ext4.")',
          )
          replace_once(
              "gui/rufusarm64_nonbootable.py",
              '''    elif filesystem == "ext4":\n        if len(value.encode("utf-8")) > 16:\n            raise ValueError("ext4 label exceeds 16 bytes.")\n''',
              '''    elif filesystem in {"ext2", "ext3", "ext4"}:\n        if len(value.encode("utf-8")) > 16:\n            raise ValueError(f"{filesystem} label exceeds 16 bytes.")\n''',
          )

          replace_once(
              "gui/rufusarm64_nonbootable_dialog.py",
              '''        self.filesystem.append("ntfs", "NTFS")\n        self.filesystem.append("ext4", "ext4")\n''',
              '''        self.filesystem.append("ntfs", "NTFS")\n        self.filesystem.append("ext2", "ext2")\n        self.filesystem.append("ext3", "ext3")\n        self.filesystem.append("ext4", "ext4")\n''',
          )
          replace_once(
              "gui/rufusarm64_nonbootable_dialog.py",
              'saved_filesystem if saved_filesystem in {"fat32", "exfat", "ntfs", "ext4"} else "fat32"',
              'saved_filesystem if saved_filesystem in {"fat32", "exfat", "ntfs", "ext2", "ext3", "ext4"} else "fat32"',
          )

          replace_once(
              "gui/test_nonbootable_format.py",
              '''    def test_success_report_must_match_reviewed_filesystem(self):\n''',
              '''    def test_ext2_and_ext3_plans_are_strictly_normalized(self):\n        for filesystem in ("ext2", "ext3"):\n            payload = sample_plan()\n            payload["plan"].update(\n                {\n                    "filesystem": filesystem,\n                    "filesystem_display": filesystem,\n                    "partition_type": "0FC63DAF-8483-4772-8E79-3D69D8477DE4",\n                    "required_tools": ["sfdisk", "blockdev", f"mkfs.{filesystem}", "e2fsck"],\n                }\n            )\n            payload["partition_table"].update(\n                {\n                    "filesystem": filesystem,\n                    "filesystem_display": filesystem,\n                    "partition_type": payload["plan"]["partition_type"],\n                }\n            )\n            payload["confirmation"] = f"FORMAT /dev/sdb AS {filesystem} USING GPT LABEL DATA"\n            normalized = normalize_plan(payload)\n            self.assertEqual(normalized["plan"]["filesystem"], filesystem)\n            self.assertEqual(confirmation_phrase(normalized), payload["confirmation"])\n\n    def test_success_report_must_match_reviewed_filesystem(self):\n''',
          )
          replace_once(
              "gui/test_nonbootable_dialog.py",
              '''    def test_unprivileged_plan_and_exact_confirmation_precede_authentication(self):\n''',
              '''    def test_ext2_and_ext3_choices_are_explicit(self):\n        self.assertIn('self.filesystem.append("ext2", "ext2")', self.dialog_class_source)\n        self.assertIn('self.filesystem.append("ext3", "ext3")', self.dialog_class_source)\n        self.assertIn('"ext2": ["sfdisk", "blockdev", "mkfs.ext2", "e2fsck"]', self.logic_source)\n        self.assertIn('"ext3": ["sfdisk", "blockdev", "mkfs.ext3", "e2fsck"]', self.logic_source)\n\n    def test_unprivileged_plan_and_exact_confirmation_precede_authentication(self):\n''',
          )

          replace_once(
              "README.md",
              "using FAT32, exFAT, NTFS, or ext4.",
              "using FAT32, exFAT, NTFS, ext2, ext3, or ext4.",
          )
          replace_once(
              "README.md",
              "for GPT or MBR and FAT32, exFAT, NTFS, or ext4.",
              "for GPT or MBR and FAT32, exFAT, NTFS, ext2, ext3, or ext4.",
          )
          replace_once(
              "docs/rufusarm64.1",
              "exFAT, NTFS, or ext4. RufusArm64 first runs an unprivileged dry-run, displays",
              "exFAT, NTFS, ext2, ext3, or ext4. RufusArm64 first runs an unprivileged dry-run, displays",
          )
          replace_once(
              "docs/rufusarm64-nonbootable-format.1",
              "exFAT, NTFS, or ext4, and verifies the published partition table, kernel",
              "exFAT, NTFS, ext2, ext3, or ext4, and verifies the published partition table, kernel",
          )
          replace_once(
              "docs/rufusarm64-nonbootable-format.1",
              "Linux filesystem-data type for ext4. MBR uses type 0x0c for FAT32, 0x07 for\nexFAT/NTFS, and 0x83 for ext4.",
              "Linux filesystem-data type for ext2, ext3, and ext4. MBR uses type 0x0c for FAT32, 0x07 for\nexFAT/NTFS, and 0x83 for ext2/ext3/ext4.",
          )
          replace_once(
              "docs/rufusarm64-nonbootable-format.1",
              '.BI --filesystem " fat32|exfat|ntfs|ext4"',
              '.BI --filesystem " fat32|exfat|ntfs|ext2|ext3|ext4"',
          )
          PY
          gofmt -w internal/nonbootable/plan.go internal/nonbootable/backend_linux.go internal/nonbootable/plan_test.go internal/nonbootable/backend_contract_test.go internal/nonbootable/backend_loop_test.go cmd/rufus-nonbootable-format/main.go
      - name: Run focused contracts
        run: |
          go test ./internal/nonbootable ./cmd/rufus-nonbootable-format
          python3 -m py_compile gui/rufusarm64_nonbootable.py gui/rufusarm64_nonbootable_dialog.py
          PYTHONPATH=gui python3 -m unittest gui.test_nonbootable_format gui.test_nonbootable_dialog
      - name: Commit product implementation
        id: product
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            internal/nonbootable/plan.go \
            internal/nonbootable/backend_linux.go \
            internal/nonbootable/plan_test.go \
            internal/nonbootable/backend_contract_test.go \
            internal/nonbootable/backend_loop_test.go \
            cmd/rufus-nonbootable-format/main.go \
            gui/rufusarm64_nonbootable.py \
            gui/rufusarm64_nonbootable_dialog.py \
            gui/test_nonbootable_format.py \
            gui/test_nonbootable_dialog.py \
            README.md docs/rufusarm64.1 docs/rufusarm64-nonbootable-format.1
          git commit -m "formatter: add guarded ext2 and ext3 data media [ext2-ext3-applied]"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Bind parity audit and remove applicator
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("docs/upstream-rufus-parity.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["generated_on"] = "2026-07-27"
          data["project"]["baseline"] = "stage4/0.15.0"
          data["project"]["baseline_commit"] = os.environ["PRODUCT_SHA"]
          row = next(item for item in data["features"] if item["id"] == "filesystems")
          row["status"] = "partial"
          row["notes"] = (
              "The guarded GPT/MBR data-only formatter implements FAT32, exFAT, NTFS, ext2, ext3, and ext4 "
              "with exact identity binding, confirmation, read-only filesystem checks, geometry/type/label readback, "
              "real loop qualification, CLI and GTK integration. UDF remains planned because no admitted Linux "
              "checker currently satisfies the existing post-format verification contract; ReFS has no verified "
              "Linux-native formatter and is not portable today."
          )
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "# Changelog\n\n"
          if "## Unreleased\n" not in text:
              text = text.replace(
                  marker,
                  marker + "## Unreleased\n\n- Added guarded ext2 and ext3 data-only formatting through the existing identity-bound GPT/MBR planner, exact confirmation, read-only e2fsck verification, strict CLI/GTK report contract, and real loop-device qualification.\n\n",
                  1,
              )
          changelog.write_text(text, encoding="utf-8")

          roadmap = Path("ROADMAP.md")
          text = roadmap.read_text(encoding="utf-8")
          anchor = "## 1.0 — supportable stable release\n"
          section = (
              "## 0.15 — Stage 4 filesystem and product parity (in progress)\n\n"
              "- Guarded ext2 and ext3 data-only formatting with real loop qualification\n"
              "- Remaining portable filesystem, appearance, localization, and distribution work selected from the pinned upstream audit\n"
              "- No weakening of identity, confirmation, cancellation, synchronization, or verification gates\n\n"
          )
          if section not in text:
              text = text.replace(anchor, section + anchor, 1)
          roadmap.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/apply-ext2-ext3-data-format.yml
          git add docs/upstream-rufus-parity.json CHANGELOG.md ROADMAP.md .github/workflows/apply-ext2-ext3-data-format.yml
          git commit -m "docs: record Stage 4 ext filesystem parity"
          git push origin HEAD:feature/ext2-ext3-data-format
