name: Patch FFU dialog localization once

on:
  pull_request:
    branches:
      - stage4/0.15.0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/gettext-ffu-review-dialog
      - name: Extend bounded gettext coverage to authenticated FFU review
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{label} changed")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          i18n = Path("gui/rufusarm64_i18n.py")
          replace_once(
              i18n,
              '    ("rufusarm64_device_qualify_dialog", "DriveImageBackupDialog"),\n    ("rufusarm64_nonbootable_dialog", "NonBootableFormatDialog"),',
              '    ("rufusarm64_device_qualify_dialog", "DriveImageBackupDialog"),\n    ("rufusarm64_ffu_dialog", "FFUReviewDialog"),\n    ("rufusarm64_nonbootable_dialog", "NonBootableFormatDialog"),',
              "secondary FFU class anchor",
          )
          additions = (
              (
                  '    N_("Advanced drive properties"),\n',
                  '    N_("Advanced drive properties"),\n    N_("After a successful unmounted-target review, type the displayed phrase exactly. Administrator authentication then reruns every source, policy, trust-generation, target and geometry check before any write."),\n',
                  "FFU destructive explanation anchor",
              ),
              (
                  '    N_("Apply"),\n',
                  '    N_("Apply"),\n    N_("Authenticated trust store"),\n',
                  "FFU trust-store label anchor",
              ),
              (
                  '    N_("Authenticate a supported FFU and review the exact removable target before experimental restoration."),\n',
                  '    N_("Authenticate a supported FFU and review the exact removable target before experimental restoration."),\n    N_("Authenticate and review"),\n',
                  "FFU review action anchor",
              ),
              (
                  '    N_("Cancel formatting"),\n',
                  '    N_("Cancel formatting"),\n    N_("Cancel restore"),\n',
                  "FFU cancel action anchor",
              ),
              (
                  '    N_("Choose a destination file."),\n',
                  '    N_("Choose a destination file."),\n    N_("Choose all three explicit trust inputs."),\n',
                  "FFU opening status anchor",
              ),
              (
                  '    N_("No qualification report is available yet."),\n',
                  '    N_("No qualification report is available yet."),\n    N_("No review has been performed. The ordinary Create USB action remains disabled for FFU images."),\n',
                  "FFU empty review anchor",
              ),
              (
                  '    N_("Preparing…"),\n',
                  '    N_("Preparing…"),\n    N_("Publisher policy"),\n',
                  "FFU publisher policy anchor",
              ),
              (
                  '    N_("Restore / format…"),\n',
                  '    N_("Restore / format…"),\n    N_("Restore authenticated FFU"),\n',
                  "FFU restore action anchor",
              ),
              (
                  '    N_("Review FFU…"),\n',
                  '    N_("Review FFU…"),\n    N_("Review Full Flash Update"),\n',
                  "FFU title anchor",
              ),
              (
                  '    N_("Type the exact SAVE phrase"),\n',
                  '    N_("Trust-metadata policy"),\n    N_("Type the exact SAVE phrase"),\n',
                  "FFU metadata policy anchor",
              ),
          )
          for old, new, label in additions:
              replace_once(i18n, old, new, label)

          tests = Path("gui/test_i18n.py")
          replace_once(
              tests,
              '        names = ("rufusarm64_checksums", "rufusarm64_device_qualify_dialog", "rufusarm64_nonbootable_dialog", "rufusarm64_freedos_dialog")',
              '        names = ("rufusarm64_checksums", "rufusarm64_device_qualify_dialog", "rufusarm64_ffu_dialog", "rufusarm64_nonbootable_dialog", "rufusarm64_freedos_dialog")',
              "secondary test module list",
          )
          replace_once(
              tests,
              '            self.assertEqual([dialog.marker for dialog in dialogs], ["dialog-0", "dialog-1", "dialog-2", "dialog-3", "dialog-4"])',
              '            self.assertEqual([dialog.marker for dialog in dialogs], ["dialog-0", "dialog-1", "dialog-2", "dialog-3", "dialog-4", "dialog-5"])',
              "secondary test marker list",
          )
          replace_once(
              tests,
              '        self.assertIn(\'msgid "Save drive image"\', text)\n',
              '        self.assertIn(\'msgid "Save drive image"\', text)\n        self.assertIn(\'msgid "Review Full Flash Update"\', text)\n',
              "FFU POT assertion anchor",
          )
          replace_once(
              tests,
              '            "WRITE FREEDOS /dev",\n',
              '            "WRITE FREEDOS /dev",\n            "RESTORE AUTHENTICATED FFU TO /dev",\n',
              "FFU POT exclusion anchor",
          )

          tuple_anchor = '                ("rufusarm64_device_qualify_dialog", "DriveImageBackupDialog"),\n                ("rufusarm64_nonbootable_dialog", "NonBootableFormatDialog"),'
          tuple_replacement = '                ("rufusarm64_device_qualify_dialog", "DriveImageBackupDialog"),\n                ("rufusarm64_ffu_dialog", "FFUReviewDialog"),\n                ("rufusarm64_nonbootable_dialog", "NonBootableFormatDialog"),'
          for filename in ("gui/test_checksum_dialog_i18n.py", "gui/test_device_qualification_i18n.py"):
              replace_once(Path(filename), tuple_anchor, tuple_replacement, f"FFU exact class set in {filename}")

          contract = Path("gui/test_guarded_dialog_i18n_contract.py")
          replace_once(
              contract,
              'CHECKSUM_DIALOG = ROOT / "gui" / "rufusarm64_checksums.py"\n',
              'CHECKSUM_DIALOG = ROOT / "gui" / "rufusarm64_checksums.py"\nFFU_DIALOG = ROOT / "gui" / "rufusarm64_ffu_dialog.py"\n',
              "FFU contract path anchor",
          )
          replace_once(
              contract,
              '            \'("rufusarm64_device_qualify_dialog", "DriveImageBackupDialog")\',\n',
              '            \'("rufusarm64_device_qualify_dialog", "DriveImageBackupDialog")\',\n            \'("rufusarm64_ffu_dialog", "FFUReviewDialog")\',\n',
              "FFU contract class marker anchor",
          )
          replace_once(
              contract,
              '            \'N_("Save drive image")\',\n',
              '            \'N_("Save drive image")\',\n            \'N_("Review Full Flash Update")\',\n',
              "FFU contract catalog marker anchor",
          )
          replace_once(
              contract,
              '            \'N_("WRITE FREEDOS /dev\',\n',
              '            \'N_("WRITE FREEDOS /dev\',\n            \'N_("RESTORE AUTHENTICATED FFU TO /dev\',\n',
              "FFU contract forbidden anchor",
          )
          ffu_contract_test = dedent('''

              def test_ffu_operation_source_remains_localization_free_and_evidence_bound(self):
                  text = FFU_DIALOG.read_text(encoding="utf-8")
                  self.assertNotIn("rufusarm64_i18n", text)
                  for marker in (
                      "command = build_ffu_review_command(",
                      "command = build_ffu_restore_command(",
                      'self.review.get("exact_confirmation_phrase")',
                      "expected_review = copy.deepcopy(self.review_payload)",
                      "normalized = normalize_ffu_restore_output(payload, expected_review)",
                      "strict_json_loads(stdout)",
                      "communicate_bounded(",
                      "start_new_session=True",
                      "os.killpg(process.pid, signal.SIGTERM)",
                      "json.dumps(payload, indent=2, sort_keys=True)",
                  ):
                      self.assertIn(marker, text)
          ''')
          replace_once(
              contract,
              '\n\nif __name__ == "__main__":\n',
              ffu_contract_test + '\n\nif __name__ == "__main__":\n',
              "FFU contract test ending",
          )

          ffu_test = dedent('''
              from pathlib import Path
              import sys
              import tempfile
              import unittest


              GUI_DIR = Path(__file__).resolve().parent
              if str(GUI_DIR) not in sys.path:
                  sys.path.insert(0, str(GUI_DIR))

              from test_i18n import Button, Entry, Label, TextView, Window, load_i18n_module, write_mo


              FFU_DIALOG = GUI_DIR / "rufusarm64_ffu_dialog.py"


              class FFUDialogLocalizationTests(unittest.TestCase):
                  def test_static_shell_translates_with_real_catalog_and_preserves_trust_target_confirmation_and_evidence(self):
                      module, _ = load_i18n_module()
                      destructive_source = (
                          "After a successful unmounted-target review, type the displayed phrase exactly. "
                          "Administrator authentication then reruns every source, policy, trust-generation, "
                          "target and geometry check before any write."
                      )
                      warning_source = (
                          "Experimental FFU provider — authenticate and review first. Restoration is available only for an "
                          "already-unmounted removable whole disk and destroys data on the exact reviewed target."
                      )
                      translations = {
                          "Review Full Flash Update": "Examiner la mise à jour Flash complète",
                          "Close": "Fermer",
                          "Authenticated trust store": "Magasin de confiance authentifié",
                          "Trust-metadata policy": "Politique de métadonnées de confiance",
                          "Publisher policy": "Politique de l'éditeur",
                          "Authenticate and review": "Authentifier et examiner",
                          "Choose all three explicit trust inputs.": "Choisissez les trois entrées de confiance explicites.",
                          "No review has been performed. The ordinary Create USB action remains disabled for FFU images.": "Aucun examen n'a été effectué et l'action USB ordinaire reste désactivée.",
                          destructive_source: "Après un examen réussi, saisissez exactement la phrase affichée avant toute écriture.",
                          "Restore authenticated FFU": "Restaurer le FFU authentifié",
                          "Cancel restore": "Annuler la restauration",
                      }
                      with tempfile.TemporaryDirectory() as directory:
                          locale_root = Path(directory)
                          write_mo(locale_root / "zz" / "LC_MESSAGES" / "rufusarm64.mo", translations)
                          translation = module.load_translation(str(locale_root), ["zz"])

                          warning = Label(warning_source)
                          image_target = Label("Image: /tmp/device.ffu\\nTarget: /dev/sdz — Vendor Model")
                          trust_label = Label("Authenticated trust store")
                          metadata_label = Label("Trust-metadata policy")
                          publisher_label = Label("Publisher policy")
                          review = Button("Authenticate and review")
                          status = Label("Choose all three explicit trust inputs.")
                          result = TextView("No review has been performed. The ordinary Create USB action remains disabled for FFU images.")
                          destructive = Label(destructive_source)
                          confirmation = Entry("RESTORE AUTHENTICATED FFU TO /dev/DEVICE SIZE N BYTES")
                          restore = Button("Restore authenticated FFU")
                          cancel = Button("Cancel restore")
                          close = Button("Close")

                          trust_path = Label("/etc/rufusarm64/ffu-trust")
                          metadata_path = Label("/etc/rufusarm64/metadata-policy.json")
                          publisher_path = Label("/etc/rufusarm64/publisher-policy.json")
                          exact_phrase = Label("RESTORE AUTHENTICATED FFU TO /dev/sdz SIZE 1048576 BYTES")
                          evidence = TextView('{"target_identity":"serial:abc","outcome":"verified"}')
                          dynamic_status = Label("Authenticated read-only review passed.")

                          dialog = Window(
                              title="Review Full Flash Update",
                              children=[
                                  warning,
                                  image_target,
                                  trust_label,
                                  metadata_label,
                                  publisher_label,
                                  review,
                                  status,
                                  result,
                                  destructive,
                                  confirmation,
                                  restore,
                                  cancel,
                                  close,
                                  trust_path,
                                  metadata_path,
                                  publisher_path,
                                  exact_phrase,
                                  evidence,
                                  dynamic_status,
                              ],
                          )

                          self.assertFalse(module.translate_widget_tree(dialog, translation))
                          self.assertEqual(dialog.title, translations["Review Full Flash Update"])
                          self.assertEqual(trust_label.text, translations["Authenticated trust store"])
                          self.assertEqual(metadata_label.text, translations["Trust-metadata policy"])
                          self.assertEqual(publisher_label.text, translations["Publisher policy"])
                          self.assertEqual(review.label, translations["Authenticate and review"])
                          self.assertEqual(status.text, translations["Choose all three explicit trust inputs."])
                          self.assertEqual(result.buffer.text, translations["No review has been performed. The ordinary Create USB action remains disabled for FFU images."])
                          self.assertEqual(destructive.text, translations[destructive_source])
                          self.assertEqual(restore.label, translations["Restore authenticated FFU"])
                          self.assertEqual(cancel.label, translations["Cancel restore"])
                          self.assertEqual(close.label, translations["Close"])

                          self.assertEqual(warning.text, warning_source)
                          self.assertEqual(image_target.text, "Image: /tmp/device.ffu\\nTarget: /dev/sdz — Vendor Model")
                          self.assertEqual(confirmation.placeholder, "RESTORE AUTHENTICATED FFU TO /dev/DEVICE SIZE N BYTES")
                          self.assertEqual(trust_path.text, "/etc/rufusarm64/ffu-trust")
                          self.assertEqual(metadata_path.text, "/etc/rufusarm64/metadata-policy.json")
                          self.assertEqual(publisher_path.text, "/etc/rufusarm64/publisher-policy.json")
                          self.assertEqual(exact_phrase.text, "RESTORE AUTHENTICATED FFU TO /dev/sdz SIZE 1048576 BYTES")
                          self.assertEqual(evidence.buffer.text, '{"target_identity":"serial:abc","outcome":"verified"}')
                          self.assertEqual(dynamic_status.text, "Authenticated read-only review passed.")

                  def test_exact_secondary_class_set_includes_ffu_once(self):
                      module, _ = load_i18n_module()
                      self.assertEqual(
                          module.SECONDARY_DIALOG_CLASSES,
                          (
                              ("rufusarm64_checksums", "ChecksumDialog"),
                              ("rufusarm64_device_qualify_dialog", "DeviceQualificationDialog"),
                              ("rufusarm64_device_qualify_dialog", "DriveImageBackupDialog"),
                              ("rufusarm64_ffu_dialog", "FFUReviewDialog"),
                              ("rufusarm64_nonbootable_dialog", "NonBootableFormatDialog"),
                              ("rufusarm64_freedos_dialog", "FreeDOSFormatDialog"),
                          ),
                      )

                  def test_ffu_source_keeps_warning_chooser_confirmation_and_operation_contracts_outside_localization(self):
                      text = FFU_DIALOG.read_text(encoding="utf-8")
                      self.assertNotIn("rufusarm64_i18n", text)
                      for marker in (
                          "Experimental FFU provider",
                          "Choose the authenticated FFU trust-store folder",
                          "Choose the FFU trust-metadata public-key policy",
                          "Choose the explicit FFU publisher policy",
                          "RESTORE AUTHENTICATED FFU TO /dev/DEVICE SIZE N BYTES",
                          'self.review.get("exact_confirmation_phrase")',
                          "build_ffu_review_command(",
                          "build_ffu_restore_command(",
                          "normalize_ffu_restore_output(payload, expected_review)",
                      ):
                          self.assertIn(marker, text)


              if __name__ == "__main__":
                  unittest.main()
          ''').lstrip()
          Path("gui/test_ffu_dialog_i18n.py").write_text(ffu_test, encoding="utf-8")

          release = Path("docs/release-0.15.0.md")
          replace_once(
              release,
              "- Static opening-state localization for read-only drive-image backup while preserving source/destination binding, generated SAVE confirmation, progress accounting, reports, publication, and process ownership.\n",
              "- Static opening-state localization for read-only drive-image backup while preserving source/destination binding, generated SAVE confirmation, progress accounting, reports, publication, and process ownership.\n- Static opening-state localization for authenticated experimental FFU review/restore while preserving trust inputs, source/target binding, exact confirmation, evidence, cancellation, and verification.\n",
              "FFU release note anchor",
          )
          replace_once(
              release,
              "- Generated `FORMAT ...` and `WRITE FREEDOS ...` confirmation phrases, comparison logic, selected values, machine-readable JSON, command flags, paths, identities, filesystem planner values, diagnostic/report schemas, and dynamic evidence remain byte-stable and untranslated.\n",
              "- Generated `FORMAT ...`, `WRITE FREEDOS ...`, `SAVE ...`, and `RESTORE AUTHENTICATED FFU ...` confirmation phrases, comparison logic, selected values, machine-readable JSON, command flags, paths, identities, filesystem planner values, diagnostic/report schemas, and dynamic evidence remain byte-stable and untranslated.\n",
              "FFU release safety anchor",
          )

          localization = Path("docs/localization.md")
          replace_once(
              localization,
              "The read-only drive-image backup dialog follows the same static-shell boundary. Source and destination paths, remembered directories, generated `SAVE ...` text, exact comparison, plans, byte totals, progress evidence, JSON reports, diagnostics, ownership/type/size checks, no-replace publication, process-group cancellation, parent-window logs, and dynamic status remain untranslated.\n",
              "The read-only drive-image backup dialog follows the same static-shell boundary. Source and destination paths, remembered directories, generated `SAVE ...` text, exact comparison, plans, byte totals, progress evidence, JSON reports, diagnostics, ownership/type/size checks, no-replace publication, process-group cancellation, parent-window logs, and dynamic status remain untranslated.\n\nThe authenticated experimental FFU dialog is limited to its static opening shell. Warning markup, image/target summary, trust and policy paths, file-chooser text, generated `RESTORE AUTHENTICATED FFU ...` confirmation, exact comparison, immutable review evidence, restore reports, diagnostics, dynamic status, cancellation evidence, and final safety messages remain untranslated.\n",
              "FFU localization guide anchor",
          )
          replace_once(
              localization,
              "- Wording that describes an exact confirmation phrase may be translated, but the generated `FORMAT ...` and `WRITE FREEDOS ...` values themselves must never be added to a catalog.\n",
              "- Wording that describes an exact confirmation phrase may be translated, but generated `FORMAT ...`, `WRITE FREEDOS ...`, `SAVE ...`, and `RESTORE AUTHENTICATED FFU ...` values themselves must never be added to a catalog.\n",
              "FFU translator contract anchor",
          )

          roadmap = Path("ROADMAP.md")
          replace_once(
              roadmap,
              "- Static opening-state localization for descriptor-bound read-only drive-image backup without changing publication or verification\n",
              "- Static opening-state localization for descriptor-bound read-only drive-image backup without changing publication or verification\n- Static opening-state localization for authenticated experimental FFU review/restore without changing trust, target, evidence, or verification\n",
              "FFU roadmap anchor",
          )

          changelog = Path("CHANGELOG.md")
          replace_once(
              changelog,
              "- Extended exact static localization to read-only drive-image backup while preserving source/destination binding, generated SAVE confirmation, byte accounting, reports, no-replace publication, ownership checks, cancellation, and verification byte-for-byte.\n",
              "- Extended exact static localization to read-only drive-image backup while preserving source/destination binding, generated SAVE confirmation, byte accounting, reports, no-replace publication, ownership checks, cancellation, and verification byte-for-byte.\n- Extended exact static localization to authenticated experimental FFU review/restore while preserving trust inputs, source/target identity, generated restore confirmation, immutable evidence, privileged execution, cancellation, and complete verification byte-for-byte.\n",
              "FFU changelog anchor",
          )

          parity = Path("docs/upstream-rufus-parity.json")
          old = "A standard GNU gettext runtime, deterministic source-only POT, package closure, safe English fallback, and exact post-construction translation are implemented for the primary window plus static opening shells for guarded data-only formatting, FreeDOS creation, read-only image checksums, destructive USB qualification, and read-only drive-image backup. Generated confirmation values, comparison logic, profile IDs, source/destination paths, identities, calculated digests, plans, byte/progress evidence, reports, machine-readable JSON, flags, publication checks, dynamic status, diagnostics, and report schemas remain byte-stable. Broader secondary-dialog and dynamic status/diagnostic migration, plural review, completed language packs, and full translation-aware accessibility review remain planned."
          new = "A standard GNU gettext runtime, deterministic source-only POT, package closure, safe English fallback, and exact post-construction translation are implemented for the primary window plus static opening shells for guarded data-only formatting, FreeDOS creation, read-only image checksums, destructive USB qualification, read-only drive-image backup, and authenticated experimental FFU review/restore. Generated confirmation values, comparison logic, profile IDs, trust inputs, source/destination paths, target identities, calculated digests, immutable review evidence, plans, byte/progress evidence, restore reports, machine-readable JSON, flags, publication checks, dynamic status, diagnostics, cancellation evidence, and report schemas remain byte-stable. Broader secondary-dialog and dynamic status/diagnostic migration, plural review, completed language packs, and full translation-aware accessibility review remain planned."
          replace_once(parity, old, new, "FFU localization parity anchor")
          PY
          python3 scripts/update-pot.py
          python3 -m py_compile \
            gui/rufusarm64_i18n.py \
            gui/test_i18n.py \
            gui/test_checksum_dialog_i18n.py \
            gui/test_device_qualification_i18n.py \
            gui/test_guarded_dialog_i18n_contract.py \
            gui/test_ffu_dialog_i18n.py
          python3 -m unittest discover -s gui -p 'test_*i18n.py'
          git rm .github/workflows/patch-ffu-dialog-i18n-once.yml
          git add \
            CHANGELOG.md \
            ROADMAP.md \
            docs/localization.md \
            docs/release-0.15.0.md \
            docs/upstream-rufus-parity.json \
            gui/rufusarm64_i18n.py \
            gui/test_checksum_dialog_i18n.py \
            gui/test_device_qualification_i18n.py \
            gui/test_ffu_dialog_i18n.py \
            gui/test_guarded_dialog_i18n_contract.py \
            gui/test_i18n.py \
            po/rufusarm64.pot
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "i18n: translate the authenticated FFU review shell"
          git push origin HEAD:feature/gettext-ffu-review-dialog
