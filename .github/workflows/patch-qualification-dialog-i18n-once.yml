name: Patch qualification dialog localization once

on:
  push:
    branches:
      - feature/gettext-device-qualification-dialog

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/gettext-device-qualification-dialog
      - name: Extend bounded gettext coverage to USB qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          i18n = Path("gui/rufusarm64_i18n.py")
          text = i18n.read_text(encoding="utf-8")
          anchor = '    ("rufusarm64_checksums", "ChecksumDialog"),\n'
          replacement = anchor + '    ("rufusarm64_device_qualify_dialog", "DeviceQualificationDialog"),\n'
          if text.count(anchor) != 1:
              raise SystemExit("secondary dialog class anchor changed")
          text = text.replace(anchor, replacement, 1)
          additions = {
              '    N_("Cancel formatting"),\n': '    N_("Cancel formatting"),\n    N_("Cancel test"),\n',
              '    N_("Check USB capacity and blocks"),\n': '    N_("Check USB capacity and blocks"),\n    N_("Check USB drive"),\n',
              '    N_("No formatting report is available yet."),\n': '    N_("No formatting report is available yet."),\n    N_("No qualification report is available yet."),\n',
              '    N_("Preparing a read-only plan…"),\n': '    N_("Preparing a read-only plan…"),\n    N_("Preparing…"),\n',
              '    N_("Run a read-only validation of a mounted or extracted UEFI media folder"),\n': '    N_("Run a read-only validation of a mounted or extracted UEFI media folder"),\n    N_("Run USB check"),\n',
              '    N_("Save drive image…"),\n': '    N_("Save drive image…"),\n    N_("Save report…"),\n',
              '    N_("Target system"),\n': '    N_("Target system"),\n    N_("Test profile"),\n',
              '    N_("This separate workflow erases the complete selected removable drive and constructs one deterministic FAT32 FreeDOS volume from checksum-pinned package payloads."),\n': '    N_("This is a separate destructive USB qualification test. It overwrites every tested region and does not preserve files or partitions. The normal Create USB workflow is not changed."),\n    N_("This separate workflow erases the complete selected removable drive and constructs one deterministic FAT32 FreeDOS volume from checksum-pinned package payloads."),\n',
              '    N_("Review the final destructive warning for the selected image and exact USB drive."),\n': '    N_("Review the final destructive warning for the selected image and exact USB drive."),\n    N_("Running the test will erase data in every selected test region. A full test is intended for an empty USB drive."),\n',
              '    N_("Calculate MD5, SHA-1, SHA-256, and SHA-512 for the selected image without modifying it."),\n': '    N_("Calculate MD5, SHA-1, SHA-256, and SHA-512 for the selected image without modifying it."),\n    N_("Calculating a read-only plan…"),\n',
          }
          for source, replacement in additions.items():
              if text.count(source) != 1:
                  raise SystemExit(f"qualification catalog anchor changed: {source!r}")
              text = text.replace(source, replacement, 1)
          i18n.write_text(text, encoding="utf-8")

          tests = Path("gui/test_i18n.py")
          text = tests.read_text(encoding="utf-8")
          old_names = '        names = ("rufusarm64_checksums", "rufusarm64_nonbootable_dialog", "rufusarm64_freedos_dialog")\n'
          new_names = '        names = ("rufusarm64_checksums", "rufusarm64_device_qualify_dialog", "rufusarm64_nonbootable_dialog", "rufusarm64_freedos_dialog")\n'
          old_expected = '            self.assertEqual([dialog.marker for dialog in dialogs], ["dialog-0", "dialog-1", "dialog-2"])\n'
          new_expected = '            self.assertEqual([dialog.marker for dialog in dialogs], ["dialog-0", "dialog-1", "dialog-2", "dialog-3"])\n'
          for source, replacement in ((old_names, new_names), (old_expected, new_expected)):
              if text.count(source) != 1:
                  raise SystemExit("secondary installer test anchor changed")
              text = text.replace(source, replacement, 1)
          pot_anchor = '        self.assertIn(\'msgid "Image checksums"\', text)\n'
          if text.count(pot_anchor) != 1:
              raise SystemExit("qualification POT test anchor changed")
          text = text.replace(
              pot_anchor,
              pot_anchor + '        self.assertIn(\'msgid "Check USB drive"\', text)\n',
              1,
          )
          tests.write_text(text, encoding="utf-8")

          contract = Path("gui/test_guarded_dialog_i18n_contract.py")
          text = contract.read_text(encoding="utf-8")
          class_anchor = '            \'("rufusarm64_checksums", "ChecksumDialog")\',\n'
          if text.count(class_anchor) != 1:
              raise SystemExit("qualification contract class anchor changed")
          text = text.replace(
              class_anchor,
              class_anchor + '            \'("rufusarm64_device_qualify_dialog", "DeviceQualificationDialog")\',\n',
              1,
          )
          check_anchor = '            \'N_("Image checksums")\',\n'
          if text.count(check_anchor) != 1:
              raise SystemExit("qualification contract catalog anchor changed")
          text = text.replace(
              check_anchor,
              check_anchor + '            \'N_("Check USB drive")\',\n',
              1,
          )
          contract.write_text(text, encoding="utf-8")

          updates = (
              (
                  "docs/release-0.15.0.md",
                  "- Static opening-state localization for the unprivileged read-only image checksum dialog while preserving the selected path, calculated digests, reports, and helper workflow.\n",
                  "- Static opening-state localization for the unprivileged read-only image checksum dialog while preserving the selected path, calculated digests, reports, and helper workflow.\n- Static opening-state localization for destructive USB qualification while preserving profile IDs, target identity, generated erase confirmation, plans, JSON evidence, and execution.\n",
              ),
              (
                  "docs/localization.md",
                  "The same centralized wrapper covers the read-only image checksum dialog's static opening shell. The selected image path, calculated digest values, generated report, helper errors, clipboard content, and dynamic running/completion status remain untranslated.\n",
                  "The same centralized wrapper covers the read-only image checksum dialog's static opening shell. The selected image path, calculated digest values, generated report, helper errors, clipboard content, and dynamic running/completion status remain untranslated.\n\nThe destructive USB qualification dialog is limited to static opening-shell text. Canonical `quick` and `full` profile IDs, their current combo presentation labels, the selected target and identity, generated `ERASE <device>` text, exact comparison, plans, JSON reports, diagnostics, save paths, and dynamic status remain untranslated.\n",
              ),
              (
                  "ROADMAP.md",
                  "- Static opening-state localization for the descriptor-bound read-only image checksum dialog\n",
                  "- Static opening-state localization for the descriptor-bound read-only image checksum dialog\n- Static opening-state localization for identity-bound destructive USB qualification without changing profile IDs or evidence\n",
              ),
              (
                  "CHANGELOG.md",
                  "- Extended exact static localization to the read-only image checksum dialog while preserving selected paths, calculated digests, report and clipboard content, helper execution, and diagnostic logging byte-for-byte.\n",
                  "- Extended exact static localization to the read-only image checksum dialog while preserving selected paths, calculated digests, report and clipboard content, helper execution, and diagnostic logging byte-for-byte.\n- Extended exact static localization to destructive USB qualification while preserving profile IDs, target identity, generated erase confirmation, plans, JSON evidence, file rules, execution, and verification byte-for-byte.\n",
              ),
          )
          for filename, source, replacement in updates:
              path = Path(filename)
              value = path.read_text(encoding="utf-8")
              if value.count(source) != 1:
                  raise SystemExit(f"qualification documentation anchor changed: {filename}")
              path.write_text(value.replace(source, replacement, 1), encoding="utf-8")

          parity = Path("docs/upstream-rufus-parity.json")
          text = parity.read_text(encoding="utf-8")
          old = "A standard GNU gettext runtime, deterministic source-only POT, package closure, safe English fallback, and exact post-construction translation are implemented for the primary window plus the static opening shells of guarded data-only formatting, FreeDOS creation, and read-only image checksums. Generated confirmation values, comparison logic, selected paths/values, calculated digests, reports, machine-readable JSON, flags, identities, planner values, dynamic status, diagnostics, and report schemas remain byte-stable. Broader secondary-dialog and dynamic status/diagnostic migration, plural review, completed language packs, and full translation-aware accessibility review remain planned."
          new = "A standard GNU gettext runtime, deterministic source-only POT, package closure, safe English fallback, and exact post-construction translation are implemented for the primary window plus static opening shells for guarded data-only formatting, FreeDOS creation, read-only image checksums, and destructive USB qualification. Generated confirmation values, comparison logic, profile IDs, selected paths/values, identities, calculated digests, plans, reports, machine-readable JSON, flags, dynamic status, diagnostics, and report schemas remain byte-stable. Broader secondary-dialog and dynamic status/diagnostic migration, plural review, completed language packs, and full translation-aware accessibility review remain planned."
          if text.count(old) != 1:
              raise SystemExit("qualification parity anchor changed")
          parity.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python3 scripts/update-pot.py
          python3 -m py_compile gui/rufusarm64_i18n.py gui/test_i18n.py gui/test_guarded_dialog_i18n_contract.py
          git rm .github/workflows/patch-qualification-dialog-i18n-once.yml
          git add CHANGELOG.md ROADMAP.md docs/localization.md docs/release-0.15.0.md docs/upstream-rufus-parity.json gui/rufusarm64_i18n.py gui/test_i18n.py gui/test_guarded_dialog_i18n_contract.py po/rufusarm64.pot
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "i18n: translate the USB qualification dialog shell"
          git push origin HEAD:feature/gettext-device-qualification-dialog
