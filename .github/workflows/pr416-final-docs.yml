name: Finalize PR 416 documentation

on:
  push:
    branches:
      - parity/rufus-4.15-regressions

permissions:
  contents: write

concurrency:
  group: finalize-pr416-docs
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: parity/rufus-4.15-regressions
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.x'
      - name: Update changelog and inspection contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          anchor = '## Unreleased\n\n'
          additions = (
              '- Added guarded Windows UEFI CA 2023 bootloader replacement for qualified Windows 11 client UEFI/FAT32 media, with three-way architecture binding, staged certificate evidence, DBX checks, exact destination replacement, and mandatory SHA-256 readback; NTFS remains explicitly outside the CA 2023-only boundary.\n'
              '- Added direct SquashFS recognition without promoting a bare filesystem to automatic bootable-media status; strengthened WIM/ESD/SWM ambiguity and size bounds, GTK runtime-validation state tests, and cancellation between partial writes during raw and compressed-image preparation.\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one Unreleased anchor, found {text.count(anchor)}')
          if additions not in text:
              text = text.replace(anchor, anchor + additions)
          changelog.write_text(text, encoding='utf-8')

          inspect = Path('internal/imaging/inspect.go')
          text = inspect.read_text(encoding='utf-8')
          old = '''// InspectImage performs a small, read-only preflight inspection. It does not\n// claim to prove that media will boot; it rejects files that have neither a\n// coherent disk-image layout nor an aligned optical-filesystem signature.\n'''
          new = '''// InspectImage performs a small, read-only preflight inspection. It does not\n// claim to prove that media will boot; it reports coherent disk layouts, aligned\n// optical filesystems, and explicitly supported direct-filesystem superblocks.\n// Destructive mode selection separately decides which evidence is sufficient.\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one inspection comment anchor, found {text.count(old)}')
          inspect.write_text(text.replace(old, new), encoding='utf-8')
          PY
          gofmt -w internal/imaging/inspect.go
          go test ./internal/imaging ./cmd/rufus-linux ./internal/windowsmedia
      - name: Publish documentation and remove finalizer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr416-final-docs.yml
          git add CHANGELOG.md internal/imaging/inspect.go
          git commit -m "docs: record CA 2023 and regression tranche"
          git push origin HEAD:parity/rufus-4.15-regressions
