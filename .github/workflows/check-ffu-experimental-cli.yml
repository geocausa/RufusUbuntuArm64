name: Validate experimental FFU CLI provider

on:
  push:
    branches: [feature/ffu-experimental-cli-provider]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.22.x'
          cache: true
      - name: Apply CLI wiring and format
        run: |
          python3 scripts/patch-ffu-experimental-cli.py
          gofmt -w cmd/rufus-linux/main.go cmd/rufus-linux/ffu_linux.go cmd/rufus-linux/ffu_linux_test.go
      - name: Test CLI and FFU packages
        run: |
          set +e
          go test -count=1 ./cmd/rufus-linux ./internal/ffu 2>&1 | tee /tmp/ffu-cli-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/ffu-cli-test.log cmd/rufus-linux/ffu_cli_diagnostic.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add cmd/rufus-linux/ffu_cli_diagnostic.txt
            git commit -m "Diagnostic: capture FFU CLI failure"
            git push origin "HEAD:feature/ffu-experimental-cli-provider"
            exit "$status"
          fi
      - name: Vet CLI and FFU packages
        run: go vet ./cmd/rufus-linux ./internal/ffu
      - name: Race CLI and FFU packages
        run: go test -race -count=1 ./cmd/rufus-linux ./internal/ffu
      - name: Staticcheck CLI and FFU packages
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          "$(go env GOPATH)/bin/staticcheck" ./cmd/rufus-linux ./internal/ffu
      - name: Cross-compile ARM64 CLI and FFU package
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/rufusarm64-cli ./cmd/rufus-linux
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go test -c ./internal/ffu -o /tmp/ffu-arm64.test
      - name: Publish clean product tree
        env:
          BRANCH: feature/ffu-experimental-cli-provider
        run: |
          git rm .github/workflows/check-ffu-experimental-cli.yml scripts/patch-ffu-experimental-cli.py
          git rm -f cmd/rufus-linux/ffu_cli_diagnostic.txt || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cmd/rufus-linux/main.go cmd/rufus-linux/ffu_linux.go cmd/rufus-linux/ffu_linux_test.go docs/ffu-experimental-cli-provider.md
          git commit -m "FFU: expose experimental single-process CLI provider"
          git push origin "HEAD:${BRANCH}"
