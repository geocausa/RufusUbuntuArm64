name: Drive backup package normalization

on:
  pull_request:
    branches:
      - stage3/0.14.0
    paths:
      - '.github/workflows/drivebackup-development-diagnostics.yml'

permissions:
  contents: write

jobs:
  normalize-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Keep one packaged format extension
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/build-deb.sh')
          text = path.read_text(encoding='utf-8')
          block = '''install -Dm644 "${ROOT_DIR}/gui/rufusarm64_drive_backup_formats.py" \\
            "${PACKAGE_DIR}/usr/lib/rufusarm64/rufusarm64_drive_backup_formats.py"
          '''
          while block + block in text:
              text = text.replace(block + block, block)
          if text.count(block) != 1:
              raise SystemExit('package format module install is missing or duplicated')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test "$(grep -Fc 'gui/rufusarm64_drive_backup_formats.py' scripts/build-deb.sh)" -eq 1
      - name: Commit package normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/build-deb.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'packaging: normalize drive backup format module'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
