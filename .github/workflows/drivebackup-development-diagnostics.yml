name: Drive backup development diagnostics

on:
  pull_request:
    branches:
      - stage3/0.14.0
    paths:
      - 'cmd/rufus-device-backup/**'
      - 'internal/drivebackup/**'
      - 'internal/trustedexec/**'
      - 'gui/rufusarm64_device_qualify.py'
      - 'gui/rufusarm64_drive_backup_formats.py'
      - 'gui/test_device_backup.py'
      - 'gui/test_device_backup_dialog.py'
      - 'packaging/rufusarm64'
      - '.github/workflows/drivebackup-development-diagnostics.yml'

permissions:
  contents: write

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.22.12'
          cache: false
      - name: Capture focused test output
        shell: bash
        run: |
          set +e
          go test ./internal/drivebackup ./internal/trustedexec ./cmd/rufus-device-backup > focused-tests.log 2>&1
          status=$?
          printf 'exit_status=%s\n' "$status" >> focused-tests.log
          exit 0
      - name: Capture graphical contract output
        shell: bash
        run: |
          set +e
          python3 -m unittest gui.test_device_backup gui.test_device_backup_dialog > graphical-tests.log 2>&1
          status=$?
          printf 'exit_status=%s\n' "$status" >> graphical-tests.log
          exit 0
      - name: Require green Go contracts
        if: always()
        shell: bash
        run: grep -Fxq 'exit_status=0' focused-tests.log
      - name: Require green graphical contracts
        if: always()
        shell: bash
        run: grep -Fxq 'exit_status=0' graphical-tests.log
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: drivebackup-focused-diagnostics
          path: |
            focused-tests.log
            graphical-tests.log
          if-no-files-found: error
          retention-days: 1
      - name: Normalize packaged format module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/build-deb.sh')
          text = path.read_text(encoding='utf-8')
          anchor = '''install -Dm644 "${ROOT_DIR}/gui/rufusarm64_device_qualify_dialog.py" \\
            "${PACKAGE_DIR}/usr/lib/rufusarm64/rufusarm64_device_qualify_dialog.py"
          '''
          block = '''install -Dm644 "${ROOT_DIR}/gui/rufusarm64_drive_backup_formats.py" \\
            "${PACKAGE_DIR}/usr/lib/rufusarm64/rufusarm64_drive_backup_formats.py"
          '''
          while block + block in text:
              text = text.replace(block + block, block)
          if text.count(block) == 0:
              if text.count(anchor) != 1:
                  raise SystemExit('package install anchor is missing or ambiguous')
              text = text.replace(anchor, anchor + block, 1)
          if text.count(block) != 1:
              raise SystemExit('package format module install is missing or duplicated')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Add permanent qemu loop qualification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          dependency = '            shellcheck desktop-file-utils appstream lintian dosfstools e2fsprogs\n'
          replacement = '            shellcheck desktop-file-utils appstream lintian dosfstools e2fsprogs qemu-utils\n'
          if 'e2fsprogs qemu-utils' not in text:
              if text.count(dependency) != 1:
                  raise SystemExit('CI dependency anchor is missing or ambiguous')
              text = text.replace(dependency, replacement, 1)
          anchor = '''            sudo env RUFUS_REAL_BLOCK_TEST="${RUFUS_REAL_BLOCK_TEST}" \\
              "${RUNNER_TEMP}/devicequal-loop.test" \\
              -test.run '^TestRunDeviceQualifiesRealLoopDevice$' \\
              -test.v
          '''
          addition = anchor + '''            go test -c -o "${RUNNER_TEMP}/drivebackup-loop.test" ./internal/drivebackup
            sudo env RUFUS_REAL_BLOCK_TEST="${RUFUS_REAL_BLOCK_TEST}" \\
              "${RUNNER_TEMP}/drivebackup-loop.test" \\
              -test.run '^(TestCaptureDeviceCapturesRealReadOnlyLoopDevice|TestCaptureDeviceExportsVerifiedContainersFromRealReadOnlyLoop)$' \\
              -test.v
          '''
          if 'drivebackup-loop.test' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('CI loop qualification anchor is missing or ambiguous')
              text = text.replace(anchor, addition, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove unused staging workflow
        shell: bash
        run: rm -f .github/workflows/drivebackup-package-patch.yml
      - name: Validate staged repository changes
        shell: bash
        run: |
          git diff --check
          test "$(grep -Fc 'gui/rufusarm64_drive_backup_formats.py' scripts/build-deb.sh)" -eq 1
          grep -Fq 'drivebackup-loop.test' .github/workflows/ci.yml
          grep -Fq 'qemu-utils' .github/workflows/ci.yml
      - name: Commit staged repository changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ci: qualify packaged VHD and VHDX backup'
      - name: Push staged repository changes
        shell: bash
        run: git push origin HEAD:${{ github.event.pull_request.head.ref }}
