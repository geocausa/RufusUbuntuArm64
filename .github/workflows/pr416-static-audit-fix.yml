name: Fix PR 416 static audit

on:
  push:
    branches:
      - parity/rufus-4.15-regressions

permissions:
  contents: write

concurrency:
  group: fix-pr416-static-audit
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: parity/rufus-4.15-regressions
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
      - name: Remove dead wrapper and normalize error style
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          imaging = Path('internal/imaging/imaging.go')
          text = imaging.read_text(encoding='utf-8')
          old = '''func writeFull(w io.Writer, p []byte) (int, error) {\n\treturn writeFullContext(context.Background(), w, p)\n}\n\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one dead writeFull wrapper, found {text.count(old)}')
          imaging.write_text(text.replace(old, ''), encoding='utf-8')

          lookup = Path('internal/windowsmedia/path_lookup.go')
          text = lookup.read_text(encoding='utf-8')
          old = 'return "", false, fmt.Errorf("Windows media path component is not a directory: %s", filepath.ToSlash(relative))'
          new = 'return "", false, fmt.Errorf("windows media path component is not a directory: %s", filepath.ToSlash(relative))'
          if text.count(old) != 1:
              raise SystemExit(f'expected one capitalized path error, found {text.count(old)}')
          lookup.write_text(text.replace(old, new), encoding='utf-8')
          PY
          gofmt -w internal/imaging/imaging.go internal/windowsmedia/path_lookup.go
          audit_bin="${RUNNER_TEMP}/audit-tools"
          mkdir -p "${audit_bin}"
          GOBIN="${audit_bin}" go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          "${audit_bin}/staticcheck" ./internal/imaging/... ./internal/windowsmedia/...
      - name: Publish product-only correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr416-static-audit-fix.yml
          git add internal/imaging/imaging.go internal/windowsmedia/path_lookup.go
          git commit -m "regressions: satisfy pinned static audit"
          git push origin HEAD:parity/rufus-4.15-regressions
