name: Publish PR 415 CA 2023 architecture binding

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-pr415-ca2023-architecture
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: parity/windows-ca2023-bootloaders
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
      - name: Bind install, boot.wim metadata, and staged PE architecture
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'missing {label} anchor in {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          ca = Path('internal/windowsmedia/ca2023.go')
          replace_once(
              ca,
              '''	if !capability.Available {
		reason := strings.TrimSpace(capability.Reason)
		if reason == "" {
			reason = "a complete boot.wim _EX replacement set was not proven"
		}
		return fmt.Errorf("Windows UEFI CA 2023 bootloaders are unavailable: %s", reason)
	}
	if strings.ToLower(strings.TrimSpace(targetSystem)) != "uefi" {
''',
              '''	if !capability.Available {
		reason := strings.TrimSpace(capability.Reason)
		if reason == "" {
			reason = "a complete boot.wim _EX replacement set was not proven"
		}
		return fmt.Errorf("Windows UEFI CA 2023 bootloaders are unavailable: %s", reason)
	}
	installArchitecture := normalizeWIMArchitecture(metadata.Architecture)
	if installArchitecture == "" || capability.Architecture == "" {
		return errors.New("Windows UEFI CA 2023 architecture evidence is missing or unsupported")
	}
	if installArchitecture != capability.Architecture {
		return fmt.Errorf("Windows installation payload architecture %s does not match boot.wim CA 2023 architecture %s", installArchitecture, capability.Architecture)
	}
	if strings.ToLower(strings.TrimSpace(targetSystem)) != "uefi" {
''',
              'selection architecture binding',
          )

          helper_marker = '''func summarizeWindowsCA2023Capability(capability WindowsCA2023Capability, plan *WindowsCA2023Plan) WindowsCA2023Capability {
'''
          helper = '''func validateWindowsCA2023Architecture(metadata windowsconfig.MediaMetadata, plan *WindowsCA2023Plan) error {
	if plan == nil {
		return errors.New("Windows UEFI CA 2023 replacement plan is missing")
	}
	installArchitecture := normalizeWIMArchitecture(metadata.Architecture)
	if installArchitecture == "" {
		return errors.New("Windows installation payload architecture is missing or unsupported")
	}
	if installArchitecture != plan.Architecture {
		return fmt.Errorf("Windows installation payload architecture %s does not match staged boot.wim CA 2023 architecture %s", installArchitecture, plan.Architecture)
	}
	return nil
}

'''
          ca_text = ca.read_text(encoding='utf-8')
          if helper.strip() not in ca_text:
              if helper_marker not in ca_text:
                  raise SystemExit('missing architecture helper insertion anchor')
              ca.write_text(ca_text.replace(helper_marker, helper + helper_marker, 1), encoding='utf-8')

          replace_once(
              ca,
              '''	metadata, err := inspectWindowsCA2023Metadata(ctx, bootWIMPath)
	if err != nil {
		return WindowsCA2023Capability{}, fmt.Errorf("inspect boot.wim metadata: %w", err)
	}
	indexes := make([]int, 0, 2)
''',
              '''	metadata, err := inspectWindowsCA2023Metadata(ctx, bootWIMPath)
	if err != nil {
		return WindowsCA2023Capability{}, fmt.Errorf("inspect boot.wim metadata: %w", err)
	}
	bootArchitecture := normalizeWIMArchitecture(metadata.Architecture)
	if bootArchitecture == "" {
		return WindowsCA2023Capability{Reason: "boot.wim architecture is missing or unsupported"}, nil
	}
	indexes := make([]int, 0, 2)
''',
              'boot.wim architecture extraction',
          )
          replace_once(
              ca,
              '''		if complete {
			return WindowsCA2023Capability{Available: true, ImageIndex: index}, nil
		}
''',
              '''		if complete {
			return WindowsCA2023Capability{Available: true, ImageIndex: index, Architecture: bootArchitecture}, nil
		}
''',
              'capability architecture evidence',
          )
          replace_once(
              ca,
              '''	architecture, fallback, err := ca2023Architecture(bootmgfwEvidence.Machine)
	if err != nil {
		return nil, err
	}
	if _, ok := findRelativeCaseInsensitive(isoRoot, fallback); !ok {
''',
              '''	architecture, fallback, err := ca2023Architecture(bootmgfwEvidence.Machine)
	if err != nil {
		return nil, err
	}
	if capability.Architecture == "" || capability.Architecture != architecture {
		return nil, fmt.Errorf("boot.wim metadata architecture %s does not match staged CA 2023 PE architecture %s", capability.Architecture, architecture)
	}
	if _, ok := findRelativeCaseInsensitive(isoRoot, fallback); !ok {
''',
              'staged PE architecture binding',
          )

          analysis = Path('internal/windowsmedia/analysis.go')
          replace_once(
              analysis,
              '''		if stageErr != nil {
			ca2023 = WindowsCA2023Capability{Reason: fmt.Sprintf("Windows UEFI CA 2023 bootloader validation failed: %v", stageErr)}
		} else {
			ca2023 = summarizeWindowsCA2023Capability(ca2023, staged)
		}
''',
              '''		if stageErr != nil {
			ca2023 = WindowsCA2023Capability{Reason: fmt.Sprintf("Windows UEFI CA 2023 bootloader validation failed: %v", stageErr)}
		} else if architectureErr := validateWindowsCA2023Architecture(metadata, staged); architectureErr != nil {
			ca2023 = WindowsCA2023Capability{Reason: architectureErr.Error()}
		} else {
			ca2023 = summarizeWindowsCA2023Capability(ca2023, staged)
		}
''',
              'analysis architecture refusal',
          )
          PY
          gofmt -w internal/windowsmedia/ca2023.go internal/windowsmedia/analysis.go internal/windowsmedia/ca2023_architecture_test.go
          go test ./internal/windowsmedia ./internal/windowsconfig ./cmd/rufus-linux
      - name: Restore branch workflows and publish clean product commit
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/fix-ca2023-architecture-binding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            internal/windowsmedia/analysis.go \
            internal/windowsmedia/ca2023.go \
            internal/windowsmedia/ca2023_architecture_test.go
          git commit -m "windowsmedia: bind CA 2023 assets across image architectures"
          git push origin HEAD:parity/windows-ca2023-bootloaders
