name: Publish PR 415 CA 2023 architecture binding

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-pr415-ca2023-architecture
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Preserve the trusted patch script
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          path: trusted-main
          persist-credentials: false
      - name: Check out the exact PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: parity/windows-ca2023-bootloaders
          path: product
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
      - name: Apply and test the architecture binding
        working-directory: product
        run: |
          set -euo pipefail
          python3 ../trusted-main/.github/scripts/patch-pr415-ca2023-architecture.py
          gofmt -w \
            internal/windowsmedia/ca2023.go \
            internal/windowsmedia/analysis.go \
            internal/windowsmedia/ca2023_architecture_test.go \
            internal/windowsmedia/ca2023_integration_test.go \
            internal/windowsmedia/ca2023_test.go
          go test ./internal/windowsmedia ./internal/windowsconfig ./cmd/rufus-linux
      - name: Restore branch workflows and publish the product-only commit
        working-directory: product
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/fix-ca2023-architecture-binding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            internal/windowsmedia/analysis.go \
            internal/windowsmedia/ca2023.go \
            internal/windowsmedia/ca2023_architecture_test.go \
            internal/windowsmedia/ca2023_integration_test.go \
            internal/windowsmedia/ca2023_test.go
          git commit -m "windowsmedia: bind CA 2023 assets across image architectures"
          git push origin HEAD:parity/windows-ca2023-bootloaders
