name: Stage drive backup format packaging

on:
  push:
    branches:
      - feature/drive-backup-vhd-formats
    paths:
      - '.github/workflows/drivebackup-package-patch.yml'

permissions:
  contents: write

jobs:
  patch-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/drive-backup-vhd-formats
          persist-credentials: true
      - name: Install format extension in Debian package
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/build-deb.sh')
          text = path.read_text(encoding='utf-8')
          anchor = '''install -Dm644 "${ROOT_DIR}/gui/rufusarm64_device_qualify_dialog.py" \\
            "${PACKAGE_DIR}/usr/lib/rufusarm64/rufusarm64_device_qualify_dialog.py"
          '''
          addition = anchor + '''install -Dm644 "${ROOT_DIR}/gui/rufusarm64_drive_backup_formats.py" \\
            "${PACKAGE_DIR}/usr/lib/rufusarm64/rufusarm64_drive_backup_formats.py"
          '''
          if text.count(anchor) != 1:
              raise SystemExit('package install anchor is missing or ambiguous')
          path.write_text(text.replace(anchor, addition, 1), encoding='utf-8')
          PY
          git diff --check
          grep -Fq 'rufusarm64_drive_backup_formats.py' scripts/build-deb.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/build-deb.sh
          git commit -m 'packaging: include drive backup format extension'
          git push origin HEAD:feature/drive-backup-vhd-formats

# One-shot staging workflow. Remove before the PR leaves draft.
