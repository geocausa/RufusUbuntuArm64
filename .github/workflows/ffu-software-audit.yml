name: FFU software release audit

on:
  pull_request:
    branches:
      - stage3/0.14.0
    paths:
      - '.github/workflows/ffu-software-audit.yml'
      - 'cmd/rufus-linux/ffu_*.go'
      - 'docs/ffu-*.md'
      - 'gui/rufusarm64_ffu_*.py'
      - 'gui/test_ffu_*.py'
      - 'gui/rufusarm64_logic.py'
      - 'gui/test_logic.py'
      - 'gui/test_source_structure.py'
      - 'internal/device/**'
      - 'internal/ffu/**'
      - 'internal/safety/**'
      - 'scripts/ffu-physical-qualification.py'
      - 'go.mod'
      - 'go.sum'
  push:
    branches:
      - stage3/0.14.0
    paths:
      - '.github/workflows/ffu-software-audit.yml'
      - 'cmd/rufus-linux/ffu_*.go'
      - 'docs/ffu-*.md'
      - 'gui/rufusarm64_ffu_*.py'
      - 'gui/test_ffu_*.py'
      - 'gui/rufusarm64_logic.py'
      - 'gui/test_logic.py'
      - 'gui/test_source_structure.py'
      - 'internal/device/**'
      - 'internal/ffu/**'
      - 'internal/safety/**'
      - 'scripts/ffu-physical-qualification.py'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-audit:
    name: Software-only FFU release boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Test FFU, device and target-safety packages with the race detector
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./internal/ffu ./internal/device ./internal/safety ./cmd/rufus-linux

      - name: Vet the complete FFU provider boundary
        shell: bash
        run: |
          set -euo pipefail
          go vet ./internal/ffu ./internal/device ./internal/safety ./cmd/rufus-linux

      - name: Cross-build the Linux ARM64 provider
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -o /tmp/rufusarm64-cli ./cmd/rufus-linux
          test -s /tmp/rufusarm64-cli

      - name: Validate graphical review, restore and qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            gui/rufusarm64_logic.py \
            gui/rufusarm64_ffu_json.py \
            gui/rufusarm64_ffu_dialog.py \
            gui/rufusarm64_ffu_restore_logic.py \
            gui/rufusarm64_ffu_physical_qualification.py \
            scripts/ffu-physical-qualification.py
          PYTHONPATH=gui python3 -m unittest \
            test_logic \
            test_ffu_json \
            test_ffu_restore_logic \
            test_ffu_physical_qualification \
            test_source_structure

      - name: Enforce the experimental destructive boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cli = Path('cmd/rufus-linux/ffu_linux.go').read_text(encoding='utf-8')
          binding = Path('cmd/rufus-linux/ffu_review_binding_linux.go').read_text(encoding='utf-8')
          dialog = Path('gui/rufusarm64_ffu_dialog.py').read_text(encoding='utf-8')
          restore = Path('gui/rufusarm64_ffu_restore_logic.py').read_text(encoding='utf-8')
          executor = Path('internal/ffu/restore_executor_linux.go').read_text(encoding='utf-8')

          required = {
              'CLI experimental gate': (cli, '--experimental-ffu is required'),
              'root-before-restore gate': (cli, 'FFU restore requires administrator privileges'),
              'review binding': (cli + binding, 'expected-review-binding'),
              'constant-time binding comparison': (binding, 'subtle.ConstantTimeCompare'),
              'exclusive target acquisition': (cli, 'AcquireExclusiveFullFlashTarget'),
              'one-shot authorization': (cli, 'AuthorizeSinglePhaseFullFlashMutation'),
              'complete executor readback': (executor, 'readback-target-read'),
              'GTK exact confirmation': (restore, 'confirmation != review["exact_confirmation_phrase"]'),
              'GTK process-group cancellation': (dialog, 'os.killpg(process.pid, signal.SIGTERM)'),
              'unknown target fail-closed warning': (dialog, 'target state is unknown'),
          }
          for label, (text, needle) in required.items():
              if needle not in text:
                  raise SystemExit(f'missing required FFU boundary: {label}')

          forbidden = {
              'fixed-disk override': '--allow-fixed',
              'force bypass': '--force',
              'automatic unmount': 'syscall.Unmount',
              'confirmation bypass': '--yes',
          }
          joined = '\n'.join((cli, binding, dialog, restore))
          for label, needle in forbidden.items():
              if needle in joined:
                  raise SystemExit(f'forbidden FFU boundary appeared: {label}')
          PY
