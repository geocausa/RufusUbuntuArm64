name: FFU trusted-utility patch validation

on:
  pull_request:
    branches:
      - stage3/0.14.0
    paths:
      - '.github/workflows/ffu-software-audit.yml'
      - 'scripts/trusted_utility_stage.py'
      - 'scripts/trusted_utility_stage_fix.py'
      - 'scripts/trusted_utility_stage_fix2.py'
      - 'internal/trustedexec/**'
      - 'internal/device/utility_linux.go'
      - 'internal/safety/utility_linux.go'

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ github.head_ref == 'feature/ffu-trusted-utilities' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/ffu-trusted-utilities
          fetch-depth: 0
          show-progress: false

      - name: Apply exact source transformation
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/trusted_utility_stage_fix.py
          python3 scripts/trusted_utility_stage_fix2.py
          python3 scripts/trusted_utility_stage.py 2>&1 | tee /tmp/trusted-stage.log

      - name: Preserve transformation failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trusted-utility-stage-failure
          path: /tmp/trusted-stage.log
          if-no-files-found: error

      - name: Format and validate focused boundary
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            internal/trustedexec/*.go \
            internal/device/device.go \
            internal/device/device_test.go \
            internal/device/utility_linux.go \
            internal/safety/safety_linux.go \
            internal/safety/safety_linux_test.go \
            internal/safety/utility_linux.go
          go test -race ./internal/trustedexec ./internal/device ./internal/safety ./cmd/rufus-linux
          go vet ./internal/trustedexec ./internal/device ./internal/safety ./cmd/rufus-linux
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/rufusarm64-cli ./cmd/rufus-linux
          test -s /tmp/rufusarm64-cli

      - name: Commit validated production source
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows/ffu-software-audit.yml
          rm scripts/trusted_utility_stage.py scripts/trusted_utility_stage_fix.py scripts/trusted_utility_stage_fix2.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/device internal/safety internal/trustedexec scripts/trusted_utility_stage.py scripts/trusted_utility_stage_fix.py scripts/trusted_utility_stage_fix2.py
          git commit -m '[trusted-patched] safety: resolve privileged utilities explicitly'
          git push origin HEAD:feature/ffu-trusted-utilities
