name: Compressed preparation progress patch validation

on:
  pull_request:
    branches:
      - stage3/0.14.0
    paths:
      - '.github/workflows/ffu-software-audit.yml'
      - 'scripts/compressed_progress_stage.py'
      - 'internal/imaging/input_progress.go'
      - 'internal/imaging/input_progress_test.go'

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ github.head_ref == 'feature/compressed-preparation-progress' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/compressed-preparation-progress
          fetch-depth: 0
          show-progress: false

      - name: Apply exact source transformation
        run: python3 scripts/compressed_progress_stage.py

      - name: Format and validate focused boundary
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/imaging/input.go internal/imaging/input_progress.go internal/imaging/input_progress_test.go
          go test -race ./internal/imaging ./cmd/rufus-linux
          go vet ./internal/imaging ./cmd/rufus-linux
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/rufusarm64-cli ./cmd/rufus-linux
          test -s /tmp/rufusarm64-cli

      - name: Commit validated production source
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/compressed_progress_stage.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/imaging scripts/compressed_progress_stage.py
          git commit -m '[compressed-progress-patched] imaging: report bounded compressed preparation progress'
          git push origin HEAD:feature/compressed-preparation-progress
