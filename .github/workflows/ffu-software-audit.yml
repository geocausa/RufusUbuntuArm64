name: Qualification report mismatch patch validation

on:
  pull_request:
    branches:
      - stage3/0.14.0
    paths:
      - '.github/workflows/ffu-software-audit.yml'
      - 'scripts/qualification_report_mismatch_stage.py'
      - 'gui/test_qualification_report_dialog.py'

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ github.head_ref == 'feature/qualification-report-export' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/qualification-report-export
          fetch-depth: 0
          show-progress: false

      - name: Apply exact fail-closed source transformation
        run: python3 scripts/qualification_report_mismatch_stage.py

      - name: Validate report export boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile gui/rufusarm64_device_qualify_dialog.py gui/test_qualification_report_dialog.py
          PYTHONPATH=gui python3 -m unittest test_qualification_report test_qualification_report_dialog test_source_structure

      - name: Commit validated production source
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/qualification_report_mismatch_stage.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gui/rufusarm64_device_qualify_dialog.py gui/test_qualification_report_dialog.py scripts/qualification_report_mismatch_stage.py
          git commit -m '[qualification-report-mismatch-patched] gui: refuse ambiguous passed report export'
          git push origin HEAD:feature/qualification-report-export
