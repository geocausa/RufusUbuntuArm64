name: Patch checksum dialog localization once

on:
  push:
    branches:
      - feature/gettext-checksum-dialog

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/gettext-checksum-dialog
      - name: Extend bounded gettext coverage to image checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          i18n = Path("gui/rufusarm64_i18n.py")
          text = i18n.read_text(encoding="utf-8")
          old = '''GUARDED_DIALOG_CLASSES = (
              ("rufusarm64_nonbootable_dialog", "NonBootableFormatDialog"),
              ("rufusarm64_freedos_dialog", "FreeDOSFormatDialog"),
          )'''
          new = '''SECONDARY_DIALOG_CLASSES = (
              ("rufusarm64_checksums", "ChecksumDialog"),
              ("rufusarm64_nonbootable_dialog", "NonBootableFormatDialog"),
              ("rufusarm64_freedos_dialog", "FreeDOSFormatDialog"),
          )'''
          if text.count(old) != 1:
              raise SystemExit("secondary dialog class block changed")
          text = text.replace(old, new, 1)
          replacements = {
              '    N_("Calculate image checksums"),\n':
                  '    N_("Calculate"),\n'
                  '    N_("Calculate MD5, SHA-1, SHA-256, and SHA-512 for the selected image in one read-only pass. The image is not mounted or modified, no USB device is opened, and administrator authentication is not used."),\n'
                  '    N_("Calculate image checksums"),\n',
              '    N_("Copy"),\n': '    N_("Copy"),\n    N_("Copy report"),\n',
              '    N_("Image compatibility and write path"),\n': '    N_("Image checksums"),\n    N_("Image compatibility and write path"),\n',
              '    N_("Light"),\n': '    N_("Light"),\n    N_("MD5 and SHA-1 are included only for comparison with legacy published values. They are not used by RufusArm64 for trust, signatures, downloads, or write assurance."),\n',
              '    N_("No formatting report is available yet."),\n': '    N_("No checksums have been calculated."),\n    N_("No formatting report is available yet."),\n',
              '    N_("Secure Boot DBX"),\n': '    N_("Secure Boot DBX"),\n    N_("Select Calculate to hash the exact image file."),\n',
              'def install_guarded_dialog_localization():': 'def install_secondary_dialog_localization():',
              'for module_name, class_name in GUARDED_DIALOG_CLASSES:': 'for module_name, class_name in SECONDARY_DIALOG_CLASSES:',
              '    install_guarded_dialog_localization()\n': '    install_secondary_dialog_localization()\n',
          }
          for source, replacement in replacements.items():
              if text.count(source) != 1:
                  raise SystemExit(f"checksum localization anchor changed: {source!r}")
              text = text.replace(source, replacement, 1)
          i18n.write_text(text, encoding="utf-8")

          changes = (
              (
                  "docs/release-0.15.0.md",
                  "- Static opening-state localization for the guarded data-only formatter and FreeDOS dialogs, including titles, headings, controls, placeholders, progress text, and initial report text.\n",
                  "- Static opening-state localization for the guarded data-only formatter and FreeDOS dialogs, including titles, headings, controls, placeholders, progress text, and initial report text.\n- Static opening-state localization for the unprivileged read-only image checksum dialog while preserving the selected path, calculated digests, reports, and helper workflow.\n",
              ),
              (
                  "docs/localization.md",
                  "The dialog modules themselves do not import localization code, so their operation and confirmation paths remain unchanged.\n",
                  "The dialog modules themselves do not import localization code, so their operation and confirmation paths remain unchanged.\n\nThe same centralized wrapper covers the read-only image checksum dialog's static opening shell. The selected image path, calculated digest values, generated report, helper errors, clipboard content, and dynamic running/completion status remain untranslated.\n",
              ),
              (
                  "ROADMAP.md",
                  "- Static opening-state localization for guarded data-only formatting and FreeDOS creation without changing generated confirmations or operation paths\n",
                  "- Static opening-state localization for guarded data-only formatting and FreeDOS creation without changing generated confirmations or operation paths\n- Static opening-state localization for the descriptor-bound read-only image checksum dialog\n",
              ),
              (
                  "CHANGELOG.md",
                  "- Extended exact static localization to the guarded data-only formatter and FreeDOS dialog shells while preserving generated confirmation phrases, identities, dynamic plans, reports, and operation paths byte-for-byte.\n",
                  "- Extended exact static localization to the guarded data-only formatter and FreeDOS dialog shells while preserving generated confirmation phrases, identities, dynamic plans, reports, and operation paths byte-for-byte.\n- Extended exact static localization to the read-only image checksum dialog while preserving selected paths, calculated digests, report and clipboard content, helper execution, and diagnostic logging byte-for-byte.\n",
              ),
          )
          for filename, source, replacement in changes:
              path = Path(filename)
              value = path.read_text(encoding="utf-8")
              if value.count(source) != 1:
                  raise SystemExit(f"documentation anchor changed: {filename}")
              path.write_text(value.replace(source, replacement, 1), encoding="utf-8")

          parity = Path("docs/upstream-rufus-parity.json")
          text = parity.read_text(encoding="utf-8")
          old = "A standard GNU gettext runtime, deterministic source-only POT, package closure, safe English fallback, and exact post-construction translation are implemented for the primary window plus the static opening shells of guarded data-only formatting and FreeDOS creation. Generated confirmation values, comparison logic, selected values, machine-readable JSON, flags, paths, identities, planner values, dynamic plans/status, diagnostics, and report schemas remain byte-stable. Broader secondary-dialog and dynamic status/diagnostic migration, plural review, completed language packs, and full translation-aware accessibility review remain planned."
          new = "A standard GNU gettext runtime, deterministic source-only POT, package closure, safe English fallback, and exact post-construction translation are implemented for the primary window plus the static opening shells of guarded data-only formatting, FreeDOS creation, and read-only image checksums. Generated confirmation values, comparison logic, selected paths/values, calculated digests, reports, machine-readable JSON, flags, identities, planner values, dynamic status, diagnostics, and report schemas remain byte-stable. Broader secondary-dialog and dynamic status/diagnostic migration, plural review, completed language packs, and full translation-aware accessibility review remain planned."
          if text.count(old) != 1:
              raise SystemExit("localization parity checksum anchor changed")
          parity.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python3 scripts/update-pot.py
          python3 -m py_compile gui/rufusarm64_i18n.py
          git rm .github/workflows/patch-checksum-dialog-i18n-once.yml
          git add CHANGELOG.md ROADMAP.md docs/localization.md docs/release-0.15.0.md docs/upstream-rufus-parity.json gui/rufusarm64_i18n.py po/rufusarm64.pot
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "i18n: translate the read-only checksum dialog shell"
          git push origin HEAD:feature/gettext-checksum-dialog
