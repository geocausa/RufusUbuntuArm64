name: Patch checksum dialog localization once

on:
  push:
    branches:
      - feature/gettext-checksum-dialog

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/gettext-checksum-dialog
      - name: Extend bounded gettext coverage to image checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          i18n = Path("gui/rufusarm64_i18n.py")
          text = i18n.read_text(encoding="utf-8")
          old_classes = '''GUARDED_DIALOG_CLASSES = (
              ("rufusarm64_nonbootable_dialog", "NonBootableFormatDialog"),
              ("rufusarm64_freedos_dialog", "FreeDOSFormatDialog"),
          )'''
          new_classes = '''SECONDARY_DIALOG_CLASSES = (
              ("rufusarm64_checksums", "ChecksumDialog"),
              ("rufusarm64_nonbootable_dialog", "NonBootableFormatDialog"),
              ("rufusarm64_freedos_dialog", "FreeDOSFormatDialog"),
          )'''
          if text.count(old_classes) != 1:
              raise SystemExit("secondary dialog class block changed")
          text = text.replace(old_classes, new_classes, 1)

          anchor = '    N_("Calculate image checksums"),\n'
          replacement = '''    N_("Calculate"),
              N_("Calculate MD5, SHA-1, SHA-256, and SHA-512 for the selected image in one read-only pass. The image is not mounted or modified, no USB device is opened, and administrator authentication is not used."),
              N_("Calculate image checksums"),
          '''
          if text.count(anchor) != 1:
              raise SystemExit("checksum catalog insertion point changed")
          text = text.replace(anchor, replacement, 1)

          additions = {
              '    N_("Copy"),\n': '    N_("Copy"),\n    N_("Copy report"),\n',
              '    N_("Image compatibility and write path"),\n': '    N_("Image checksums"),\n    N_("Image compatibility and write path"),\n',
              '    N_("Light"),\n': '    N_("Light"),\n    N_("MD5 and SHA-1 are included only for comparison with legacy published values. They are not used by RufusArm64 for trust, signatures, downloads, or write assurance."),\n',
              '    N_("No formatting report is available yet."),\n': '    N_("No checksums have been calculated."),\n    N_("No formatting report is available yet."),\n',
              '    N_("Secure Boot DBX"),\n': '    N_("Secure Boot DBX"),\n    N_("Select Calculate to hash the exact image file."),\n',
          }
          for old, new in additions.items():
              if text.count(old) != 1:
                  raise SystemExit(f"checksum catalog anchor changed: {old!r}")
              text = text.replace(old, new, 1)

          if text.count("def install_guarded_dialog_localization():") != 1:
              raise SystemExit("guarded installer definition changed")
          text = text.replace(
              "def install_guarded_dialog_localization():",
              "def install_secondary_dialog_localization():",
              1,
          )
          if text.count("for module_name, class_name in GUARDED_DIALOG_CLASSES:") != 1:
              raise SystemExit("guarded installer loop changed")
          text = text.replace(
              "for module_name, class_name in GUARDED_DIALOG_CLASSES:",
              "for module_name, class_name in SECONDARY_DIALOG_CLASSES:",
              1,
          )
          if text.count("    install_guarded_dialog_localization()\n") != 1:
              raise SystemExit("guarded installer call changed")
          text = text.replace(
              "    install_guarded_dialog_localization()\n",
              "    install_secondary_dialog_localization()\n",
              1,
          )
          i18n.write_text(text, encoding="utf-8")

          tests = Path("gui/test_i18n.py")
          text = tests.read_text(encoding="utf-8")
          text = text.replace(
              'names = ("rufusarm64_nonbootable_dialog", "rufusarm64_freedos_dialog")',
              'names = ("rufusarm64_checksums", "rufusarm64_nonbootable_dialog", "rufusarm64_freedos_dialog")',
              1,
          )
          text = text.replace(
              "def test_guarded_dialog_installer_wraps_only_loaded_classes_and_is_idempotent(self):",
              "def test_secondary_dialog_installer_wraps_only_loaded_classes_and_is_idempotent(self):",
              1,
          )
          text = text.replace("module.GUARDED_DIALOG_CLASSES", "module.SECONDARY_DIALOG_CLASSES")
          text = text.replace("module.install_guarded_dialog_localization()", "module.install_secondary_dialog_localization()")
          text = text.replace(
              '["dialog-0", "dialog-1"]',
              '["dialog-0", "dialog-1", "dialog-2"]',
              1,
          )

          method_anchor = '''    def test_secondary_dialog_installer_wraps_only_loaded_classes_and_is_idempotent(self):
          '''
          method = '''    def test_checksum_dialog_static_shell_translates_and_preserves_selected_path(self):
              module, _ = load_i18n_module()
              translations = {
                  "Image checksums": "Sommes de contrôle de l'image",
                  "Calculate": "Calculer",
                  "Copy report": "Copier le rapport",
                  "Select Calculate to hash the exact image file.": "Sélectionnez Calculer pour hacher le fichier image exact.",
                  "No checksums have been calculated.": "Aucune somme de contrôle n'a été calculée.",
              }
              with tempfile.TemporaryDirectory() as directory:
                  locale_root = Path(directory)
                  write_mo(locale_root / "zz" / "LC_MESSAGES" / "rufusarm64.mo", translations)
                  translation = module.load_translation(str(locale_root), ["zz"])
                  selected_path = Label("/tmp/selected-image.iso")
                  calculate = Button("Calculate")
                  copy = Button("Copy report")
                  status = Label("Select Calculate to hash the exact image file.")
                  report = TextView("No checksums have been calculated.")
                  dialog = Window(
                      title="Image checksums",
                      children=[selected_path, calculate, copy, status, report],
                  )

                  self.assertFalse(module.translate_widget_tree(dialog, translation))
                  self.assertEqual(dialog.title, translations["Image checksums"])
                  self.assertEqual(calculate.label, "Calculer")
                  self.assertEqual(copy.label, "Copier le rapport")
                  self.assertEqual(status.text, translations["Select Calculate to hash the exact image file."])
                  self.assertEqual(report.buffer.text, translations["No checksums have been calculated."])
                  self.assertEqual(selected_path.text, "/tmp/selected-image.iso")

              
              def test_secondary_dialog_installer_wraps_only_loaded_classes_and_is_idempotent(self):
          '''
          if text.count(method_anchor) != 1:
              raise SystemExit("secondary installer test insertion point changed")
          text = text.replace(method_anchor, method, 1)

          pot_anchor = '        self.assertIn(\'msgid "Create non-bootable media"\', text)\n'
          pot_replacement = '        self.assertIn(\'msgid "Image checksums"\', text)\n' + pot_anchor
          if text.count(pot_anchor) != 1:
              raise SystemExit("POT checksum assertion insertion point changed")
          tests.write_text(text.replace(pot_anchor, pot_replacement, 1), encoding="utf-8")

          contract = Path("gui/test_guarded_dialog_i18n_contract.py")
          text = contract.read_text(encoding="utf-8")
          text = text.replace(
              'DIALOGS = (\n    ROOT / "gui" / "rufusarm64_nonbootable_dialog.py",\n    ROOT / "gui" / "rufusarm64_freedos_dialog.py",\n)',
              'GUARDED_DIALOGS = (\n    ROOT / "gui" / "rufusarm64_nonbootable_dialog.py",\n    ROOT / "gui" / "rufusarm64_freedos_dialog.py",\n)\nCHECKSUM_DIALOG = ROOT / "gui" / "rufusarm64_checksums.py"',
              1,
          )
          text = text.replace(
              '("rufusarm64_nonbootable_dialog", "NonBootableFormatDialog")',
              '("rufusarm64_checksums", "ChecksumDialog")\',\n            \'("rufusarm64_nonbootable_dialog", "NonBootableFormatDialog")',
              1,
          )
          text = text.replace("def install_guarded_dialog_localization():", "def install_secondary_dialog_localization():")
          text = text.replace("install_guarded_dialog_localization()", "install_secondary_dialog_localization()")
          text = text.replace("for path in DIALOGS:", "for path in GUARDED_DIALOGS:")
          checksum_method = '''
              def test_checksum_operation_source_remains_localization_free_and_descriptor_bound(self):
                  text = CHECKSUM_DIALOG.read_text(encoding="utf-8")
                  self.assertNotIn("rufusarm64_i18n", text)
                  for marker in (
                      "command = build_checksum_command(self.helper, self.image_path)",
                      "normalized = normalize_checksum_result(json.loads(completed.stdout))",
                      "self.report = checksum_summary(payload)",
                      "set_text(self.report, -1)",
                  ):
                      self.assertIn(marker, text)
          '''
          end_anchor = '''

          if __name__ == "__main__":
          '''
          if text.count(end_anchor) != 1:
              raise SystemExit("contract test ending changed")
          contract.write_text(text.replace(end_anchor, checksum_method + end_anchor, 1), encoding="utf-8")

          release = Path("docs/release-0.15.0.md")
          text = release.read_text(encoding="utf-8")
          anchor = "- Static opening-state localization for the guarded data-only formatter and FreeDOS dialogs, including titles, headings, controls, placeholders, progress text, and initial report text.\n"
          addition = anchor + "- Static opening-state localization for the unprivileged read-only image checksum dialog while preserving the selected path, calculated digests, reports, and helper workflow.\n"
          if text.count(anchor) != 1:
              raise SystemExit("release localization anchor changed")
          release.write_text(text.replace(anchor, addition, 1), encoding="utf-8")

          localization = Path("docs/localization.md")
          text = localization.read_text(encoding="utf-8")
          anchor = "The dialog modules themselves do not import localization code, so their operation and confirmation paths remain unchanged.\n"
          addition = anchor + "\nThe same centralized wrapper covers the read-only image checksum dialog's static opening shell. The selected image path, calculated digest values, generated report, helper errors, clipboard content, and dynamic running/completion status remain untranslated.\n"
          if text.count(anchor) != 1:
              raise SystemExit("localization guide anchor changed")
          localization.write_text(text.replace(anchor, addition, 1), encoding="utf-8")

          roadmap = Path("ROADMAP.md")
          text = roadmap.read_text(encoding="utf-8")
          anchor = "- Static opening-state localization for guarded data-only formatting and FreeDOS creation without changing generated confirmations or operation paths\n"
          addition = anchor + "- Static opening-state localization for the descriptor-bound read-only image checksum dialog\n"
          if text.count(anchor) != 1:
              raise SystemExit("roadmap localization anchor changed")
          roadmap.write_text(text.replace(anchor, addition, 1), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          anchor = "- Extended exact static localization to the guarded data-only formatter and FreeDOS dialog shells while preserving generated confirmation phrases, identities, dynamic plans, reports, and operation paths byte-for-byte.\n"
          addition = anchor + "- Extended exact static localization to the read-only image checksum dialog while preserving selected paths, calculated digests, report and clipboard content, helper execution, and diagnostic logging byte-for-byte.\n"
          if text.count(anchor) != 1:
              raise SystemExit("changelog checksum anchor changed")
          changelog.write_text(text.replace(anchor, addition, 1), encoding="utf-8")

          parity = Path("docs/upstream-rufus-parity.json")
          text = parity.read_text(encoding="utf-8")
          old = "A standard GNU gettext runtime, deterministic source-only POT, package closure, safe English fallback, and exact post-construction translation are implemented for the primary window plus the static opening shells of guarded data-only formatting and FreeDOS creation. Generated confirmation values, comparison logic, selected values, machine-readable JSON, flags, paths, identities, planner values, dynamic plans/status, diagnostics, and report schemas remain byte-stable. Broader secondary-dialog and dynamic status/diagnostic migration, plural review, completed language packs, and full translation-aware accessibility review remain planned."
          new = "A standard GNU gettext runtime, deterministic source-only POT, package closure, safe English fallback, and exact post-construction translation are implemented for the primary window plus the static opening shells of guarded data-only formatting, FreeDOS creation, and read-only image checksums. Generated confirmation values, comparison logic, selected paths/values, calculated digests, reports, machine-readable JSON, flags, identities, planner values, dynamic status, diagnostics, and report schemas remain byte-stable. Broader secondary-dialog and dynamic status/diagnostic migration, plural review, completed language packs, and full translation-aware accessibility review remain planned."
          if text.count(old) != 1:
              raise SystemExit("localization parity checksum anchor changed")
          parity.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python3 scripts/update-pot.py
          python3 -m py_compile gui/rufusarm64_i18n.py gui/test_i18n.py gui/test_guarded_dialog_i18n_contract.py
          git rm .github/workflows/patch-checksum-dialog-i18n-once.yml
          git add CHANGELOG.md ROADMAP.md docs/localization.md docs/release-0.15.0.md docs/upstream-rufus-parity.json gui/rufusarm64_i18n.py gui/test_i18n.py gui/test_guarded_dialog_i18n_contract.py po/rufusarm64.pot
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "i18n: translate the read-only checksum dialog shell"
          git push origin HEAD:feature/gettext-checksum-dialog
