name: Audit pinned UEFI NTFS CA 2023 chain

on:
  push:
    branches:
      - parity/windows-ca2023-bootloaders
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'parity/windows-ca2023-bootloaders')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
      - name: Mount exact pinned image read-only and report embedded certificates
        run: |
          set -euo pipefail
          mount_dir="${RUNNER_TEMP}/uefi-ntfs"
          mkdir -p "${mount_dir}"
          sudo mount -o loop,ro,nosuid,nodev,noexec vendor/uefi-ntfs/uefi-ntfs.img "${mount_dir}"
          trap 'sudo umount "${mount_dir}"' EXIT
          mapfile -d '' files < <(find "${mount_dir}" -type f \( -iname '*.efi' -o -iname '*.efi.signed' \) -print0 | sort -z)
          test "${#files[@]}" -gt 0
          cat > ca2023_cert_audit.go <<'GO'
          package main

          import (
            "encoding/json"
            "fmt"
            "os"

            "github.com/geocausa/RufusArm64/internal/secureboot"
          )

          type certificate struct {
            Subject string `json:"subject"`
            Issuer string `json:"issuer"`
            Serial string `json:"serial"`
            NotBefore string `json:"not_before"`
            NotAfter string `json:"not_after"`
          }
          type report struct {
            Path string `json:"path"`
            Machine uint16 `json:"machine"`
            AuthenticodeSHA256 string `json:"authenticode_sha256"`
            Certificates []certificate `json:"certificates"`
          }

          func main() {
            encoder := json.NewEncoder(os.Stdout)
            encoder.SetIndent("", "  ")
            for _, path := range os.Args[1:] {
              hash, err := secureboot.AuthenticodeSHA256File(path)
              if err != nil { panic(fmt.Errorf("hash %s: %w", path, err)) }
              certs, err := secureboot.EmbeddedAuthenticodeCertificates(path)
              if err != nil { panic(fmt.Errorf("certificates %s: %w", path, err)) }
              item := report{Path: path, Machine: hash.Machine, AuthenticodeSHA256: hash.SHA256}
              for _, cert := range certs {
                item.Certificates = append(item.Certificates, certificate{
                  Subject: cert.Subject.String(), Issuer: cert.Issuer.String(), Serial: cert.SerialNumber.String(),
                  NotBefore: cert.NotBefore.UTC().Format("2006-01-02T15:04:05Z"),
                  NotAfter: cert.NotAfter.UTC().Format("2006-01-02T15:04:05Z"),
                })
              }
              if err := encoder.Encode(item); err != nil { panic(err) }
            }
          }
          GO
          go run ./ca2023_cert_audit.go "${files[@]}" | tee "${RUNNER_TEMP}/uefi-ntfs-certificates.json"
          rm ca2023_cert_audit.go
      - name: Upload certificate inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uefi-ntfs-ca2023-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/uefi-ntfs-certificates.json
          if-no-files-found: error
