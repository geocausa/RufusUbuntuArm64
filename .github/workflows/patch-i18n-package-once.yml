name: Patch localization package contract once

on:
  push:
    branches:
      - feature/gettext-primary-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/gettext-primary-ui
      - name: Add gettext runtime and template to the Debian package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/build-deb.sh")
          text = path.read_text(encoding="utf-8")
          module_needle = '''install -Dm644 "${ROOT_DIR}/gui/rufusarm64_integrated.py" \\
            "${PACKAGE_DIR}/usr/lib/rufusarm64/rufusarm64_integrated.py"
          '''
          module_replacement = module_needle + '''python3 "${ROOT_DIR}/scripts/update-pot.py" --check
          install -Dm644 "${ROOT_DIR}/gui/rufusarm64_i18n.py" \\
            "${PACKAGE_DIR}/usr/lib/rufusarm64/rufusarm64_i18n.py"
          '''
          if text.count(module_needle) != 1:
              raise SystemExit("integrated-module package insertion point changed")
          text = text.replace(module_needle, module_replacement, 1)

          docs_needle = '''install -Dm644 "${ROOT_DIR}/README.md" \\
            "${PACKAGE_DIR}/usr/share/doc/rufusarm64/README.md"
          '''
          docs_replacement = docs_needle + '''install -Dm644 "${ROOT_DIR}/po/rufusarm64.pot" \\
            "${PACKAGE_DIR}/usr/share/doc/rufusarm64/rufusarm64.pot"
          '''
          if text.count(docs_needle) != 1:
              raise SystemExit("documentation package insertion point changed")
          path.write_text(text.replace(docs_needle, docs_replacement, 1), encoding="utf-8")
          PY
          git rm .github/workflows/patch-i18n-package-once.yml
          git add scripts/build-deb.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "package: install gettext runtime and source template"
          git push origin HEAD:feature/gettext-primary-ui
