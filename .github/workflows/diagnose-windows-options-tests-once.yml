name: Diagnose Windows options tests once

on:
  pull_request:
    branches:
      - stage4/0.15.0

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/gettext-windows-options-dialog
      - name: Execute patch and capture every post-patch command
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap
          import traceback

          workflow = Path('.github/workflows/patch-windows-options-i18n-once.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 - <<'PY'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          program = textwrap.dedent('\n'.join(lines[start + 1:end]))
          report = []
          try:
              exec(compile(program, str(workflow), 'exec'), {'__name__': '__main__'})
          except BaseException:
              report.append('PATCH PROGRAM FAILED\n' + traceback.format_exc())
          else:
              commands = (
                  ['python3', 'scripts/update-pot.py'],
                  ['python3', '-m', 'py_compile', 'gui/rufusarm64_i18n.py', 'gui/test_windows_options_dialog_i18n.py'],
                  ['python3', '-m', 'unittest', 'gui.test_windows_options_dialog_i18n', 'gui.test_i18n', 'gui.test_windows_qol_selection_scope'],
                  ['python3', 'scripts/update-pot.py', '--check'],
              )
              for command in commands:
                  completed = subprocess.run(command, text=True, capture_output=True, check=False)
                  report.append(
                      '$ ' + ' '.join(command) + '\n'
                      + f'exit={completed.returncode}\n'
                      + 'STDOUT:\n' + completed.stdout
                      + '\nSTDERR:\n' + completed.stderr
                  )
                  if completed.returncode != 0:
                      break
          Path('docs/windows-options-i18n-test-diagnostic.txt').write_text(
              '\n\n'.join(report), encoding='utf-8'
          )
          PY
          git rm .github/workflows/diagnose-windows-options-tests-once.yml
          git add docs/windows-options-i18n-test-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "ci: capture Windows options focused-test failure"
          git push origin HEAD:feature/gettext-windows-options-dialog
