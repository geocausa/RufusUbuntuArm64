name: Apply SkuSiPolicy writer target helper

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-skusi-writer-target-helper
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'parity/windows-skusi-policy'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: parity/windows-skusi-policy
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
      - name: Apply and test exact writer change
        run: |
          python3 .github/scripts/apply-skusi-writer-target-helper.py
          gofmt -w internal/windowsmedia/windowsmedia.go internal/windowsmedia/customizations.go internal/windowsmedia/customizations_plan_test.go internal/windowsmedia/wimfeatures.go internal/windowsmedia/wimfeatures_test.go
          go test ./internal/windowsmedia ./internal/windowsconfig ./cmd/rufus-linux
      - name: Publish formatting and writer binding
        run: |
          paths=(
            internal/windowsmedia/windowsmedia.go
            internal/windowsmedia/customizations.go
            internal/windowsmedia/customizations_plan_test.go
            internal/windowsmedia/wimfeatures.go
            internal/windowsmedia/wimfeatures_test.go
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "Writer target helper is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "windowsmedia: enforce resolved SkuSiPolicy target"
          git push origin HEAD:parity/windows-skusi-policy
