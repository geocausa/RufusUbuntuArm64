name: Apply final ISO layout artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-final-iso-layout.yml'

permissions:
  actions: read
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact generated artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: iso-layout-generated
          path: artifact
          run-id: 30414311952
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and extract bounded source tree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import tarfile

          root = Path('artifact')
          archive = root / 'iso-layout-generated.tar'
          checksum = root / 'iso-layout-generated.tar.sha256'
          expected_archive_sha256 = '0aebe5072561b87c1946d3d285f70aec688f8332a6e040f5adb2c93c56e2897d'
          if not archive.is_file() or not checksum.is_file():
              raise SystemExit('generator artifact is incomplete')
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != expected_archive_sha256:
              raise SystemExit('generator tar digest does not match the reviewed artifact')
          words = checksum.read_text(encoding='utf-8').strip().split()
          if not words or words[0].lower() != expected_archive_sha256:
              raise SystemExit('generator checksum record does not match the reviewed artifact')

          expected = {
              '.github/workflows/iso-image-loop-qualification.yml',
              'CHANGELOG.md',
              'cmd/rufus-persistence-helper/main.go',
              'docs/iso-image-mode.md',
              'docs/iso-layout-options-plan.md',
              'docs/upstream-rufus-parity.json',
              'gui/rufusarm64_iso_write_mode.py',
              'gui/test_iso_layout_options.py',
              'internal/linuxmedia/extracted.go',
              'internal/linuxmedia/extracted_gpt_loop_test.go',
              'internal/linuxmedia/extracted_layout_options.go',
              'internal/linuxmedia/extracted_layout_options_test.go',
              'internal/linuxmedia/extracted_loop_test.go',
          }
          staging = Path('staging')
          staging.mkdir(mode=0o700)
          total = 0
          with tarfile.open(archive, mode='r:') as tar:
              members = tar.getmembers()
              names = [member.name for member in members]
              if len(names) != len(set(names)) or set(names) != expected:
                  raise SystemExit(f'unexpected generator paths: {sorted(set(names) ^ expected)}')
              for member in members:
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts or not member.isfile():
                      raise SystemExit(f'unsafe generator member: {member.name}')
                  if member.size < 0 or member.size > 256 * 1024:
                      raise SystemExit(f'generator member size is unsafe: {member.name}')
                  total += member.size
              if total > 2 * 1024 * 1024:
                  raise SystemExit('generator source tree is unexpectedly large')
              for member in members:
                  source = tar.extractfile(member)
                  if source is None:
                      raise SystemExit(f'cannot read generator member: {member.name}')
                  target = staging / member.name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  data = source.read()
                  if len(data) != member.size:
                      raise SystemExit(f'short generator member: {member.name}')
                  target.write_bytes(data)
                  target.chmod(0o644)
          PY

      - name: Check out exact feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: parity/iso-layout-options
          path: work
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require exact feature head
        working-directory: work
        run: test "$(git rev-parse HEAD)" = 'f9086e823ca6086bddc4675810a3f74536ed4a29'

      - name: Publish exact non-workflow files without executing generated source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          staging = Path('staging')
          work = Path('work')
          workflow_path = Path('.github/workflows/iso-image-loop-qualification.yml')
          for source in sorted(staging.rglob('*')):
              if not source.is_file():
                  continue
              relative = source.relative_to(staging)
              if relative == workflow_path:
                  continue
              target = work / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
              target.chmod(0o644)
          PY

      - name: Commit atomic non-workflow feature update
        working-directory: work
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'iso: add reviewed MBR/GPT layout options'
          git push origin HEAD:parity/iso-layout-options

# Workflow-file publication is intentionally performed through the repository connector after this bounded push.
