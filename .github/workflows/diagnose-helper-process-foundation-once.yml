name: Diagnose helper process foundation once

on:
  push:
    branches:
      - feature/helper-process-cleanup

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/helper-process-cleanup
      - name: Capture exact one-shot failure
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/patch-helper-process-foundation-once.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == 'run: |')
          block = []
          for line in lines[start + 1:]:
              if not line:
                  block.append('')
              elif line.startswith('          '):
                  block.append(line[10:])
              else:
                  raise SystemExit(f'unexpected line outside run block: {line!r}')
          Path('/tmp/helper-process-patch.sh').write_text('\n'.join(block) + '\n', encoding='utf-8')
          PY
          set +e
          bash /tmp/helper-process-patch.sh > /tmp/helper-process-patch.log 2>&1
          status=$?
          set -e
          {
            echo "exit_status=${status}"
            cat /tmp/helper-process-patch.log
          } > docs/helper-process-patch-diagnostic.txt
          git add docs/helper-process-patch-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "ci: capture helper process patch diagnostic"
          git push origin HEAD:feature/helper-process-cleanup
