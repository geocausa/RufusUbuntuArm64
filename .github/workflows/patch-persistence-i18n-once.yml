name: Patch persistence wizard localization once

on:
  pull_request:
    branches:
      - stage4/0.15.0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/gettext-persistence-wizard
      - name: Add bounded persistent-wizard localization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{label} changed")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          i18n = Path("gui/rufusarm64_i18n.py")
          replace_once(
              i18n,
              '    ("rufusarm64", "AcquisitionDialog"),\n)',
              '    ("rufusarm64", "AcquisitionDialog"),\n    ("rufusarm64_persistence", "Window"),\n)',
              "persistence class registration",
          )
          additions = (
              ('    N_("Advanced drive properties"),\n', '    N_("Advanced drive properties"),\n    N_("Advanced options"),\n', "advanced options"),
              ('    N_("Check compatibility"),\n', '    N_("Check compatibility"),\n    N_("Check ISO and USB"),\n', "compatibility action"),
              ('    N_("Choose a new destination path to calculate the read-only plan."),\n', '    N_("Choose a new destination path to calculate the read-only plan."),\n    N_("Choose a plain Linux ISOHybrid image"),\n    N_("Choose an ISO and USB drive, then check compatibility."),\n', "persistence chooser and initial summary"),
              ('    N_("Create a local administrator account"),\n', '    N_("Create a local administrator account"),\n    N_("Create a persistent live Linux USB"),\n    N_("Create persistent USB"),\n', "persistence heading and action"),
              ('    N_("Details and diagnostics"),\n', '    N_("Details and diagnostics"),\n    N_("Development validation"),\n', "development validation label"),
              ('    N_("GiB (0 = recommended available space)"),\n', '    N_("GiB (0 = recommended available space)"),\n    N_("GiB — leave at 0 to use the recommended available space"),\n', "persistence size help"),
              ('    N_("Image checksums"),\n', '    N_("Image checksums"),\n    N_("Linux ISO"),\n    N_("Linux ISO images"),\n', "persistence ISO labels"),
              ('    N_("Raw image (.img)"),\n', '    N_("Raw image (.img)"),\n    N_("Ready"),\n    N_("RufusArm64 Persistent Live USB"),\n', "persistence ready and title"),
              ('    N_("Space for saved changes"),\n', '    N_("Space for saved changes"),\n', "existing space label"),
              ('    N_("System"),\n', '    N_("System"),\n    N_("The short name shown for the writable boot partition."),\n    N_("The USB cannot be erased until the compatibility check succeeds."),\n', "persistence tooltip and initial detail"),
              ('    N_("This separate workflow erases the complete selected removable drive, creates one data partition, checks the new filesystem, and explicitly does not claim the result is bootable."),\n', '    N_("This check reads the ISO without changing the USB. It confirms that the selected image supports persistence and that the USB has enough space."),\n    N_("This feature supports recognized Ubuntu 20.04 or newer and Debian live images. Some images or computers may not be compatible; RufusArm64 checks the ISO before writing anything to the USB."),\n    N_("This separate workflow erases the complete selected removable drive, creates one data partition, checks the new filesystem, and explicitly does not claim the result is bootable."),\n', "persistence compatibility disclosures"),
              ('    N_("UEFI (non-CSM)"),\n', '    N_("UEFI (non-CSM)"),\n    N_("Ubuntu casper and Debian live-boot"),\n    N_("Unsigned development loader — Secure Boot compatibility is not established. Development testing only."),\n    N_("USB name"),\n', "persistence subtitle warning and label"),
              ('    N_("Validate UEFI Media…"),\n', '    N_("Validate UEFI Media…"),\n    N_("Validate media at UEFI boot (development only)"),\n', "persistence runtime validation control"),
              ('    N_("Windows drivers"),\n', '    N_("Windows drivers"),\n    N_("Choose a supported Ubuntu or Debian ISO, select a removable USB drive, and choose how much space to keep for files and settings. RufusArm64 checks compatibility before it allows the USB to be erased."),\n', "persistence introduction"),
          )
          for old, new, label in additions:
              if old == new:
                  continue
              replace_once(i18n, old, new, label)
          replace_once(
              i18n,
              '    "Customize Windows Setup": "<span size=\'large\' weight=\'bold\'>{}</span>",\n}',
              '    "Customize Windows Setup": "<span size=\'large\' weight=\'bold\'>{}</span>",\n    "Create a persistent live Linux USB": "<span size=\'large\' weight=\'bold\'>{}</span>",\n}',
              "persistence markup template",
          )
          replace_once(
              i18n,
              '    elif isinstance(widget, Gtk.FileChooserButton):\n        source = widget.get_title()\n        if source:\n            translated = _translated(str(source), translation)\n            if translated != source:\n                widget.set_title(translated)\n                changed += 1\n',
              '    elif isinstance(widget, Gtk.FileChooserButton):\n        source = widget.get_title()\n        if source:\n            translated = _translated(str(source), translation)\n            if translated != source:\n                widget.set_title(translated)\n                changed += 1\n        list_filters = getattr(widget, "list_filters", None)\n        if callable(list_filters):\n            for file_filter in list_filters():\n                source = file_filter.get_name() if hasattr(file_filter, "get_name") else None\n                if not source or not hasattr(file_filter, "set_name"):\n                    continue\n                translated = _translated(str(source), translation)\n                if translated != source:\n                    file_filter.set_name(translated)\n                    changed += 1\n',
              "reviewed file-filter translation boundary",
          )

          wrapper = Path("packaging/rufusarm64-persistence")
          wrapper.write_text(dedent('''
              #!/bin/sh
              exec /usr/bin/python3 -I - "$@" <<'PYRUFUSARM64PERSISTENCE'
              """Isolated GTK 3 entry point for the dedicated persistent-live wizard."""

              import sys

              import gi

              gi.require_version("Gtk", "3.0")
              sys.path.insert(0, "/usr/lib/rufusarm64")

              from rufusarm64_i18n import install_secondary_dialog_localization
              import rufusarm64_persistence as persistence

              install_secondary_dialog_localization()
              raise SystemExit(persistence.App().run(None))
              PYRUFUSARM64PERSISTENCE
          ''').lstrip(), encoding="utf-8")

          tests = Path("gui/test_i18n.py")
          replace_once(
              tests,
              'class FileChooserButton(Widget):\n    def __init__(self, title=None, filename=None, **kwargs):\n        super().__init__(**kwargs)\n        self.title = title\n        self.filename = filename\n',
              'class FileFilter:\n    def __init__(self, name=None):\n        self.name = name\n\n    def get_name(self):\n        return self.name\n\n    def set_name(self, value):\n        self.name = value\n\n\nclass FileChooserButton(Widget):\n    def __init__(self, title=None, filename=None, filters=None, **kwargs):\n        super().__init__(**kwargs)\n        self.title = title\n        self.filename = filename\n        self.filters = list(filters or [])\n',
              "fake file-filter support",
          )
          replace_once(
              tests,
              '    def get_filename(self):\n        return self.filename\n\n\nclass Label(Widget):\n',
              '    def get_filename(self):\n        return self.filename\n\n    def list_filters(self):\n        return list(self.filters)\n\n\nclass Label(Widget):\n',
              "fake chooser filter listing",
          )
          replace_once(
              tests,
              '        names = ("rufusarm64_checksums", "rufusarm64_device_qualify_dialog", "rufusarm64_ffu_dialog", "rufusarm64_nonbootable_dialog", "rufusarm64_freedos_dialog", "rufusarm64")',
              '        names = ("rufusarm64_checksums", "rufusarm64_device_qualify_dialog", "rufusarm64_ffu_dialog", "rufusarm64_nonbootable_dialog", "rufusarm64_freedos_dialog", "rufusarm64", "rufusarm64_persistence")',
              "secondary persistence module list",
          )
          replace_once(
              tests,
              '            self.assertEqual([dialog.marker for dialog in dialogs], ["dialog-0", "dialog-1", "dialog-2", "dialog-3", "dialog-4", "dialog-5", "dialog-6", "dialog-7"])',
              '            self.assertEqual([dialog.marker for dialog in dialogs], ["dialog-0", "dialog-1", "dialog-2", "dialog-3", "dialog-4", "dialog-5", "dialog-6", "dialog-7", "dialog-8"])',
              "secondary persistence marker count",
          )
          replace_once(
              tests,
              '        self.assertIn(\'msgid "Built-in verified catalog"\', text)\n',
              '        self.assertIn(\'msgid "Built-in verified catalog"\', text)\n        self.assertIn(\'msgid "RufusArm64 Persistent Live USB"\', text)\n        self.assertIn(\'msgid "Create persistent USB"\', text)\n',
              "persistence POT assertions",
          )

          tuple_anchor = '                ("rufusarm64", "AcquisitionDialog"),\n            ),'
          tuple_replacement = '                ("rufusarm64", "AcquisitionDialog"),\n                ("rufusarm64_persistence", "Window"),\n            ),'
          for filename in (
              "gui/test_checksum_dialog_i18n.py",
              "gui/test_device_qualification_i18n.py",
              "gui/test_ffu_dialog_i18n.py",
          ):
              replace_once(Path(filename), tuple_anchor, tuple_replacement, f"persistence class set in {filename}")

          windows_test = Path("gui/test_windows_options_dialog_i18n.py")
          replace_once(
              windows_test,
              '        self.assertEqual(module.SECONDARY_DIALOG_CLASSES[-2], ("rufusarm64", "WindowsOptionsDialog"))\n        self.assertEqual(module.SECONDARY_DIALOG_CLASSES[-1], ("rufusarm64", "AcquisitionDialog"))\n',
              '        self.assertEqual(module.SECONDARY_DIALOG_CLASSES[-3], ("rufusarm64", "WindowsOptionsDialog"))\n        self.assertEqual(module.SECONDARY_DIALOG_CLASSES[-2], ("rufusarm64", "AcquisitionDialog"))\n        self.assertEqual(module.SECONDARY_DIALOG_CLASSES[-1], ("rufusarm64_persistence", "Window"))\n',
              "Windows options persistence ordering",
          )
          acquisition_test = Path("gui/test_acquisition_dialog_i18n.py")
          replace_once(
              acquisition_test,
              '        self.assertEqual(module.SECONDARY_DIALOG_CLASSES[-1], ("rufusarm64", "AcquisitionDialog"))\n        self.assertEqual(module.SECONDARY_DIALOG_CLASSES.count(("rufusarm64", "AcquisitionDialog")), 1)\n',
              '        self.assertEqual(module.SECONDARY_DIALOG_CLASSES[-2], ("rufusarm64", "AcquisitionDialog"))\n        self.assertEqual(module.SECONDARY_DIALOG_CLASSES[-1], ("rufusarm64_persistence", "Window"))\n        self.assertEqual(module.SECONDARY_DIALOG_CLASSES.count(("rufusarm64", "AcquisitionDialog")), 1)\n',
              "acquisition persistence ordering",
          )
          contract = Path("gui/test_guarded_dialog_i18n_contract.py")
          replace_once(
              contract,
              '            \'("rufusarm64", "AcquisitionDialog")\',\n',
              '            \'("rufusarm64", "AcquisitionDialog")\',\n            \'("rufusarm64_persistence", "Window")\',\n',
              "persistence contract class marker",
          )

          persistence_test = dedent('''
              import ast
              import re
              from pathlib import Path
              import sys
              import tempfile
              import unittest


              GUI_DIR = Path(__file__).resolve().parent
              ROOT = GUI_DIR.parent
              if str(GUI_DIR) not in sys.path:
                  sys.path.insert(0, str(GUI_DIR))

              from test_i18n import Button, CheckButton, Entry, Expander, FileChooserButton, FileFilter, Frame, HeaderBar, Label, ProgressBar, TextView, Window, load_i18n_module, write_mo


              SOURCE = GUI_DIR / "rufusarm64_persistence.py"
              WRAPPER = ROOT / "packaging" / "rufusarm64-persistence"


              class PersistenceWizardLocalizationTests(unittest.TestCase):
                  def test_real_catalog_translates_static_shell_and_preserves_values_and_evidence(self):
                      module, _ = load_i18n_module()
                      intro_source = (
                          "Choose a supported Ubuntu or Debian ISO, select a removable USB drive, and choose how much space "
                          "to keep for files and settings. RufusArm64 checks compatibility before it allows the USB to be erased."
                      )
                      support_source = (
                          "This feature supports recognized Ubuntu 20.04 or newer and Debian live images. Some images or computers "
                          "may not be compatible; RufusArm64 checks the ISO before writing anything to the USB."
                      )
                      check_source = (
                          "This check reads the ISO without changing the USB. It confirms that the selected image supports "
                          "persistence and that the USB has enough space."
                      )
                      translations = {
                          "RufusArm64 Persistent Live USB": "USB live persistant RufusArm64",
                          "Ubuntu casper and Debian live-boot": "Ubuntu casper et Debian live-boot",
                          "Create a persistent live Linux USB": "Créer une clé USB Linux live persistante",
                          intro_source: "Choisissez une image prise en charge, une clé USB et l'espace persistant.",
                          support_source: "Cette fonction prend en charge les images Ubuntu et Debian reconnues.",
                          "Linux ISO": "ISO Linux",
                          "Choose a plain Linux ISOHybrid image": "Choisir une image ISOHybrid Linux simple",
                          "Linux ISO images": "Images ISO Linux",
                          "USB drive": "Clé USB",
                          "Space for saved changes": "Espace pour les modifications enregistrées",
                          "GiB — leave at 0 to use the recommended available space": "Gio — laisser 0 pour l'espace recommandé",
                          "Advanced options": "Options avancées",
                          "USB name": "Nom USB",
                          "The short name shown for the writable boot partition.": "Nom court de la partition de démarrage inscriptible.",
                          "Development validation": "Validation de développement",
                          "Validate media at UEFI boot (development only)": "Valider le support au démarrage UEFI (développement uniquement)",
                          "Unsigned development loader — Secure Boot compatibility is not established. Development testing only.": "Chargeur de développement non signé — compatibilité Secure Boot non établie.",
                          "Check compatibility": "Vérifier la compatibilité",
                          check_source: "Cette vérification lit l'ISO sans modifier la clé USB.",
                          "Check ISO and USB": "Vérifier l'ISO et la clé USB",
                          "Choose an ISO and USB drive, then check compatibility.": "Choisissez une ISO et une clé USB, puis vérifiez la compatibilité.",
                          "Ready": "Prêt",
                          "The USB cannot be erased until the compatibility check succeeds.": "La clé USB ne peut pas être effacée avant une vérification réussie.",
                          "Details and diagnostics": "Détails et diagnostics",
                          "Cancel": "Annuler",
                          "Create persistent USB": "Créer la clé USB persistante",
                      }
                      with tempfile.TemporaryDirectory() as directory:
                          locale_root = Path(directory)
                          write_mo(locale_root / "zz" / "LC_MESSAGES" / "rufusarm64.mo", translations)
                          translation = module.load_translation(str(locale_root), ["zz"])

                          header = HeaderBar("RufusArm64 Persistent Live USB", "Ubuntu casper and Debian live-boot")
                          heading = Label("Create a persistent live Linux USB", use_markup=True)
                          intro = Label(intro_source)
                          support = Label(support_source)
                          iso_label = Label("Linux ISO")
                          image_filter = FileFilter("Linux ISO images")
                          image = FileChooserButton("Choose a plain Linux ISOHybrid image", "/tmp/ubuntu.iso", [image_filter])
                          usb_label = Label("USB drive")
                          target_value = Label("/dev/sdz — Vendor Model — 32.0 GiB")
                          space_label = Label("Space for saved changes")
                          size_value = Label("10")
                          size_help = Label("GiB — leave at 0 to use the recommended available space")
                          advanced = Expander("Advanced options")
                          usb_name = Label("USB name")
                          volume = Entry(None)
                          volume_value = Label("RUFUS-LIVE")
                          volume.tooltip = "The short name shown for the writable boot partition."
                          validation_label = Label("Development validation")
                          runtime = CheckButton("Validate media at UEFI boot (development only)")
                          runtime_warning = Label("Unsigned development loader — Secure Boot compatibility is not established. Development testing only.")
                          frame = Frame("Check compatibility")
                          check_note = Label(check_source)
                          analyze = Button("Check ISO and USB")
                          summary = Label("Choose an ISO and USB drive, then check compatibility.")
                          progress = ProgressBar("Ready")
                          detail = Label("The USB cannot be erased until the compatibility check succeeds.")
                          diagnostics = Expander("Details and diagnostics")
                          log = TextView("[12:00:00] Image: /tmp/ubuntu.iso\\nTarget identity: serial:abc")
                          cancel = Button("Cancel")
                          create = Button("Create persistent USB")
                          window = Window(
                              title="RufusArm64 Persistent Live USB",
                              children=[header, heading, intro, support, iso_label, image, usb_label, target_value, space_label, size_value, size_help, advanced, usb_name, volume, volume_value, validation_label, runtime, runtime_warning, frame, check_note, analyze, summary, progress, detail, diagnostics, log, cancel, create],
                          )

                          self.assertFalse(module.translate_widget_tree(window, translation))
                          self.assertEqual(window.title, translations["RufusArm64 Persistent Live USB"])
                          self.assertEqual(header.title, translations["RufusArm64 Persistent Live USB"])
                          self.assertEqual(header.subtitle, translations["Ubuntu casper and Debian live-boot"])
                          self.assertEqual(heading.text, translations["Create a persistent live Linux USB"])
                          self.assertEqual(heading.markup, "<span size='large' weight='bold'>Créer une clé USB Linux live persistante</span>")
                          self.assertEqual(intro.text, translations[intro_source])
                          self.assertEqual(support.text, translations[support_source])
                          self.assertEqual(iso_label.text, translations["Linux ISO"])
                          self.assertEqual(image.title, translations["Choose a plain Linux ISOHybrid image"])
                          self.assertEqual(image_filter.name, translations["Linux ISO images"])
                          self.assertEqual(usb_label.text, translations["USB drive"])
                          self.assertEqual(space_label.text, translations["Space for saved changes"])
                          self.assertEqual(size_help.text, translations["GiB — leave at 0 to use the recommended available space"])
                          self.assertEqual(advanced.label, translations["Advanced options"])
                          self.assertEqual(usb_name.text, translations["USB name"])
                          self.assertEqual(volume.tooltip, translations["The short name shown for the writable boot partition."])
                          self.assertEqual(validation_label.text, translations["Development validation"])
                          self.assertEqual(runtime.label, translations["Validate media at UEFI boot (development only)"])
                          self.assertEqual(runtime_warning.text, translations["Unsigned development loader — Secure Boot compatibility is not established. Development testing only."])
                          self.assertEqual(frame.label, translations["Check compatibility"])
                          self.assertEqual(check_note.text, translations[check_source])
                          self.assertEqual(analyze.label, translations["Check ISO and USB"])
                          self.assertEqual(summary.text, translations["Choose an ISO and USB drive, then check compatibility."])
                          self.assertEqual(progress.text, translations["Ready"])
                          self.assertEqual(detail.text, translations["The USB cannot be erased until the compatibility check succeeds."])
                          self.assertEqual(diagnostics.label, translations["Details and diagnostics"])
                          self.assertEqual(cancel.label, translations["Cancel"])
                          self.assertEqual(create.label, translations["Create persistent USB"])

                          self.assertEqual(image.filename, "/tmp/ubuntu.iso")
                          self.assertEqual(target_value.text, "/dev/sdz — Vendor Model — 32.0 GiB")
                          self.assertEqual(size_value.text, "10")
                          self.assertEqual(volume_value.text, "RUFUS-LIVE")
                          self.assertIsNone(volume.placeholder)
                          self.assertEqual(log.buffer.text, "[12:00:00] Image: /tmp/ubuntu.iso\\nTarget identity: serial:abc")

                  def test_wrapper_installs_localization_after_importing_persistence_module(self):
                      text = WRAPPER.read_text(encoding="utf-8")
                      match = re.search(r"<<'PYRUFUSARM64PERSISTENCE'\\n(.*)\\nPYRUFUSARM64PERSISTENCE\\n\\Z", text, re.DOTALL)
                      self.assertIsNotNone(match)
                      payload = match.group(1)
                      compile(payload, str(WRAPPER), "exec")
                      pin = payload.index('gi.require_version("Gtk", "3.0")')
                      i18n_import = payload.index("from rufusarm64_i18n import install_secondary_dialog_localization")
                      persistence_import = payload.index("import rufusarm64_persistence as persistence")
                      install = payload.index("install_secondary_dialog_localization()")
                      run = payload.index("persistence.App().run(None)")
                      self.assertLess(pin, i18n_import)
                      self.assertLess(i18n_import, persistence_import)
                      self.assertLess(persistence_import, install)
                      self.assertLess(install, run)

                  def test_source_preserves_selection_plan_confirmation_process_and_evidence_contracts(self):
                      source = SOURCE.read_text(encoding="utf-8")
                      self.assertNotIn("rufusarm64_i18n", source)
                      tree = ast.parse(source, filename=str(SOURCE))
                      window_class = next(node for node in tree.body if isinstance(node, ast.ClassDef) and node.name == "Window")
                      window_source = ast.get_source_segment(source, window_class) or ""
                      for marker in (
                          "inspect_source_identity(image)",
                          "target_identity = str(device.get(\"identity\") or \"\").strip()",
                          "normalize_persistence_gib(self.size.get_value_as_int())",
                          "normalize_boot_label(self.volume_label.get_text())",
                          "key = (image, source_identity, target_identity, target_size, size_gib, label, runtime_validation)",
                          "build_analyze_command(",
                          "build_create_command(",
                          "self.plan_key != key",
                          "self.cancel_path = self.new_cancel_path()",
                          "start_new_session=True",
                          "os.killpg(self.process.pid, signal.SIGTERM)",
                          "json.loads(line)",
                          "completion_checklist()",
                      ):
                          self.assertIn(marker, window_source)


              if __name__ == "__main__":
                  unittest.main()
          ''').lstrip()
          Path("gui/test_persistence_wizard_i18n.py").write_text(persistence_test, encoding="utf-8")

          release = Path("docs/release-0.15.0.md")
          replace_once(
              release,
              "- Static opening-shell localization for verified image acquisition while preserving threshold trust, rollback protection, catalog/image evidence, resumable download state, and atomic publication.\n",
              "- Static opening-shell localization for verified image acquisition while preserving threshold trust, rollback protection, catalog/image evidence, resumable download state, and atomic publication.\n- Static opening-shell localization for the dedicated persistent live USB wizard while preserving source/target identity, selected values, planning, confirmation, privileged creation, cancellation, qualification, and evidence.\n",
              "persistence release note",
          )
          replace_once(
              release,
              "- Generated `FORMAT ...`, `WRITE FREEDOS ...`, `SAVE ...`, and `RESTORE AUTHENTICATED FFU ...` confirmation phrases, comparison logic, selected values, media capability summaries/reasons, local usernames, locale/time-zone identifiers, generated answer-file values, acquisition channel/mode/image IDs, trust paths, metadata versions/expiry/key IDs, filenames, sizes, digests, resumable state, machine-readable JSON, command flags, paths, identities, filesystem planner values, diagnostic/report schemas, and dynamic evidence remain byte-stable and untranslated.\n",
              "- Generated `FORMAT ...`, `WRITE FREEDOS ...`, `SAVE ...`, `RESTORE AUTHENTICATED FFU ...`, and persistence confirmation phrases, comparison logic, selected values, persistence size/label/runtime-validation values, plan keys, media capability summaries/reasons, local usernames, locale/time-zone identifiers, generated answer-file values, acquisition channel/mode/image IDs, trust paths, metadata versions/expiry/key IDs, filenames, sizes, digests, resumable state, machine-readable JSON, command flags, paths, identities, filesystem planner values, diagnostic/qualification/report schemas, and dynamic evidence remain byte-stable and untranslated.\n",
              "persistence release safety note",
          )

          localization = Path("docs/localization.md")
          replace_once(
              localization,
              "Verified image acquisition translates only the static opening shell, including reviewed frame and chooser presentation. Channel/mode/image IDs, trust paths, metadata versions and expiry, signing-key IDs, image filename/size/SHA-256, selected image objects, provider commands/errors, elapsed status, rollback decisions, resumable partial state, checksum evidence, returned values, and atomic publication remain untranslated.\n",
              "Verified image acquisition translates only the static opening shell, including reviewed frame and chooser presentation. Channel/mode/image IDs, trust paths, metadata versions and expiry, signing-key IDs, image filename/size/SHA-256, selected image objects, provider commands/errors, elapsed status, rollback decisions, resumable partial state, checksum evidence, returned values, and atomic publication remain untranslated.\n\nThe dedicated persistent live USB wizard translates only its reviewed static opening shell and ISO chooser presentation. Image path/source identity, device entries and target identity/capacity, persistence size, boot-volume label value, runtime-validation boolean, plan key/plan, generated confirmation, helper commands, cancellation marker, progress/report JSON, qualification checksums/timestamps, diagnostics, and final evidence remain untranslated.\n",
              "persistence localization guide",
          )

          roadmap = Path("ROADMAP.md")
          replace_once(
              roadmap,
              "- Static opening-shell localization for verified image acquisition without changing trust metadata, image evidence, resume, or publication\n",
              "- Static opening-shell localization for verified image acquisition without changing trust metadata, image evidence, resume, or publication\n- Static opening-shell localization for the dedicated persistent live USB wizard without changing identity, selected values, confirmation, qualification, or evidence\n",
              "persistence roadmap note",
          )

          changelog = Path("CHANGELOG.md")
          replace_once(
              changelog,
              "- Localized the static verified-image acquisition shell while preserving threshold trust, rollback checks, channel and image IDs, trust paths, metadata and digest evidence, resumable state, provider commands, returned values, and atomic publication byte-for-byte.\n",
              "- Localized the static verified-image acquisition shell while preserving threshold trust, rollback checks, channel and image IDs, trust paths, metadata and digest evidence, resumable state, provider commands, returned values, and atomic publication byte-for-byte.\n- Localized the dedicated persistent live USB wizard's static opening shell while preserving source/target identity, selected size/label/runtime values, planning, confirmation, privileged creation, cancellation, qualification, and evidence byte-for-byte.\n",
              "persistence changelog note",
