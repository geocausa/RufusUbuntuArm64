name: Restore exact changelog history once

on:
  push:
    branches:
      - feature/gettext-primary-ui

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/gettext-primary-ui
          fetch-depth: 0
      - name: Restore base history and add only reviewed Unreleased entries
        shell: bash
        run: |
          set -euo pipefail
          git show 1911fde6d013768a82fd2d8191813172226f8088:CHANGELOG.md > CHANGELOG.md
          python3 - <<'PY'
          from pathlib import Path
          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          needle = "- Added guarded ext2 and ext3 data-only formatting through the existing identity-bound GPT/MBR planner, exact confirmation, read-only e2fsck verification, strict CLI/GTK report contract, and real loop-device qualification.\n"
          additions = needle + (
              "- Added application-scoped System, Light, and Dark appearance selection with canonical persisted settings and safe restoration of the startup desktop preference.\n"
              "- Completed bounded main-window option/action tooltips while preserving workflow-specific disclosures.\n"
              "- Added a standard GNU gettext runtime, deterministic primary-interface POT, safe English fallback, and exact post-composition translation for reviewed static main-window, tooltip, appearance, and accessibility text while keeping machine and destructive-operation contracts byte-stable.\n"
          )
          if text.count(needle) != 1:
              raise SystemExit("Unreleased changelog insertion point changed")
          path.write_text(text.replace(needle, additions, 1), encoding="utf-8")
          PY
          git rm .github/workflows/restore-changelog-once.yml
          git add CHANGELOG.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "docs: preserve exact changelog history for Stage 4 entries"
          git push origin HEAD:feature/gettext-primary-ui
