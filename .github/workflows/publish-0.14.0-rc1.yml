name: Publish RufusArm64 0.14.0-rc1 prerelease

on:
  pull_request:
    branches:
      - stage3/0.14.0

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-rufusarm64-0.14.0-rc1
  cancel-in-progress: false

env:
  PRODUCT_COMMIT: 5d0f9ea97af8c055df2a9412b491b9888ec8f665
  OPS_BRANCH: ops/publish-0.14.0-rc1
  RELEASE_TAG: 0.14.0-rc1
  RELEASE_VERSION: 0.14.0-rc1
  VERSION: 0.14.0~rc1
  RUFUS_ALLOW_NONRELEASE_VERSION: '1'
  DEPENDENCY_RUN_ID: '30225537540'
  WIM_ARTIFACT: rc1-wimlib-arm64-30225537540
  WIM_ARTIFACT_DIGEST: sha256:64c6613d08fa812bc1adedd2838517d1c54f549ff8a7694d41e8b679c3576984
  UEFI_ARTIFACT: rc1-uefi-md5sum-arm64-30225537540
  UEFI_ARTIFACT_DIGEST: sha256:4e81647efc8b41e721b03fa7fabcba52616794dc60db6458d58b5b26afdc6117

jobs:
  publish:
    if: >-
      github.repository == 'geocausa/RufusUbuntuArm64' &&
      github.event.pull_request.head.ref == 'ops/publish-0.14.0-rc1'
    name: Build, verify, tag, and publish prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: 5d0f9ea97af8c055df2a9412b491b9888ec8f665
          fetch-depth: 1
      - name: Verify exact release-candidate source and version policy
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PRODUCT_COMMIT}"
          test "$(tr -d '\r\n' < VERSION)" = '0.14.0'
          dpkg --validate-version "${VERSION}"
          dpkg --compare-versions "${VERSION}" lt 0.14.0
      - name: Authenticate prerequisite build jobs and artifact archives
        run: |
          set -euo pipefail
          jobs_endpoint="repos/${GITHUB_REPOSITORY}/actions/runs/${DEPENDENCY_RUN_ID}/jobs?per_page=100"
          test "$(gh api "${jobs_endpoint}" --jq '.jobs[] | select(.name == "Rebuild pinned ARM64 WIM engine") | .conclusion')" = 'success'
          test "$(gh api "${jobs_endpoint}" --jq '.jobs[] | select(.name == "Reproduce pinned ARM64 UEFI integrity loader") | .conclusion')" = 'success'
          artifacts_endpoint="repos/${GITHUB_REPOSITORY}/actions/runs/${DEPENDENCY_RUN_ID}/artifacts?per_page=100"
          test "$(gh api "${artifacts_endpoint}" --jq ".artifacts[] | select(.name == \"${WIM_ARTIFACT}\") | .digest")" = "${WIM_ARTIFACT_DIGEST}"
          test "$(gh api "${artifacts_endpoint}" --jq ".artifacts[] | select(.name == \"${UEFI_ARTIFACT}\") | .digest")" = "${UEFI_ARTIFACT_DIGEST}"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.WIM_ARTIFACT }}
          path: vendor/wimlib
          github-token: ${{ github.token }}
          run-id: ${{ env.DEPENDENCY_RUN_ID }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.UEFI_ARTIFACT }}
          path: vendor/uefi-md5sum/arm64
          github-token: ${{ github.token }}
          run-id: ${{ env.DEPENDENCY_RUN_ID }}
      - name: Verify downloaded prerequisite contents
        run: |
          set -euo pipefail
          (
            cd vendor/wimlib/source
            sha256sum -c wimlib-1.14.5-source.tar.gz.sha256
          )
          (
            cd vendor/uefi-md5sum/arm64
            sha256sum -c bootaa64.efi.sha256
            sha256sum -c uefi-md5sum-v1.2-source.tar.gz.sha256
          )
      - name: Install package and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck desktop-file-utils appstream lintian dosfstools e2fsprogs \
            file genisoimage qemu-utils qemu-user-static
      - name: Run complete non-release test and package contract
        run: |
          set -euo pipefail
          mkdir -p dist/prerelease-logs
          set -o pipefail
          ./scripts/test.sh 2>&1 | tee dist/prerelease-logs/test-and-package.log
      - name: Confirm prerelease package reproducibility
        run: |
          set -euo pipefail
          set -o pipefail
          bash ./scripts/reproducible-package.sh 2>&1 | tee dist/prerelease-logs/reproducible-package.log
      - name: Verify package identity and build deterministic release assets
        id: assets
        run: |
          set -euo pipefail
          package="dist/rufusarm64_${VERSION}_arm64.deb"
          checksum="${package}.sha256"
          test -f "${package}"
          test -f "${checksum}"
          (
            cd dist
            sha256sum -c "$(basename "${checksum}")"
          )
          test "$(dpkg-deb -f "${package}" Version)" = "${VERSION}"
          test "$(dpkg-deb -f "${package}" Architecture)" = 'arm64'
          package_root="$(mktemp -d)"
          trap 'rm -rf "${package_root}"' EXIT
          dpkg-deb -x "${package}" "${package_root}"
          for binary in rufusarm64-helper rufusarm64-device-qualify rufusarm64-device-backup; do
            file "${package_root}/usr/lib/rufusarm64/${binary}" | grep -F 'ARM aarch64'
            test "$(qemu-aarch64-static "${package_root}/usr/lib/rufusarm64/${binary}" version)" = "${VERSION}"
          done
          runtime_loader="${package_root}/usr/lib/rufusarm64/bootaa64-uefi-md5sum.efi"
          test "$(stat -c %s "${runtime_loader}")" -eq 40960
          test "$(sha256sum "${runtime_loader}" | awk '{print $1}')" = '543615a8e97fed1cb5293bee7bdfe10f9feb6979f191b20ab32dafdcf097b502'

          source_name="RufusArm64-${RELEASE_VERSION}-source.tar.gz"
          git archive --format=tar --prefix="RufusArm64-${RELEASE_VERSION}/" "${PRODUCT_COMMIT}" | gzip -n > "dist/${source_name}"
          (
            cd dist
            sha256sum "${source_name}" > "${source_name}.sha256"
          )

          package_sha="$(sha256sum "${package}" | awk '{print $1}')"
          source_sha="$(sha256sum "dist/${source_name}" | awk '{print $1}')"
          python3 - "dist/RELEASE-EVIDENCE-${RELEASE_VERSION}.json" "${package_sha}" "${source_sha}" <<'PY'
          import json
          import os
          import sys

          path, package_sha, source_sha = sys.argv[1:]
          evidence = {
              'schema': 1,
              'release': os.environ['RELEASE_VERSION'],
              'tag': os.environ['RELEASE_TAG'],
              'debian_version': os.environ['VERSION'],
              'product_commit': os.environ['PRODUCT_COMMIT'],
              'dependency_artifact_run_id': os.environ['DEPENDENCY_RUN_ID'],
              'dependency_artifacts': {
                  'wimlib': {
                      'name': os.environ['WIM_ARTIFACT'],
                      'archive_digest': os.environ['WIM_ARTIFACT_DIGEST'],
                  },
                  'uefi_md5sum': {
                      'name': os.environ['UEFI_ARTIFACT'],
                      'archive_digest': os.environ['UEFI_ARTIFACT_DIGEST'],
                  },
              },
              'package': f"rufusarm64_{os.environ['VERSION']}_arm64.deb",
              'package_sha256': package_sha,
              'source_archive': f"RufusArm64-{os.environ['RELEASE_VERSION']}-source.tar.gz",
              'source_sha256': source_sha,
              'prerelease': True,
              'boundaries': {
                  'ffu_restore': 'experimental-single-store-v1',
                  'ffu_capture': 'unimplemented',
                  'iso_udf_capture': 'one-mounted-filesystem-remaster-not-whole-disk-or-bootability-proof',
                  'uefi_integrity_loader': 'unsigned-secure-boot-not-established',
                  'physical_hardware_qualification': 'pending-checklist',
              },
          }
          with open(path, 'w', encoding='utf-8') as handle:
              json.dump(evidence, handle, indent=2, sort_keys=True)
              handle.write('\n')
          PY
          python3 -m json.tool "dist/RELEASE-EVIDENCE-${RELEASE_VERSION}.json" >/dev/null
          git diff --exit-code
          echo "package=${package}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${checksum}" >> "${GITHUB_OUTPUT}"
          echo "source=dist/${source_name}" >> "${GITHUB_OUTPUT}"
          echo "source_checksum=dist/${source_name}.sha256" >> "${GITHUB_OUTPUT}"
          echo "evidence=dist/RELEASE-EVIDENCE-${RELEASE_VERSION}.json" >> "${GITHUB_OUTPUT}"
          echo "package_sha=${package_sha}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
      - name: Create or authenticate the immutable prerelease tag
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            test "$(git rev-list -n1 "refs/tags/${RELEASE_TAG}")" = "${PRODUCT_COMMIT}"
          else
            git tag -a "${RELEASE_TAG}" "${PRODUCT_COMMIT}" \
              -m "RufusArm64 ${RELEASE_VERSION} prerelease from ${PRODUCT_COMMIT}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi
      - name: Publish or authenticate the GitHub prerelease
        id: release
        run: |
          set -euo pipefail
          notes="dist/RELEASE-NOTES-${RELEASE_VERSION}.md"
          cat > "${notes}" <<EOF
          # RufusArm64 ${RELEASE_VERSION}

          This is the first public **0.14.0 prerelease candidate** for Ubuntu ARM64.

          - Source commit: \`${PRODUCT_COMMIT}\`
          - Debian package version: \`${VERSION}\` (sorts before stable \`0.14.0\`)
          - Publication workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Authenticated prerequisite run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${DEPENDENCY_RUN_ID}

          ## Main candidate changes

          - Verified raw, dynamic VHD, dynamic VHDX, and mounted-filesystem ISO/UDF drive backup.
          - Experimental authenticated FFU restore for the narrowly supported single-store-v1 profile.
          - Reusable identity-bound USB qualification reports, bounded compressed-image progress, El Torito UEFI extraction, and the opt-in Windows 11 setup Quality of Life policy.

          ## Boundaries

          FFU restore is experimental; FFU capture is not implemented. ISO/UDF capture remasters one admitted mounted filesystem and is neither a whole-disk image nor proof of bootability. The optional package-owned UEFI integrity loader is unsigned, so Secure Boot compatibility is not established. Physical hardware observations remain pending under \`docs/hardware-checklist-0.14.0.md\`; this prerelease does not claim universal device, firmware, controller, flash-health, boot, recovery, or vendor compatibility.

          Verify the Debian package with its adjacent SHA-256 sidecar before installation.
          EOF

          assets=(
            "${{ steps.assets.outputs.package }}"
            "${{ steps.assets.outputs.checksum }}"
            "${{ steps.assets.outputs.source }}"
            "${{ steps.assets.outputs.source_checksum }}"
            "${{ steps.assets.outputs.evidence }}"
          )
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id')"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.prerelease')" = 'true'
            existing="$(mktemp -d)"
            trap 'rm -rf "${existing}"' EXIT
            asset_names="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" --jq '.[].name')"
            for asset in "${assets[@]}"; do
              name="$(basename "${asset}")"
              if grep -Fxq "${name}" <<<"${asset_names}"; then
                gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "${name}" --dir "${existing}"
                cmp "${asset}" "${existing}/${name}"
              else
                gh release upload "${RELEASE_TAG}" "${asset}" --repo "${GITHUB_REPOSITORY}"
              fi
            done
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --prerelease \
              --title "RufusArm64 ${RELEASE_VERSION}" \
              --notes-file "${notes}"
          fi
          release_url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.html_url')"
          test -n "${release_url}"
          echo "url=${release_url}" >> "${GITHUB_OUTPUT}"
      - name: Record publication and close the operational PR
        run: |
          set -euo pipefail
          comment="$(mktemp)"
          cat > "${comment}" <<EOF
          Published the authenticated **RufusArm64 ${RELEASE_VERSION}** GitHub prerelease.

          - Release: ${{ steps.release.outputs.url }}
          - Exact product commit: \`${PRODUCT_COMMIT}\`
          - Debian version: \`${VERSION}\`
          - Package SHA-256: \`${{ steps.assets.outputs.package_sha }}\`
          - Source SHA-256: \`${{ steps.assets.outputs.source_sha }}\`
          - Publication run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Authenticated prerequisite run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${DEPENDENCY_RUN_ID}

          This operational branch is not merged into the release branch. Stable promotion remains separately gated by the 0.14.0 physical/prerelease checklist.
          EOF
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file "${comment}"
          gh pr close "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}"
          git push origin --delete "${OPS_BRANCH}"
      - name: Upload operational logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rc1-publication-failure-${{ github.run_id }}
          path: dist/prerelease-logs/
          if-no-files-found: warn
          retention-days: 14
