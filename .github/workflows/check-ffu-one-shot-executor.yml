name: Validate one-shot FFU executor

on:
  push:
    branches: [feature/ffu-one-shot-executor]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.22.x'
          cache: true
      - name: Apply one-shot capability patch and format
        run: |
          python3 scripts/patch-ffu-one-shot-executor.py
          gofmt -w internal/ffu/restore_mutation_authorization_linux.go internal/ffu/restore_executor_linux.go internal/ffu/restore_executor_linux_test.go internal/ffu/restore_executor_policy_contract_test.go
      - name: Test focused package
        run: |
          set +e
          go test -count=1 ./internal/ffu 2>&1 | tee /tmp/ffu-one-shot-executor-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/ffu-one-shot-executor-test.log internal/ffu/restore_executor_diagnostic.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add internal/ffu/restore_executor_diagnostic.txt
            git commit -m "Diagnostic: capture one-shot FFU executor failure"
            git push origin "HEAD:feature/ffu-one-shot-executor"
            exit "$status"
          fi
      - name: Vet focused package
        run: go vet ./internal/ffu
      - name: Race focused package
        run: go test -race -count=1 ./internal/ffu
      - name: Staticcheck focused package
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          "$(go env GOPATH)/bin/staticcheck" ./internal/ffu
      - name: Cross-compile ARM64 focused package
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go test -c ./internal/ffu -o /tmp/ffu-arm64.test
      - name: Publish clean product tree
        env:
          BRANCH: feature/ffu-one-shot-executor
        run: |
          git rm .github/workflows/check-ffu-one-shot-executor.yml scripts/patch-ffu-one-shot-executor.py
          git rm -f internal/ffu/restore_executor_diagnostic.txt || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ffu-one-shot-executor.md internal/ffu/restore_mutation_authorization_linux.go internal/ffu/restore_executor_linux.go internal/ffu/restore_executor_linux_test.go internal/ffu/restore_executor_policy_contract_test.go
          git commit -m "FFU: execute sealed single-phase restore transaction"
          git push origin "HEAD:${BRANCH}"
