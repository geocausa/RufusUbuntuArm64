name: Patch Windows options localization once

on:
  pull_request:
    branches:
      - stage4/0.15.0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/gettext-windows-options-dialog
      - name: Add bounded Windows Setup options localization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{label} changed")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          i18n = Path("gui/rufusarm64_i18n.py")
          replace_once(
              i18n,
              '    ("rufusarm64_freedos_dialog", "FreeDOSFormatDialog"),\n)',
              '    ("rufusarm64_freedos_dialog", "FreeDOSFormatDialog"),\n    ("rufusarm64", "WindowsOptionsDialog"),\n)',
              "Windows options class registration",
          )
          additions = (
              ('    N_("Apply"),\n', '    N_("Apply"),\n    N_("Apply Rufus Quality of Life changes"),\n', "quality of life label"),
              ('    N_("Cancel"),\n', '    N_("Cancel"),\n    N_("Continue"),\n', "continue control"),
              ('    N_("Create USB"),\n', '    N_("Create USB"),\n    N_("Create a local administrator account"),\n    N_("Customize Windows Setup"),\n', "Windows setup heading and account label"),
              ('    N_("Details and diagnostics"),\n', '    N_("Details and diagnostics"),\n    N_("Disable automatic BitLocker device-encryption provisioning"),\n    N_("Does not decrypt an existing installation. It prevents automatic encryption during this new setup where supported."),\n', "BitLocker wording"),
              ('    N_("Everything on the selected drive will be permanently erased. Cancelling after erasure may leave intentionally incomplete media that must be formatted again before use."),\n', '    N_("Every option below is optional. RufusArm64 creates an autounattend.xml file on the USB; the Windows ISO itself is not changed. Leave everything unchecked for standard Microsoft setup."),\n    N_("Everything on the selected drive will be permanently erased. Cancelling after erasure may leave intentionally incomplete media that must be formatted again before use."),\n', "Windows setup introduction"),
              ('    N_("Image checksums"),\n', '    N_("Image checksums"),\n    N_("Account name"),\n', "account name label"),
              ('    N_("MD5 and SHA-1 are included only for comparison with legacy published values. They are not used by RufusArm64 for trust, signatures, downloads, or write assurance."),\n', '    N_("MD5 and SHA-1 are included only for comparison with legacy published values. They are not used by RufusArm64 for trust, signatures, downloads, or write assurance."),\n    N_("Microsoft can change unattended-setup behavior between Windows releases. RufusArm64 validates the answer file, but Windows may ignore an option that a future build no longer supports."),\n', "Windows setup compatibility warning"),
              ('    N_("Open read-only UEFI media validation. Shortcut Ctrl+U."),\n', '    N_("Open read-only UEFI media validation. Shortcut Ctrl+U."),\n    N_("Remove TPM 2.0, Secure Boot and minimum-RAM checks"),\n    N_("Remove the Microsoft online-account requirement"),\n    N_("Removes bundled OneDrive setup, Outlook and Teams, and disables Copilot, web search, consumer-content suggestions and related Microsoft promotions."),\n', "Windows setup removal options"),
              ('    N_("Save a byte-for-byte image of the selected removable drive. The source is opened read-only, but its mounted filesystems may be unmounted briefly to obtain a coherent image. Create USB and Check USB are separate workflows."),\n', '    N_("Save a byte-for-byte image of the selected removable drive. The source is opened read-only, but its mounted filesystems may be unmounted briefly to obtain a coherent image. Create USB and Check USB are separate workflows."),\n    N_("Sets Windows Setup privacy choices and disables advertising/consumer-content policies where supported."),\n    N_("Skip privacy prompts and reduce initial data collection/recommendations"),\n', "privacy options"),
              ('    N_("System"),\n', '    N_("System"),\n    N_("Use this Ubuntu user\'s regional settings"),\n', "regional settings label"),
              ('    N_("Windows drivers"),\n', '    N_("Windows drivers"),\n    N_("Windows installation options"),\n    N_("Allows Windows setup to continue with a local account when supported by that Windows build."),\n    N_("Useful for unsupported PCs. This normally is not needed on a Surface Pro 11 X1E."),\n', "Windows options title and descriptions"),
          )
          for old, new, label in additions:
              replace_once(i18n, old, new, label)
          replace_once(
              i18n,
              '    "Non bootable — data-only media": "<span size=\'large\' weight=\'bold\'>{}</span>",\n}',
              '    "Non bootable — data-only media": "<span size=\'large\' weight=\'bold\'>{}</span>",\n    "Customize Windows Setup": "<span size=\'large\' weight=\'bold\'>{}</span>",\n}',
              "Windows setup markup template",
          )

          tests = Path("gui/test_i18n.py")
          replace_once(
              tests,
              '        names = ("rufusarm64_checksums", "rufusarm64_device_qualify_dialog", "rufusarm64_ffu_dialog", "rufusarm64_nonbootable_dialog", "rufusarm64_freedos_dialog")',
              '        names = ("rufusarm64_checksums", "rufusarm64_device_qualify_dialog", "rufusarm64_ffu_dialog", "rufusarm64_nonbootable_dialog", "rufusarm64_freedos_dialog", "rufusarm64")',
              "secondary module names",
          )
          replace_once(
              tests,
              '            self.assertEqual([dialog.marker for dialog in dialogs], ["dialog-0", "dialog-1", "dialog-2", "dialog-3", "dialog-4", "dialog-5"])',
              '            self.assertEqual([dialog.marker for dialog in dialogs], ["dialog-0", "dialog-1", "dialog-2", "dialog-3", "dialog-4", "dialog-5", "dialog-6"])',
              "secondary dialog marker count",
          )
          replace_once(
              tests,
              '        self.assertIn(\'msgid "Review Full Flash Update"\', text)\n',
              '        self.assertIn(\'msgid "Review Full Flash Update"\', text)\n        self.assertIn(\'msgid "Windows installation options"\', text)\n        self.assertIn(\'msgid "Customize Windows Setup"\', text)\n',
              "Windows options POT assertions",
          )

          tuple_anchor = '                ("rufusarm64_freedos_dialog", "FreeDOSFormatDialog"),\n            ),'
          tuple_replacement = '                ("rufusarm64_freedos_dialog", "FreeDOSFormatDialog"),\n                ("rufusarm64", "WindowsOptionsDialog"),\n            ),'
          for filename in (
              "gui/test_checksum_dialog_i18n.py",
              "gui/test_device_qualification_i18n.py",
              "gui/test_ffu_dialog_i18n.py",
          ):
              replace_once(Path(filename), tuple_anchor, tuple_replacement, f"Windows options class set in {filename}")

          contract = Path("gui/test_guarded_dialog_i18n_contract.py")
          replace_once(
              contract,
              '            \'("rufusarm64_ffu_dialog", "FFUReviewDialog")\',\n',
              '            \'("rufusarm64_ffu_dialog", "FFUReviewDialog")\',\n            \'("rufusarm64", "WindowsOptionsDialog")\',\n',
              "Windows options contract class marker",
          )

          windows_test = dedent('''
              import ast
              from pathlib import Path
              import sys
              import tempfile
              import unittest


              GUI_DIR = Path(__file__).resolve().parent
              if str(GUI_DIR) not in sys.path:
                  sys.path.insert(0, str(GUI_DIR))

              from test_i18n import Button, CheckButton, Entry, Label, Window, load_i18n_module, write_mo


              SOURCE = GUI_DIR / "rufusarm64.py"


              class WindowsOptionsDialogLocalizationTests(unittest.TestCase):
                  def test_real_catalog_translates_static_shell_and_preserves_machine_derived_values(self):
                      module, _ = load_i18n_module()
                      intro_source = (
                          "Every option below is optional. RufusArm64 creates an autounattend.xml file on the USB; "
                          "the Windows ISO itself is not changed. Leave everything unchecked for standard Microsoft setup."
                      )
                      warning_source = (
                          "Microsoft can change unattended-setup behavior between Windows releases. RufusArm64 validates "
                          "the answer file, but Windows may ignore an option that a future build no longer supports."
                      )
                      translations = {
                          "Windows installation options": "Options d'installation de Windows",
                          "Cancel": "Annuler",
                          "Continue": "Continuer",
                          "Customize Windows Setup": "Personnaliser l'installation de Windows",
                          intro_source: "Chaque option est facultative et l'image ISO Windows reste inchangée.",
                          "Remove TPM 2.0, Secure Boot and minimum-RAM checks": "Supprimer les contrôles TPM, Secure Boot et mémoire minimale",
                          "Useful for unsupported PCs. This normally is not needed on a Surface Pro 11 X1E.": "Utile pour les PC non pris en charge.",
                          "Remove the Microsoft online-account requirement": "Supprimer l'obligation de compte Microsoft en ligne",
                          "Allows Windows setup to continue with a local account when supported by that Windows build.": "Autoriser un compte local lorsque cette version de Windows le prend en charge.",
                          "Create a local administrator account": "Créer un compte administrateur local",
                          "Account name": "Nom du compte",
                          "Skip privacy prompts and reduce initial data collection/recommendations": "Ignorer les invites de confidentialité et réduire la collecte initiale",
                          "Sets Windows Setup privacy choices and disables advertising/consumer-content policies where supported.": "Configure les choix de confidentialité de Windows.",
                          "Apply Rufus Quality of Life changes": "Appliquer les améliorations de confort Rufus",
                          "Removes bundled OneDrive setup, Outlook and Teams, and disables Copilot, web search, consumer-content suggestions and related Microsoft promotions.": "Supprime les applications et promotions Microsoft facultatives.",
                          "Use this Ubuntu user's regional settings": "Utiliser les paramètres régionaux de cet utilisateur Ubuntu",
                          "Disable automatic BitLocker device-encryption provisioning": "Désactiver l'activation automatique du chiffrement BitLocker",
                          "Does not decrypt an existing installation. It prevents automatic encryption during this new setup where supported.": "Ne déchiffre pas une installation existante.",
                          warning_source: "Le comportement de l'installation automatisée peut changer selon la version de Windows.",
                      }
                      with tempfile.TemporaryDirectory() as directory:
                          locale_root = Path(directory)
                          write_mo(locale_root / "zz" / "LC_MESSAGES" / "rufusarm64.mo", translations)
                          translation = module.load_translation(str(locale_root), ["zz"])

                          cancel = Button("Cancel")
                          proceed = Button("Continue")
                          heading = Label("Customize Windows Setup", use_markup=True)
                          intro = Label(intro_source)
                          hardware = CheckButton("Remove TPM 2.0, Secure Boot and minimum-RAM checks")
                          hardware_detail = Label("Useful for unsupported PCs. This normally is not needed on a Surface Pro 11 X1E.")
                          online = CheckButton("Remove the Microsoft online-account requirement")
                          online_detail = Label("Allows Windows setup to continue with a local account when supported by that Windows build.")
                          local = CheckButton("Create a local administrator account")
                          account = Label("Account name")
                          username = Entry("geoca")
                          privacy = CheckButton("Skip privacy prompts and reduce initial data collection/recommendations")
                          privacy_detail = Label("Sets Windows Setup privacy choices and disables advertising/consumer-content policies where supported.")
                          qol = CheckButton("Apply Rufus Quality of Life changes")
                          qol_detail = Label("Removes bundled OneDrive setup, Outlook and Teams, and disables Copilot, web search, consumer-content suggestions and related Microsoft promotions.")
                          region = CheckButton("Use this Ubuntu user's regional settings")
                          region_detail = Label("Applies locale en-US and time zone Pacific Standard Time during Windows Setup.")
                          bitlocker = CheckButton("Disable automatic BitLocker device-encryption provisioning")
                          bitlocker_detail = Label("Does not decrypt an existing installation. It prevents automatic encryption during this new setup where supported.")
                          warning = Label(warning_source)
                          capability = Label("Detected Windows 11 Professional media (arm64; 2 editions; WIM payload). Unsupported options are disabled below.")
                          unsupported = CheckButton("Dynamic option", tooltip="This option is not supported by the selected Windows media.")
                          dialog = Window(
                              title="Windows installation options",
                              children=[
                                  cancel,
                                  proceed,
                                  heading,
                                  intro,
                                  hardware,
                                  hardware_detail,
                                  online,
                                  online_detail,
                                  local,
                                  account,
                                  username,
                                  privacy,
                                  privacy_detail,
                                  qol,
                                  qol_detail,
                                  region,
                                  region_detail,
                                  bitlocker,
                                  bitlocker_detail,
                                  warning,
                                  capability,
                                  unsupported,
                              ],
                          )

                          self.assertFalse(module.translate_widget_tree(dialog, translation))
                          self.assertEqual(dialog.title, translations["Windows installation options"])
                          self.assertEqual(cancel.label, translations["Cancel"])
                          self.assertEqual(proceed.label, translations["Continue"])
                          self.assertEqual(heading.text, translations["Customize Windows Setup"])
                          self.assertEqual(
                              heading.markup,
                              "<span size='large' weight='bold'>Personnaliser l'installation de Windows</span>",
                          )
                          self.assertEqual(intro.text, translations[intro_source])
                          self.assertEqual(hardware.label, translations["Remove TPM 2.0, Secure Boot and minimum-RAM checks"])
                          self.assertEqual(online.label, translations["Remove the Microsoft online-account requirement"])
                          self.assertEqual(local.label, translations["Create a local administrator account"])
                          self.assertEqual(account.text, translations["Account name"])
                          self.assertEqual(privacy.label, translations["Skip privacy prompts and reduce initial data collection/recommendations"])
                          self.assertEqual(qol.label, translations["Apply Rufus Quality of Life changes"])
                          self.assertEqual(region.label, translations["Use this Ubuntu user's regional settings"])
                          self.assertEqual(bitlocker.label, translations["Disable automatic BitLocker device-encryption provisioning"])
                          self.assertEqual(warning.text, translations[warning_source])

                          self.assertEqual(username.placeholder, "geoca")
                          self.assertEqual(region_detail.text, "Applies locale en-US and time zone Pacific Standard Time during Windows Setup.")
                          self.assertEqual(capability.text, "Detected Windows 11 Professional media (arm64; 2 editions; WIM payload). Unsupported options are disabled below.")
                          self.assertEqual(unsupported.tooltip, "This option is not supported by the selected Windows media.")

                  def test_exact_dialog_set_includes_windows_options_once(self):
                      module, _ = load_i18n_module()
                      self.assertEqual(module.SECONDARY_DIALOG_CLASSES[-1], ("rufusarm64", "WindowsOptionsDialog"))
                      self.assertEqual(module.SECONDARY_DIALOG_CLASSES.count(("rufusarm64", "WindowsOptionsDialog")), 1)

                  def test_source_preserves_capability_previous_value_and_answer_file_contracts(self):
                      source = SOURCE.read_text(encoding="utf-8")
                      self.assertNotIn("rufusarm64_i18n", source)
                      tree = ast.parse(source, filename=str(SOURCE))
                      dialog_class = next(node for node in tree.body if isinstance(node, ast.ClassDef) and node.name == "WindowsOptionsDialog")
                      dialog_source = ast.get_source_segment(source, dialog_class) or ""
                      for marker in (
                          'previous.get("bypass_hardware", False)',
                          'previous.get("bypass_online_account", False)',
                          'previous.get("local_user")',
                          'self.local_user.set_text(previous.get("local_user", ""))',
                          'previous.get("quality_of_life", False)',
                          'previous.get("use_regional_settings", False)',
                          'self.apply_option_capability',
                          'self.use_region.set_sensitive(regional_allowed)',
                          'validate_local_username(self.local_user.get_text())',
                          '"bypass_hardware": self.bypass_hardware.get_active()',
                          '"quality_of_life": self.quality_of_life.get_active()',
                          '"locale": self.region_locale if self.use_region.get_active() else ""',
                          '"timezone": self.region_timezone if self.use_region.get_active() else ""',
                          'capability_summary = Gtk.Label(label=self.capability_summary())',
                      ):
                          self.assertIn(marker, dialog_source)


              if __name__ == "__main__":
                  unittest.main()
          ''').lstrip()
          Path("gui/test_windows_options_dialog_i18n.py").write_text(windows_test, encoding="utf-8")

          release = Path("docs/release-0.15.0.md")
          replace_once(
              release,
              "- Presentation-only localization for drive-backup format labels and Save-dialog chrome while preserving canonical format IDs, extensions, destination paths, planning, publication, and verification.\n",
              "- Presentation-only localization for drive-backup format labels and Save-dialog chrome while preserving canonical format IDs, extensions, destination paths, planning, publication, and verification.\n- Static-shell localization for Windows Setup options while preserving capability gating, prior selections, regional values, generated answer-file semantics, and writer contracts.\n",
              "Windows options release note",
          )
          replace_once(
              release,
              "- Generated `FORMAT ...`, `WRITE FREEDOS ...`, `SAVE ...`, and `RESTORE AUTHENTICATED FFU ...` confirmation phrases, comparison logic, selected values, machine-readable JSON, command flags, paths, identities, filesystem planner values, diagnostic/report schemas, and dynamic evidence remain byte-stable and untranslated.\n",
              "- Generated `FORMAT ...`, `WRITE FREEDOS ...`, `SAVE ...`, and `RESTORE AUTHENTICATED FFU ...` confirmation phrases, comparison logic, selected values, media capability summaries/reasons, local usernames, locale/time-zone identifiers, generated answer-file values, machine-readable JSON, command flags, paths, identities, filesystem planner values, diagnostic/report schemas, and dynamic evidence remain byte-stable and untranslated.\n",
              "Windows options release safety note",
          )

          localization = Path("docs/localization.md")
          replace_once(
              localization,
              "Drive-backup format presentation translates only the visible Image format heading, labels, selector tooltip, and Save-dialog chrome. Canonical IDs (`raw`, `vhd`, `vhdx`, `iso`), extensions, selected IDs, generated filenames, destination paths, plans, reports, confirmation values, and operation evidence remain untranslated.\n",
              "Drive-backup format presentation translates only the visible Image format heading, labels, selector tooltip, and Save-dialog chrome. Canonical IDs (`raw`, `vhd`, `vhdx`, `iso`), extensions, selected IDs, generated filenames, destination paths, plans, reports, confirmation values, and operation evidence remain untranslated.\n\nWindows Setup options translate only the reviewed static dialog shell. Media generation/family/architecture/edition details, capability summaries and refusal reasons, enabled states, previous selections, the local username and placeholder, locale/time-zone identifiers, option keys, and generated `autounattend.xml` values remain untranslated.\n",
              "Windows options localization guide",
          )

          roadmap = Path("ROADMAP.md")
          replace_once(
              roadmap,
              "- Presentation-only localization for drive-backup format selection and Save-dialog chrome without changing canonical IDs or paths\n",
              "- Presentation-only localization for drive-backup format selection and Save-dialog chrome without changing canonical IDs or paths\n- Static-shell localization for Windows Setup options without changing capability gating, previous choices, or answer-file values\n",
              "Windows options roadmap note",
          )

          changelog = Path("CHANGELOG.md")
          replace_once(
              changelog,
              "- Localized drive-backup format labels and Save-dialog presentation while preserving canonical raw/VHD/VHDX/ISO identifiers, extensions, generated paths, confirmation, planning, publication, and verification byte-for-byte.\n",
              "- Localized drive-backup format labels and Save-dialog presentation while preserving canonical raw/VHD/VHDX/ISO identifiers, extensions, generated paths, confirmation, planning, publication, and verification byte-for-byte.\n- Localized the static Windows Setup options shell while preserving capability gating, previous selections, usernames, locale/time-zone identifiers, generated answer-file semantics, and writer behavior byte-for-byte.\n",
              "Windows options changelog note",
          )

          parity = Path("docs/upstream-rufus-parity.json")
          old = "A standard GNU gettext runtime, deterministic source-only POT, package closure, safe English fallback, and exact post-construction translation are implemented for the primary window plus static opening shells for guarded data-only formatting, FreeDOS creation, read-only image checksums, destructive USB qualification, read-only drive-image backup, and authenticated experimental FFU review/restore. Drive-backup format labels and Save-dialog chrome also use a presentation-only translation boundary. Canonical format IDs/extensions, generated confirmation values, comparison logic, profile IDs, trust inputs, source/destination paths, target identities, calculated digests, immutable review evidence, plans, byte/progress evidence, restore reports, machine-readable JSON, flags, publication checks, dynamic status, diagnostics, cancellation evidence, and report schemas remain byte-stable. Broader secondary-dialog and dynamic status/diagnostic migration, plural review, completed language packs, and full translation-aware accessibility review remain planned."
          new = "A standard GNU gettext runtime, deterministic source-only POT, package closure, safe English fallback, and exact post-construction translation are implemented for the primary window plus static shells for guarded data-only formatting, FreeDOS creation, read-only image checksums, destructive USB qualification, read-only drive-image backup, authenticated experimental FFU review/restore, and Windows Setup options. Drive-backup format labels and Save-dialog chrome also use a presentation-only translation boundary. Canonical format IDs/extensions, generated confirmation values, comparison logic, profile IDs, trust inputs, source/destination paths, target identities, calculated digests, immutable review evidence, plans, byte/progress evidence, restore reports, media capability summaries/reasons, prior selections, local usernames, locale/time-zone identifiers, generated answer-file values, machine-readable JSON, flags, publication checks, dynamic status, diagnostics, cancellation evidence, and report schemas remain byte-stable. Broader secondary-dialog and dynamic status/diagnostic migration, plural review, completed language packs, and full translation-aware accessibility review remain planned."
          replace_once(parity, old, new, "Windows options localization parity note")
          PY
          python3 scripts/update-pot.py
          python3 -m py_compile gui/rufusarm64_i18n.py gui/test_windows_options_dialog_i18n.py
          python3 -m unittest gui.test_windows_options_dialog_i18n gui.test_i18n gui.test_windows_qol_selection_scope
          python3 scripts/update-pot.py --check
          git rm .github/workflows/patch-windows-options-i18n-once.yml
          git add \
            CHANGELOG.md \
            ROADMAP.md \
            docs/localization.md \
            docs/release-0.15.0.md \
            docs/upstream-rufus-parity.json \
            gui/rufusarm64_i18n.py \
            gui/test_checksum_dialog_i18n.py \
            gui/test_device_qualification_i18n.py \
            gui/test_ffu_dialog_i18n.py \
            gui/test_guarded_dialog_i18n_contract.py \
            gui/test_i18n.py \
            gui/test_windows_options_dialog_i18n.py \
            po/rufusarm64.pot
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "i18n: translate the Windows Setup options shell"
          git push origin HEAD:feature/gettext-windows-options-dialog
