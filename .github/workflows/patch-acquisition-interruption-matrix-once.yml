name: Patch acquisition interruption matrix once

on:
  push:
    branches:
      - feature/acquisition-cache-interruption
  pull_request:
    branches:
      - stage4/0.15.0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/acquisition-cache-interruption
      - name: Replace the acquisition cache gap with executable rows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          matrix_path = Path("docs/interruption-qualification.json")
          matrix = json.loads(matrix_path.read_text(encoding="utf-8"))
          gaps = matrix["residual_software_gaps"]
          matched = [gap for gap in gaps if gap.get("id") == "gap-acquisition-cache-commit"]
          if len(matched) != 1:
              raise SystemExit("acquisition cache residual row changed")
          matrix["residual_software_gaps"] = [
              gap for gap in gaps if gap.get("id") != "gap-acquisition-cache-commit"
          ]
          entries = [
              {
                  "id": "acquisition-root-published-stale-catalog",
                  "boundary": "acquisition-cache-commit",
                  "component": "verified acquisition channel cache",
                  "failure_mode": "root history is durably advanced but the cached catalog and accepted state remain from the previous trust generation",
                  "phase": "post-publication",
                  "status": "automated",
                  "test_file": "internal/acquisition/channel_interruption_test.go",
                  "test_name": "TestRefreshChannelRefusesStaleCatalogAfterRootPublicationInterruption",
                  "platforms": ["linux-amd64", "linux-arm64"],
                  "invariant": "The incompatible stale catalog is refused, no cached result is returned, and accepted state remains byte-for-byte unchanged."
              },
              {
                  "id": "acquisition-catalog-published-stale-state",
                  "boundary": "acquisition-cache-commit",
                  "component": "verified acquisition channel cache",
                  "failure_mode": "a newer verified catalog is durably published while accepted state still records the previous catalog",
                  "phase": "post-publication",
                  "status": "automated",
                  "test_file": "internal/acquisition/channel_interruption_test.go",
                  "test_name": "TestRefreshChannelRecoversForwardAfterCatalogPublicationInterruption",
                  "platforms": ["linux-amd64", "linux-arm64"],
                  "invariant": "Offline refresh recovers only forward to the verified catalog, publishes matching accepted state, and never moves accepted time backwards."
              },
              {
                  "id": "acquisition-state-ahead-of-catalog",
                  "boundary": "acquisition-cache-commit",
                  "component": "verified acquisition channel cache",
                  "failure_mode": "accepted state claims a newer catalog than the durably cached catalog",
                  "phase": "post-publication",
                  "status": "automated",
                  "test_file": "internal/acquisition/channel_interruption_test.go",
                  "test_name": "TestRefreshChannelRefusesStateAheadOfCatalogAfterStatePublicationInterruption",
                  "platforms": ["linux-amd64", "linux-arm64"],
                  "invariant": "The stale cached catalog is rejected as rollback and neither the catalog nor accepted state is rewritten."
              },
              {
                  "id": "acquisition-truncated-cache-publication",
                  "boundary": "acquisition-cache-commit",
                  "component": "verified acquisition channel cache",
                  "failure_mode": "root-history or catalog cache content is truncated before a complete authenticated document is durable",
                  "phase": "post-publication",
                  "status": "automated",
                  "test_file": "internal/acquisition/channel_interruption_test.go",
                  "test_name": "TestRefreshChannelRejectsTruncatedCacheWithoutRewritingState",
                  "platforms": ["linux-amd64", "linux-arm64"],
                  "invariant": "Malformed cached trust material is refused without returning a result or rewriting the previously accepted state."
              }
          ]
          existing_ids = {entry["id"] for entry in matrix["entries"]}
          if existing_ids.intersection(entry["id"] for entry in entries):
              raise SystemExit("acquisition cache executable rows already exist")
          physical_index = next(
              (index for index, entry in enumerate(matrix["entries"]) if entry.get("status") == "physical-only"),
              len(matrix["entries"]),
          )
          matrix["entries"][physical_index:physical_index] = entries
          matrix_path.write_text(json.dumps(matrix, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          documentation = Path("docs/interruption-crash-consistency.md")
          text = documentation.read_text(encoding="utf-8")
          old = "- acquisition metadata rollback refusal and symbolic-link destination substitution.\n\nThe inventory deliberately keeps uncovered software cases visible. A missing drive-backup publication, partition/filesystem mutation, persistence materialization, acquisition-cache transaction, or helper-process cleanup case may not disappear from review merely because another component has a similar test."
          new = "- acquisition metadata rollback refusal and symbolic-link destination substitution;\n- interruption after root-history, catalog, or accepted-state cache publication, including forward-only recovery and malformed-cache refusal.\n\nThe inventory deliberately keeps uncovered software cases visible. A missing drive-backup publication, partition/filesystem mutation, persistence materialization, or helper-process cleanup case may not disappear from review merely because another component has a similar test."
          if text.count(old) != 1:
              raise SystemExit("interruption documentation acquisition gap text changed")
          documentation.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          gofmt -w internal/acquisition/channel_interruption_test.go
          go test ./internal/acquisition ./internal/qualification
          git rm .github/workflows/patch-acquisition-interruption-matrix-once.yml
          git add \
            docs/interruption-crash-consistency.md \
            docs/interruption-qualification.json \
            internal/acquisition/channel_interruption_test.go
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: qualify interrupted acquisition cache states"
          git push origin HEAD:feature/acquisition-cache-interruption
