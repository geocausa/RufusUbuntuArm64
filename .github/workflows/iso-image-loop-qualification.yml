name: ISO Image mode loop qualification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: iso-image-loop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loop-qualification:
    name: MBR/GPT FAT32, NTFS and El Torito extracted-media qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.x'
      - name: Install ISO, loop, FAT32, NTFS and verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            util-linux dosfstools ntfs-3g gdisk genisoimage mtools
      - name: Create and independently verify ISO Image mode media
        env:
          RUFUS_REAL_EXTRACTED_TEST: '1'
          RUFUS_REAL_EL_TORITO_OVERLAY_TEST: '1'
        run: |
          mkdir -p dist/audit-logs
          sudo modprobe loop || true
          go test -c -o "${RUNNER_TEMP}/iso-image-loop.test" ./internal/linuxmedia
          set -o pipefail
          sudo env RUFUS_REAL_EXTRACTED_TEST="${RUFUS_REAL_EXTRACTED_TEST}" \
            RUFUS_REAL_EL_TORITO_OVERLAY_TEST="${RUFUS_REAL_EL_TORITO_OVERLAY_TEST}" \
            "${RUNNER_TEMP}/iso-image-loop.test" \
            -test.run '^(TestCreateExtractedOnRealLoopDevice(MBR|GPT)?|TestCreateExtractedNTFSOnRealLoopDevice(MBR|GPT)|TestCreateExtractedOnRealLoopDeviceWithElToritoOverlay|TestPrepareExtractedManifestFromRealElToritoFATImage)$' \
            -test.v 2>&1 | tee dist/audit-logs/iso-image-loop.log
      - name: Upload ISO Image mode loop transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iso-image-loop-${{ github.run_id }}
          path: dist/audit-logs/iso-image-loop.log
          if-no-files-found: warn
