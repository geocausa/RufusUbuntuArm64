name: Patch translation-aware accessibility once

on:
  push:
    branches:
      - feature/translation-aware-accessibility

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/translation-aware-accessibility
      - name: Add reviewed accessibility inventory and translation coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{label} changed")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          integrated = Path("gui/rufusarm64_integrated.py")
          text = integrated.read_text(encoding="utf-8")
          constants = dedent('''

              PRIMARY_LABEL_MNEMONICS = {
                  "Boot image": ("_Boot image", "image_chooser"),
                  "USB drive": ("_USB drive", "target_combo"),
              }
              PRIMARY_BUTTON_MNEMONICS = {
                  "download_button": "_Download…",
                  "checksum_button": "C_hecksums…",
                  "start_button": "_Create USB",
                  "cancel_button": "C_ancel",
                  "uefi_validation_button": "_Validate UEFI Media…",
                  "nonbootable_button": "Restore / for_mat…",
                  "freedos_button": "_FreeDOS…",
              }
              PRIMARY_ACCELERATORS = {
                  "refresh_button": "<Primary>r",
                  "download_button": "<Primary>d",
                  "checksum_button": "<Primary>k",
                  "uefi_validation_button": "<Primary>u",
              }
              PRIMARY_ACCESSIBILITY = {
                  "image_chooser": (
                      "Boot image",
                      "Choose an ISO or disk image that RufusArm64 will inspect before writing.",
                  ),
                  "target_combo": (
                      "USB target drive",
                      "Choose the removable whole drive that will be erased only after confirmation.",
                  ),
                  "refresh_button": (
                      "Refresh USB drives",
                      "Rescan removable whole drives. Shortcut Ctrl+R.",
                  ),
                  "download_button": (
                      "Download verified image",
                      "Open signed image acquisition. Shortcut Ctrl+D.",
                  ),
                  "checksum_button": (
                      "Calculate image checksums",
                      "Calculate comparison hashes. Shortcut Ctrl+K.",
                  ),
                  "qualify_button": (
                      "Check USB capacity and blocks",
                      "Open the separate destructive USB capacity, bad-block, and fake-capacity qualification workflow.",
                  ),
                  "start_button": (
                      "Create USB",
                      "Open the final erase confirmation for the selected image and drive.",
                  ),
                  "cancel_button": (
                      "Cancel active operation",
                      "Request safe cancellation and wait for cleanup to finish.",
                  ),
                  "uefi_validation_button": (
                      "Validate UEFI media",
                      "Open read-only UEFI media validation. Shortcut Ctrl+U.",
                  ),
                  "mode_value": ("Image compatibility and write path", ""),
                  "verify": ("Verify copied data after writing", ""),
                  "progress": ("Operation progress", ""),
                  "progress_detail": ("Operation status details", ""),
                  "log": ("Technical diagnostic log", ""),
                  "nonbootable_button": ("Restore or format drive for storage", ""),
                  "freedos_button": ("Create FreeDOS media", ""),
                  "post_operation_bar": ("Post-operation actions", ""),
              }
              ABOUT_ACCESSIBILITY = (
                  "About RufusArm64",
                  "Show application and licence information. Shortcut F1.",
              )
          ''')
          anchor = "\ndef _set_accessible(widget, name, description=\"\"):\n"
          if text.count(anchor) != 1:
              raise SystemExit("accessibility helper anchor changed")
          text = text.replace(anchor, constants + anchor, 1)

          start = text.index("def install_accessibility(window_class):")
          end = text.index("\n\ndef run_rufusarm64(argv=None):", start)
          replacement = dedent('''
              def install_accessibility(window_class):
                  """Install reviewed keyboard and assistive metadata after every visual extension."""
                  if getattr(window_class, "_accessibility_installed", False):
                      return
                  original_init = window_class.__init__

                  def integrated_init(window, app):
                      original_init(window, app)
                      window._accessibility_accel_group = Gtk.AccelGroup()
                      window.add_accel_group(window._accessibility_accel_group)

                      about_button = None
                      for widget in _walk_widgets(window):
                          if isinstance(widget, Gtk.Label):
                              source = widget.get_text()
                              spec = PRIMARY_LABEL_MNEMONICS.get(source)
                              if spec is not None:
                                  mnemonic, target_attribute = spec
                                  widget.set_text(mnemonic)
                                  widget.set_use_underline(True)
                                  widget.set_mnemonic_widget(getattr(window, target_attribute))
                          if isinstance(widget, Gtk.Button) and widget.get_tooltip_text() == "About RufusArm64":
                              about_button = widget

                      for attribute, mnemonic in PRIMARY_BUTTON_MNEMONICS.items():
                          _set_button_mnemonic(getattr(window, attribute, None), mnemonic)

                      for attribute, accelerator in PRIMARY_ACCELERATORS.items():
                          _add_button_accelerator(window, getattr(window, attribute, None), accelerator)
                      _add_button_accelerator(window, about_button, "F1")

                      for attribute, (name, description) in PRIMARY_ACCESSIBILITY.items():
                          _set_accessible(getattr(window, attribute, None), name, description)
                      _set_accessible(about_button, *ABOUT_ACCESSIBILITY)

                      window.mode_value.set_selectable(True)
                      window.progress_detail.set_selectable(True)

                  window_class.__init__ = integrated_init
                  window_class._accessibility_installed = True
          ''').rstrip()
          integrated.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          i18n = Path("gui/rufusarm64_i18n.py")
          additions = (
              ('    N_("_FreeDOS…"),\n', '    N_("_FreeDOS…"),\n    N_("_Boot image"),\n    N_("_Create USB"),\n    N_("_Download…"),\n    N_("_USB drive"),\n    N_("_Validate UEFI Media…"),\n', "translated mnemonic labels"),
              ('    N_("Calculate image checksums"),\n', '    N_("Calculate image checksums"),\n    N_("Calculate comparison hashes. Shortcut Ctrl+K."),\n', "checksum accessibility description"),
              ('    N_("Cancel"),\n', '    N_("Cancel"),\n    N_("Cancel active operation"),\n', "cancel accessible name"),
              ('    N_("Post-operation actions"),\n', '    N_("Post-operation actions"),\n', "existing post-operation message"),
              ('    N_("Technical diagnostic log"),\n', '    N_("Technical diagnostic log"),\n    N_("USB target drive"),\n', "target accessible name"),
              ('    N_("Validate UEFI Media…"),\n', '    N_("Validate UEFI Media…"),\n    N_("Validate UEFI media"),\n    N_("Verify copied data after writing"),\n', "validation accessibility names"),
              ('    N_("Restore / format…"),\n', '    N_("Restore / format…"),\n    N_("Restore / for_mat…"),\n', "format mnemonic"),
          )
          for old, new, label in additions:
              if old == new:
                  continue
              replace_once(i18n, old, new, label)

          accessibility_test = dedent('''
              import ast
              import pathlib
              import unittest


              class AccessibilityStructureTests(unittest.TestCase):
                  @classmethod
                  def setUpClass(cls):
                      root = pathlib.Path(__file__).resolve().parents[1]
                      cls.integrated_source = (root / "gui" / "rufusarm64_integrated.py").read_text(encoding="utf-8")
                      cls.main_source = (root / "gui" / "rufusarm64.py").read_text(encoding="utf-8")
                      tree = ast.parse(cls.integrated_source)
                      cls.constants = {}
                      for node in tree.body:
                          if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                              name = node.targets[0].id
                              if name in {
                                  "PRIMARY_LABEL_MNEMONICS",
                                  "PRIMARY_BUTTON_MNEMONICS",
                                  "PRIMARY_ACCELERATORS",
                                  "PRIMARY_ACCESSIBILITY",
                                  "ABOUT_ACCESSIBILITY",
                              }:
                                  cls.constants[name] = ast.literal_eval(node.value)
                      installer = next(
                          node for node in tree.body
                          if isinstance(node, ast.FunctionDef) and node.name == "install_accessibility"
                      )
                      cls.installer_source = ast.get_source_segment(cls.integrated_source, installer)

                  def test_accessibility_is_installed_after_every_visual_extension(self):
                      calls = [
                          "install_drive_backup(RufusWindow)",
                          "install_nonbootable(RufusWindow)",
                          "install_freedos(RufusWindow)",
                          "install_linux_compatibility(RufusWindow)",
                          "install_verified_acquisition(RufusWindow)",
                          "install_post_operation_reuse(RufusWindow)",
                          "install_accessibility(RufusWindow)",
                      ]
                      positions = [self.integrated_source.index(call) for call in calls]
                      self.assertEqual(positions, sorted(positions))

                  def test_reviewed_inventory_is_exact_and_complete(self):
                      self.assertEqual(
                          self.constants["PRIMARY_LABEL_MNEMONICS"],
                          {
                              "Boot image": ("_Boot image", "image_chooser"),
                              "USB drive": ("_USB drive", "target_combo"),
                          },
                      )
                      self.assertEqual(
                          tuple(self.constants["PRIMARY_BUTTON_MNEMONICS"]),
                          (
                              "download_button",
                              "checksum_button",
                              "start_button",
                              "cancel_button",
                              "uefi_validation_button",
                              "nonbootable_button",
                              "freedos_button",
                          ),
                      )
                      self.assertEqual(
                          tuple(self.constants["PRIMARY_ACCESSIBILITY"]),
                          (
                              "image_chooser",
                              "target_combo",
                              "refresh_button",
                              "download_button",
                              "checksum_button",
                              "qualify_button",
                              "start_button",
                              "cancel_button",
                              "uefi_validation_button",
                              "mode_value",
                              "verify",
                              "progress",
                              "progress_detail",
                              "log",
                              "nonbootable_button",
                              "freedos_button",
                              "post_operation_bar",
                          ),
                      )

                  def test_installer_uses_only_reviewed_inventory(self):
                      for expected in (
                          "PRIMARY_LABEL_MNEMONICS.get(source)",
                          "PRIMARY_BUTTON_MNEMONICS.items()",
                          "PRIMARY_ACCELERATORS.items()",
                          "PRIMARY_ACCESSIBILITY.items()",
                          "_set_accessible(about_button, *ABOUT_ACCESSIBILITY)",
                          "widget.set_mnemonic_widget(getattr(window, target_attribute))",
                      ):
                          self.assertIn(expected, self.installer_source)

                  def test_safe_shortcuts_do_not_bypass_destructive_confirmation(self):
                      self.assertEqual(
                          self.constants["PRIMARY_ACCELERATORS"],
                          {
                              "refresh_button": "<Primary>r",
                              "download_button": "<Primary>d",
                              "checksum_button": "<Primary>k",
                              "uefi_validation_button": "<Primary>u",
                          },
                      )
                      self.assertNotIn('"start_button":', self.integrated_source.split("PRIMARY_ACCELERATORS =", 1)[1].split("}", 1)[0])
                      self.assertNotIn('"cancel_button":', self.integrated_source.split("PRIMARY_ACCELERATORS =", 1)[1].split("}", 1)[0])
                      self.assertIn("dialog.set_default_response(Gtk.ResponseType.CANCEL)", self.main_source)

                  def test_dynamic_explanations_are_keyboard_selectable(self):
                      self.assertIn("window.mode_value.set_selectable(True)", self.installer_source)
                      self.assertIn("window.progress_detail.set_selectable(True)", self.installer_source)

                  def test_accessibility_layer_has_no_privilege_or_erase_implementation(self):
                      self.assertNotIn("subprocess", self.integrated_source)
                      self.assertNotIn("pkexec", self.integrated_source.lower())
                      self.assertNotIn("--yes", self.integrated_source)
                      self.assertNotIn("--allow-fixed", self.integrated_source)
                      self.assertNotIn("--no-unmount", self.integrated_source)


              if __name__ == "__main__":
                  unittest.main()
          ''').lstrip()
          Path("gui/test_accessibility.py").write_text(accessibility_test, encoding="utf-8")

          accessibility_i18n_test = dedent('''
              from pathlib import Path
              import sys
              import tempfile
              import unittest


              GUI_DIR = Path(__file__).resolve().parent
              if str(GUI_DIR) not in sys.path:
                  sys.path.insert(0, str(GUI_DIR))

              from test_i18n import Accessible, Button, Label, Window, load_i18n_module, write_mo


              class TranslationAwareAccessibilityTests(unittest.TestCase):
                  def test_reviewed_mnemonics_names_and_descriptions_translate_together(self):
                      module, _ = load_i18n_module()
                      translations = {
                          "_Boot image": "_Image de démarrage",
                          "_USB drive": "Clé _USB",
                          "_Download…": "_Télécharger…",
                          "_Create USB": "_Créer la clé USB",
                          "C_ancel": "A_nnuler",
                          "USB target drive": "Clé USB cible",
                          "Choose the removable whole drive that will be erased only after confirmation.": "Choisissez le disque amovible entier qui ne sera effacé qu'après confirmation.",
                          "Calculate image checksums": "Calculer les sommes de contrôle",
                          "Calculate comparison hashes. Shortcut Ctrl+K.": "Calculer les empreintes de comparaison. Raccourci Ctrl+K.",
                      }
                      with tempfile.TemporaryDirectory() as directory:
                          locale_root = Path(directory)
                          write_mo(locale_root / "zz" / "LC_MESSAGES" / "rufusarm64.mo", translations)
                          translation = module.load_translation(str(locale_root), ["zz"])
                          boot = Label("_Boot image")
                          usb = Label(
                              "_USB drive",
                              accessible=Accessible(
                                  "USB target drive",
                                  "Choose the removable whole drive that will be erased only after confirmation.",
                              ),
                          )
                          download = Button("_Download…")
                          create = Button("_Create USB")
                          cancel = Button("C_ancel")
                          checksum = Button(
                              "Calculate image checksums",
                              accessible=Accessible(
                                  "Calculate image checksums",
                                  "Calculate comparison hashes. Shortcut Ctrl+K.",
                              ),
                          )
                          dynamic = Button(
                              "serial:abc",
                              accessible=Accessible("/dev/sdz", '{"outcome":"verified"}'),
                          )
                          window = Window(children=[boot, usb, download, create, cancel, checksum, dynamic])

                          self.assertFalse(module.translate_widget_tree(window, translation))
                          self.assertEqual(boot.text, translations["_Boot image"])
                          self.assertEqual(usb.text, translations["_USB drive"])
                          self.assertEqual(download.label, translations["_Download…"])
                          self.assertEqual(create.label, translations["_Create USB"])
                          self.assertEqual(cancel.label, translations["C_ancel"])
                          self.assertEqual(usb.accessible.name, translations["USB target drive"])
                          self.assertEqual(usb.accessible.description, translations["Choose the removable whole drive that will be erased only after confirmation."])
                          self.assertEqual(checksum.label, translations["Calculate image checksums"])
                          self.assertEqual(checksum.accessible.name, translations["Calculate image checksums"])
                          self.assertEqual(checksum.accessible.description, translations["Calculate comparison hashes. Shortcut Ctrl+K."])
                          self.assertEqual(dynamic.label, "serial:abc")
                          self.assertEqual(dynamic.accessible.name, "/dev/sdz")
                          self.assertEqual(dynamic.accessible.description, '{"outcome":"verified"}')

                  def test_every_primary_accessibility_string_is_admitted_to_catalog(self):
                      module, _ = load_i18n_module()
                      import ast
                      source = (GUI_DIR / "rufusarm64_integrated.py").read_text(encoding="utf-8")
                      tree = ast.parse(source)
                      values = []
                      for node in tree.body:
                          if not isinstance(node, ast.Assign) or len(node.targets) != 1 or not isinstance(node.targets[0], ast.Name):
                              continue
                          name = node.targets[0].id
                          if name not in {
                              "PRIMARY_LABEL_MNEMONICS",
                              "PRIMARY_BUTTON_MNEMONICS",
                              "PRIMARY_ACCESSIBILITY",
                              "ABOUT_ACCESSIBILITY",
                          }:
                              continue
                          value = ast.literal_eval(node.value)
                          if isinstance(value, dict):
                              for key, item in value.items():
                                  if name == "PRIMARY_LABEL_MNEMONICS":
                                      values.extend((key, item[0]))
                                  elif name == "PRIMARY_BUTTON_MNEMONICS":
                                      values.append(item)
                                  else:
                                      values.extend(part for part in item if part)
                          else:
                              values.extend(part for part in value if part)
                      missing = sorted({value for value in values if value not in module.CATALOG_MESSAGE_SET})
                      self.assertEqual(missing, [])


              if __name__ == "__main__":
                  unittest.main()
          ''').lstrip()
          Path("gui/test_accessibility_i18n.py").write_text(accessibility_i18n_test, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          replace_once(
              changelog,
              "- Localized the dedicated persistent live USB wizard's static opening shell while preserving source/target identity, selected size/label/runtime values, planning, confirmation, privileged creation, cancellation, qualification, and evidence byte-for-byte.\n",
              "- Localized the dedicated persistent live USB wizard's static opening shell while preserving source/target identity, selected size/label/runtime values, planning, confirmation, privileged creation, cancellation, qualification, and evidence byte-for-byte.\n- Completed a translation-aware primary accessibility inventory so reviewed mnemonics, assistive names, descriptions, icon-only controls, and safe shortcuts remain aligned after gettext translation.\n",
              "accessibility changelog anchor",
          )

          roadmap = Path("ROADMAP.md")
          replace_once(
              roadmap,
              "- Static opening-shell localization for the dedicated persistent live USB wizard without changing identity, selected values, confirmation, qualification, or evidence\n",
              "- Static opening-shell localization for the dedicated persistent live USB wizard without changing identity, selected values, confirmation, qualification, or evidence\n- Translation-aware primary accessibility inventory covering reviewed mnemonics, assistive metadata, icon-only controls, and safe shortcuts\n",
              "accessibility roadmap anchor",
          )

          release = Path("docs/release-0.15.0.md")
          replace_once(
              release,
              "- Static opening-shell localization for the dedicated persistent live USB wizard while preserving source/target identity, selected values, planning, confirmation, privileged creation, cancellation, qualification, and evidence.\n",
              "- Static opening-shell localization for the dedicated persistent live USB wizard while preserving source/target identity, selected values, planning, confirmation, privileged creation, cancellation, qualification, and evidence.\n- Translation-aware primary accessibility reconciliation with an exact reviewed inventory for mnemonics, assistive names/descriptions, icon-only controls, and non-destructive shortcuts.\n",
              "accessibility release anchor",
          )
          replace_once(
              release,
              "- Broader secondary-dialog and dynamic status/diagnostic catalog migration, plural review, completed language packs, and complete translation-aware accessibility review.\n",
              "- Broader secondary-dialog and dynamic status/diagnostic catalog migration, plural review, completed language packs, and secondary-dialog translation-aware accessibility expansion.\n",
              "remaining accessibility scope",
          )

          localization = Path("docs/localization.md")
          addition = dedent('''

              ## Translation-aware accessibility

              The primary window uses one exact reviewed inventory for mnemonic-bearing labels, assistive names and descriptions, icon-only controls, and safe visible shortcuts. Every static string in that inventory must be admitted to the gettext catalog, and real-catalog tests require visible text and assistive metadata to translate together. Dynamic paths, identities, confirmation values, plans, reports, diagnostics, and evidence remain outside the catalog and are never rewritten as accessibility metadata.

              The inventory does not add accelerators to destructive creation or cancellation. Existing default-Cancel confirmation dialogs, widget sensitivity, signal wiring, privilege separation, cancellation, and verification remain unchanged. Secondary-dialog expansion remains separately reviewed work.
          ''')
          text = localization.read_text(encoding="utf-8")
          if "## Translation-aware accessibility" in text:
              raise SystemExit("translation-aware accessibility section already exists")
          localization.write_text(text.rstrip() + addition + "\n", encoding="utf-8")

          parity = Path("docs/upstream-rufus-parity.json")
          old = "GTK keyboard navigation, assistive names, selectable diagnostics, resizable layout, a process-wide System/Light/Dark selector with canonical persisted settings, complete main-window option/action tooltips, and bounded gettext translation of primary plus guarded formatter/FreeDOS static interface metadata are implemented. System restores the desktop preference observed at process startup, explicit modes remain application-scoped, and deferred exact-match passes preserve workflow-specific disclosures and destructive-operation contracts. Broader dialog migration and full translation-aware accessibility review remain planned."
          new = "GTK keyboard navigation, assistive names, selectable diagnostics, resizable layout, a process-wide System/Light/Dark selector with canonical persisted settings, complete main-window option/action tooltips, bounded gettext translation, and an exact translation-aware primary accessibility inventory are implemented. Reviewed mnemonic labels, assistive names/descriptions, icon-only controls, and safe shortcuts remain aligned after translation; destructive creation and cancellation receive no direct accelerator. System restores the desktop preference observed at process startup, explicit modes remain application-scoped, and exact-match passes preserve workflow-specific disclosures and destructive-operation contracts. Broader secondary-dialog accessibility expansion remains planned."
          replace_once(parity, old, new, "accessibility parity anchor")
          PY
          python3 scripts/update-pot.py
          python3 -m py_compile \
            gui/rufusarm64_integrated.py \
            gui/rufusarm64_i18n.py \
            gui/test_accessibility.py \
            gui/test_accessibility_i18n.py
          python3 -m unittest \
            gui.test_accessibility \
            gui.test_accessibility_i18n \
            gui.test_i18n \
            gui.test_main_window_tooltips \
            gui.test_packaged_launcher
          python3 scripts/update-pot.py --check
          git rm .github/workflows/patch-translation-aware-accessibility-once.yml
          git add \
            CHANGELOG.md \
            ROADMAP.md \
            docs/localization.md \
            docs/release-0.15.0.md \
            docs/upstream-rufus-parity.json \
            gui/rufusarm64_integrated.py \
            gui/rufusarm64_i18n.py \
            gui/test_accessibility.py \
            gui/test_accessibility_i18n.py \
            po/rufusarm64.pot
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "a11y: keep reviewed metadata aligned after translation"
          git push origin HEAD:feature/translation-aware-accessibility
