name: Fix PR 416 compressed write cancellation

on:
  push:
    branches:
      - parity/rufus-4.15-regressions

permissions:
  contents: write

concurrency:
  group: fix-pr416-compressed-write-cancel
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: parity/rufus-4.15-regressions
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.x'
      - name: Bind private prepared-output writes to cancellation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/imaging/input.go')
          text = path.read_text(encoding='utf-8')
          old = 'if _, err := writeFull(writer, buffer[:n]); err != nil {'
          new = 'if _, err := writeFullContext(ctx, writer, buffer[:n]); err != nil {'
          if text.count(old) != 1:
              raise SystemExit(f'expected one prepared-output write anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          gofmt -w internal/imaging/input.go
          go test ./internal/imaging
      - name: Publish product-only correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr416-compressed-write-cancel-fix.yml
          git add internal/imaging/input.go
          git commit -m "imaging: cancel prepared-output partial writes"
          git push origin HEAD:parity/rufus-4.15-regressions
