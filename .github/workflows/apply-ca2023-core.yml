name: Apply Windows CA 2023 core

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-windows-ca2023-core
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'parity/windows-ca2023-bootloaders'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: parity/windows-ca2023-bootloaders
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
      - name: Apply and qualify the replacement core
        run: |
          python3 .github/scripts/apply-ca2023-core-fix.py
          gofmt -w internal/windowsmedia/ca2023.go internal/windowsmedia/ca2023_test.go
          go test ./internal/windowsmedia
      - name: Publish one atomic core commit
        run: |
          paths=(internal/windowsmedia/ca2023.go internal/windowsmedia/ca2023_test.go)
          if git diff --quiet -- "${paths[@]}"; then
            echo "CA 2023 core is already formatted and qualified."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "windowsmedia: qualify CA 2023 replacement core"
          git push origin HEAD:parity/windows-ca2023-bootloaders
