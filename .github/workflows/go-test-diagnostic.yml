name: Temporary Go test diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.x'
      - name: Capture complete Go test output
        id: test
        shell: bash
        run: |
          set +e
          go test ./... > go-test.log 2>&1
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Go test diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-test-diagnostic-${{ github.run_id }}
          path: go-test.log
          if-no-files-found: error
      - name: Preserve failing conclusion
        if: steps.test.outputs.status != '0'
        run: exit 1
