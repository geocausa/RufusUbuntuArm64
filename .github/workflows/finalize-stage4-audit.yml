name: Finalize Stage 4 parity wording

on:
  push:
    branches:
      - feature/ext2-ext3-data-format

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[stage4-audit-finalized]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: feature/ext2-ext3-data-format
          fetch-depth: 0
          persist-credentials: true
      - name: Remove obsolete Stage 3 wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/upstream-rufus-parity.json')
          text = path.read_text(encoding='utf-8')
          old = '"in_progress": "Implementation is active on Stage 3 but is not yet an enabled end-to-end product path."'
          new = '"in_progress": "Implementation is active on the current development branch but is not yet an enabled end-to-end product path."'
          if text.count(old) != 1:
              raise SystemExit('obsolete in-progress definition was not found exactly once')
          text = text.replace(old, new, 1)
          old = 'Explicitly deferred as a later maybe. It is not on the Stage 3 critical path and requires Linux-native deployment, BCD/offline-registry work, and extensive physical qualification.'
          new = 'Explicitly deferred as a later maybe. It is not on the current critical path and requires Linux-native deployment, BCD/offline-registry work, and extensive physical qualification.'
          if text.count(old) != 1:
              raise SystemExit('obsolete Windows To Go wording was not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/finalize-stage4-audit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/upstream-rufus-parity.json .github/workflows/finalize-stage4-audit.yml
          git commit -m "docs: finalize Stage 4 parity wording [stage4-audit-finalized]"
          git push origin HEAD:feature/ext2-ext3-data-format
