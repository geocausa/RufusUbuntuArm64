name: Patch guarded dialog localization once

on:
  push:
    branches:
      - feature/gettext-guarded-dialogs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/gettext-guarded-dialogs
      - name: Extend exact-match gettext coverage to guarded dialogs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          i18n = Path("gui/rufusarm64_i18n.py")
          text = i18n.read_text(encoding="utf-8")
          catalog_anchor = '    N_("_Validate UEFI Media…"),\n)'
          catalog_lines = '''    N_("_Validate UEFI Media…"),
              N_("Cancel creation"),
              N_("Cancel formatting"),
              N_("Calculating the exact data-only plan without administrator access…"),
              N_("Calculating the exact FreeDOS plan without administrator access…"),
              N_("Calculating the unprivileged formatting plan…"),
              N_("Calculating the unprivileged FreeDOS plan…"),
              N_("Checking identity, capacity, sector size, layout, filesystem tools, and safety warnings…"),
              N_("Checking target identity, capacity, 512-byte sectors, FAT32 geometry, pinned payload, and platform warnings…"),
              N_("Close"),
              N_("Create non-bootable media"),
              N_("Everything on the selected drive will be permanently erased. Cancelling after erasure may leave intentionally incomplete media that must be formatted again before use."),
              N_("Everything on the selected drive will be permanently erased. The resulting media runs only on x86-compatible computers using BIOS or UEFI Legacy/CSM. It will not boot ARM64 or UEFI-only systems. Software verification cannot prove that a physical PC will boot it."),
              N_("Format data-only media"),
              N_("FreeDOS 1.4 — x86 BIOS/Legacy media"),
              N_("No formatting report is available yet."),
              N_("No FreeDOS report is available yet."),
              N_("Non bootable — data-only media"),
              N_("Not started"),
              N_("Optional"),
              N_("Preparing a read-only plan…"),
              N_("The exact FORMAT phrase appears after the read-only plan is validated."),
              N_("The exact WRITE FREEDOS phrase appears after the read-only plan is validated."),
              N_("This separate workflow erases the complete selected removable drive and constructs one deterministic FAT32 FreeDOS volume from checksum-pinned package payloads."),
              N_("This separate workflow erases the complete selected removable drive, creates one data partition, checks the new filesystem, and explicitly does not claim the result is bootable."),
              N_("Type the exact FORMAT phrase"),
              N_("Type the exact WRITE FREEDOS phrase"),
          )'''
          if text.count(catalog_anchor) != 1:
              raise SystemExit("catalog insertion point changed")
          text = text.replace(catalog_anchor, catalog_lines, 1)

          markup_anchor = '''MARKUP_TEMPLATES = {
              "Create a bootable USB drive": "<span size='large' weight='bold'>{}</span>",
          }'''
          markup_replacement = '''MARKUP_TEMPLATES = {
              "Create a bootable USB drive": "<span size='large' weight='bold'>{}</span>",
              "FreeDOS 1.4 — x86 BIOS/Legacy media": "<span size='large' weight='bold'>{}</span>",
              "Non bootable — data-only media": "<span size='large' weight='bold'>{}</span>",
          }'''
          if text.count(markup_anchor) != 1:
              raise SystemExit("markup template block changed")
          text = text.replace(markup_anchor, markup_replacement, 1)

          old_widget = '''def _translate_widget(widget, translation):
              changed = 0
              if isinstance(widget, Gtk.HeaderBar):
                  for getter_name, setter_name in (("get_title", "set_title"), ("get_subtitle", "set_subtitle")):
                      source = getattr(widget, getter_name)()
                      if not source:
                          continue
                      translated = _translated(str(source), translation)
                      if translated != source:
                          getattr(widget, setter_name)(translated)
                          changed += 1
              elif isinstance(widget, Gtk.Label):
                  source = widget.get_text()
                  translated = _translated(str(source or ""), translation)
                  if translated != source:
                      template = MARKUP_TEMPLATES.get(source) if widget.get_use_markup() else None
                      if template:
                          widget.set_markup(template.format(GLib.markup_escape_text(translated)))
                      else:
                          widget.set_text(translated)
                      changed += 1
              elif isinstance(widget, (Gtk.Button, Gtk.CheckButton, Gtk.Expander)):
                  source = widget.get_label()
                  if source:
                      translated = _translated(str(source), translation)
                      if translated != source:
                          widget.set_label(translated)
                          changed += 1

              if hasattr(widget, "get_tooltip_text") and hasattr(widget, "set_tooltip_text"):
                  source = widget.get_tooltip_text()
                  translated = _translated_tooltip(source, translation)
                  if translated != source:
                      widget.set_tooltip_text(translated)
                      changed += 1
              return changed + _translate_accessible(widget, translation)
          '''
          new_widget = '''def _translate_widget(widget, translation):
              changed = 0
              if isinstance(widget, Gtk.Window):
                  source = widget.get_title()
                  if source:
                      translated = _translated(str(source), translation)
                      if translated != source:
                          widget.set_title(translated)
                          changed += 1
              elif isinstance(widget, Gtk.HeaderBar):
                  for getter_name, setter_name in (("get_title", "set_title"), ("get_subtitle", "set_subtitle")):
                      source = getattr(widget, getter_name)()
                      if not source:
                          continue
                      translated = _translated(str(source), translation)
                      if translated != source:
                          getattr(widget, setter_name)(translated)
                          changed += 1
              elif isinstance(widget, Gtk.Label):
                  source = widget.get_text()
                  translated = _translated(str(source or ""), translation)
                  if translated != source:
                      template = MARKUP_TEMPLATES.get(source) if widget.get_use_markup() else None
                      if template:
                          widget.set_markup(template.format(GLib.markup_escape_text(translated)))
                      else:
                          widget.set_text(translated)
                      changed += 1
              elif isinstance(widget, (Gtk.Button, Gtk.CheckButton, Gtk.Expander)):
                  source = widget.get_label()
                  if source:
                      translated = _translated(str(source), translation)
                      if translated != source:
                          widget.set_label(translated)
                          changed += 1
              elif isinstance(widget, Gtk.Entry):
                  source = widget.get_placeholder_text()
                  if source:
                      translated = _translated(str(source), translation)
                      if translated != source:
                          widget.set_placeholder_text(translated)
                          changed += 1
              elif isinstance(widget, Gtk.ProgressBar):
                  source = widget.get_text()
                  if source:
                      translated = _translated(str(source), translation)
                      if translated != source:
                          widget.set_text(translated)
                          changed += 1
              elif isinstance(widget, Gtk.TextView):
                  buffer = widget.get_buffer()
                  start, end = buffer.get_bounds()
                  source = buffer.get_text(start, end, True)
                  if source:
                      translated = _translated(str(source), translation)
                      if translated != source:
                          buffer.set_text(translated)
                          changed += 1

              if hasattr(widget, "get_tooltip_text") and hasattr(widget, "set_tooltip_text"):
                  source = widget.get_tooltip_text()
                  translated = _translated_tooltip(source, translation)
                  if translated != source:
                      widget.set_tooltip_text(translated)
                      changed += 1
              return changed + _translate_accessible(widget, translation)
          '''
          if text.count(old_widget) != 1:
              raise SystemExit("widget translation block changed")
          text = text.replace(old_widget, new_widget, 1)

          old_apply = '''def apply_primary_ui_translation(window, translation=None):
              """Translate exact reviewed static strings after the composed window exists."""
              selected = translation or _translation
              changed = 0
              for widget in _walk_widgets(window):
                  changed += _translate_widget(widget, selected)
              window._rufusarm64_translation = selected
              window._rufusarm64_translated_fields = changed
              return False
          '''
          new_apply = '''def translate_widget_tree(widget, translation=None):
              """Translate one exact reviewed GTK widget tree and return from an idle callback."""
              selected = translation or _translation
              changed = 0
              for child in _walk_widgets(widget):
                  changed += _translate_widget(child, selected)
              widget._rufusarm64_translation = selected
              widget._rufusarm64_translated_fields = changed
              return False


          def apply_primary_ui_translation(window, translation=None):
              """Translate exact reviewed static strings after the composed window exists."""
              return translate_widget_tree(window, translation)
          '''
          if text.count(old_apply) != 1:
              raise SystemExit("primary translation block changed")
          i18n.write_text(text.replace(old_apply, new_apply, 1), encoding="utf-8")

          for filename in ("gui/rufusarm64_nonbootable_dialog.py", "gui/rufusarm64_freedos_dialog.py"):
              path = Path(filename)
              source = path.read_text(encoding="utf-8")
              import_anchor = "from gi.repository import GLib, Gtk\n"
              import_replacement = import_anchor + "\nfrom rufusarm64_i18n import translate_widget_tree\n"
              if source.count(import_anchor) != 1 or "from rufusarm64_i18n import translate_widget_tree" in source:
                  raise SystemExit(f"dialog import insertion point changed: {filename}")
              source = source.replace(import_anchor, import_replacement, 1)
              callback_anchor = "        self.show_all()\n        self.refresh_plan()\n"
              callback_replacement = callback_anchor + "        GLib.idle_add(translate_widget_tree, self)\n"
              if source.count(callback_anchor) != 1:
                  raise SystemExit(f"dialog callback insertion point changed: {filename}")
              path.write_text(source.replace(callback_anchor, callback_replacement, 1), encoding="utf-8")

          tests = Path("gui/test_i18n.py")
          source = tests.read_text(encoding="utf-8")
          class_anchor = '''class HeaderBar(Container):
          '''
          added_classes = '''class Window(Container):
              def __init__(self, title=None, children=None, **kwargs):
                  super().__init__(children=children, **kwargs)
                  self.title = title

              def get_title(self):
                  return self.title

              def set_title(self, value):
                  self.title = value


          class Entry(Widget):
              def __init__(self, placeholder=None, **kwargs):
                  super().__init__(**kwargs)
                  self.placeholder = placeholder

              def get_placeholder_text(self):
                  return self.placeholder

              def set_placeholder_text(self, value):
                  self.placeholder = value


          class ProgressBar(Widget):
              def __init__(self, text=None, **kwargs):
                  super().__init__(**kwargs)
                  self.text = text

              def get_text(self):
                  return self.text

              def set_text(self, value):
                  self.text = value


          class TextBuffer:
              def __init__(self, text=""):
                  self.text = text

              def get_bounds(self):
                  return 0, len(self.text)

              def get_text(self, _start, _end, _include_hidden):
                  return self.text

              def set_text(self, value):
                  self.text = value


          class TextView(Widget):
              def __init__(self, text="", **kwargs):
                  super().__init__(**kwargs)
                  self.buffer = TextBuffer(text)

              def get_buffer(self):
                  return self.buffer


          class HeaderBar(Container):
          '''
          if source.count(class_anchor) != 1:
              raise SystemExit("test class insertion point changed")
          source = source.replace(class_anchor, added_classes, 1)

          gtk_anchor = '''        Container=Container,
              HeaderBar=HeaderBar,
              Label=Label,
              Button=Button,
              CheckButton=CheckButton,
              Expander=Expander,
          '''
          gtk_replacement = '''        Container=Container,
              Window=Window,
              HeaderBar=HeaderBar,
              Label=Label,
              Button=Button,
              CheckButton=CheckButton,
              Expander=Expander,
              Entry=Entry,
              ProgressBar=ProgressBar,
              TextView=TextView,
          '''
          if source.count(gtk_anchor) != 1:
              raise SystemExit("fake GTK mapping changed")
          source = source.replace(gtk_anchor, gtk_replacement, 1)

          method_anchor = '''    def test_installer_is_idempotent_and_defers_until_composed_construction(self):
          '''
          method = '''    def test_guarded_dialog_widget_types_translate_static_state_and_preserve_confirmation_data(self):
              module, _ = load_i18n_module()
              translations = {
                  "Create non-bootable media": "Créer un support non amorçable",
                  "Non bootable — data-only media": "Non amorçable — données uniquement",
                  "Optional": "Facultatif",
                  "Not started": "Non démarré",
                  "No formatting report is available yet.": "Aucun rapport de formatage n'est encore disponible.",
              }
              with tempfile.TemporaryDirectory() as directory:
                  locale_root = Path(directory)
                  write_mo(locale_root / "zz" / "LC_MESSAGES" / "rufusarm64.mo", translations)
                  translation = module.load_translation(str(locale_root), ["zz"])

                  heading = Label("Non bootable — data-only media", use_markup=True)
                  placeholder = Entry("Optional")
                  progress = ProgressBar("Not started")
                  report = TextView("No formatting report is available yet.")
                  exact_phrase = Label("FORMAT /dev/sdz GPT ext4")
                  absent = Container([Entry(None), ProgressBar(None), TextView("")])
                  dialog = Window(
                      title="Create non-bootable media",
                      children=[heading, placeholder, progress, report, exact_phrase, absent],
                  )

                  self.assertFalse(module.translate_widget_tree(dialog, translation))
                  self.assertEqual(dialog.title, translations["Create non-bootable media"])
                  self.assertEqual(heading.text, translations["Non bootable — data-only media"])
                  self.assertEqual(
                      heading.markup,
                      "<span size='large' weight='bold'>Non amorçable — données uniquement</span>",
                  )
                  self.assertEqual(placeholder.placeholder, "Facultatif")
                  self.assertEqual(progress.text, "Non démarré")
                  self.assertEqual(report.buffer.text, "Aucun rapport de formatage n'est encore disponible.")
                  self.assertEqual(exact_phrase.text, "FORMAT /dev/sdz GPT ext4")
                  self.assertIs(dialog._rufusarm64_translation, translation)
                  self.assertGreaterEqual(dialog._rufusarm64_translated_fields, 5)

              self.assertIsNone(absent.children[0].placeholder)
              self.assertIsNone(absent.children[1].text)
              self.assertEqual(absent.children[2].buffer.text, "")

          
              def test_installer_is_idempotent_and_defers_until_composed_construction(self):
          '''
          if source.count(method_anchor) != 1:
              raise SystemExit("test method insertion point changed")
          source = source.replace(method_anchor, method, 1)

          template_anchor = '''        self.assertIn('msgid "Keyboard: {shortcut}"', text)
          '''
          template_replacement = template_anchor + '''        self.assertIn('msgid "Create non-bootable media"', text)
              self.assertIn('msgid "FreeDOS 1.4 — x86 BIOS/Legacy media"', text)
          '''
          if source.count(template_anchor) != 1:
              raise SystemExit("POT assertions insertion point changed")
          tests.write_text(source.replace(template_anchor, template_replacement, 1), encoding="utf-8")
          PY
          python3 scripts/update-pot.py
          python3 -m py_compile gui/rufusarm64_i18n.py gui/test_i18n.py gui/rufusarm64_nonbootable_dialog.py gui/rufusarm64_freedos_dialog.py
          git rm .github/workflows/patch-guarded-dialog-i18n-once.yml
          git add gui/rufusarm64_i18n.py gui/test_i18n.py gui/rufusarm64_nonbootable_dialog.py gui/rufusarm64_freedos_dialog.py po/rufusarm64.pot
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "i18n: translate guarded formatter dialog shells"
          git push origin HEAD:feature/gettext-guarded-dialogs
