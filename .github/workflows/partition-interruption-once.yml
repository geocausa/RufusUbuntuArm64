name: Apply partition and filesystem interruption qualification once

on:
  pull_request:
    branches:
      - stage4/0.15.0

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/partition-filesystem-interruption
      - name: Preserve the executor's close-failure phase contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/partition-interruption-once.py')
          text = path.read_text(encoding='utf-8')
          old = '{"close", &memoryExecutionBackend{closeErr: errors.New("close failed")}, true, ExecutionPhaseComplete},'
          new = '{"close", &memoryExecutionBackend{closeErr: errors.New("close failed")}, true, ExecutionPhaseFinish},'
          if text.count(old) != 1:
              raise SystemExit('FreeDOS close-phase fixture changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply, qualify, commit, and remove the one-shot
        shell: bash
        run: |
          set -o pipefail
          python3 .github/partition-interruption-once.py > /tmp/partition-interruption.log 2>&1
      - name: Upload focused qualification log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: partition-interruption-log-${{ github.run_id }}
          path: /tmp/partition-interruption.log
          if-no-files-found: error
          retention-days: 7
