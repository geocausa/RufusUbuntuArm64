name: Apply ISO layout options tranche

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'parity/iso-layout-options'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out trusted applicator
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Check out feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: work
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go formatter
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.x'
          cache: false

      - name: Validate bounded patch targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import stat

          root = Path("work").resolve()
          paths = (
              "internal/linuxmedia/extracted.go",
              "internal/linuxmedia/extracted_layout_options.go",
              "internal/linuxmedia/extracted_layout_options_test.go",
              "internal/linuxmedia/extracted_loop_test.go",
              "internal/linuxmedia/extracted_gpt_loop_test.go",
              "cmd/rufus-persistence-helper/main.go",
              "gui/rufusarm64_iso_write_mode.py",
              "gui/test_iso_layout_options.py",
              ".github/workflows/iso-image-loop-qualification.yml",
              "docs/iso-image-mode.md",
              "docs/upstream-rufus-parity.json",
              "docs/iso-layout-options-plan.md",
              "CHANGELOG.md",
          )
          for relative in paths:
              target = root / relative
              current = root
              for component in Path(relative).parts[:-1]:
                  current = current / component
                  if current.is_symlink() or not current.is_dir():
                      raise SystemExit(f"unsafe patch parent: {current}")
              if target.exists() or target.is_symlink():
                  metadata = target.lstat()
                  if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISREG(metadata.st_mode):
                      raise SystemExit(f"unsafe patch target: {target}")
              if root not in target.resolve(strict=False).parents:
                  raise SystemExit(f"patch target escapes checkout: {target}")
          PY

      - name: Apply reviewed patch
        run: |
          python3 trusted/.github/scripts/apply_iso_layout_options.py work
          python3 trusted/.github/scripts/finish_iso_layout_options.py work
          gofmt -w \
            work/internal/linuxmedia/extracted.go \
            work/internal/linuxmedia/extracted_layout_options.go \
            work/internal/linuxmedia/extracted_layout_options_test.go \
            work/internal/linuxmedia/extracted_loop_test.go \
            work/internal/linuxmedia/extracted_gpt_loop_test.go \
            work/cmd/rufus-persistence-helper/main.go
          python3 -m py_compile \
            work/gui/rufusarm64_iso_write_mode.py \
            work/gui/test_iso_layout_options.py

      - name: Commit feature changes
        working-directory: work
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No patch changes remain.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'iso: add reviewed MBR/GPT layout options'
          git push origin "HEAD:${HEAD_REF}"
