name: Patch checksum localization tests once

on:
  push:
    branches:
      - feature/gettext-checksum-dialog

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/gettext-checksum-dialog
      - name: Update secondary-dialog installer regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("gui/test_i18n.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  "    def test_guarded_dialog_installer_wraps_only_loaded_classes_and_is_idempotent(self):\n",
                  "    def test_secondary_dialog_installer_wraps_only_loaded_classes_and_is_idempotent(self):\n",
              ),
              (
                  '        names = ("rufusarm64_nonbootable_dialog", "rufusarm64_freedos_dialog")\n',
                  '        names = ("rufusarm64_checksums", "rufusarm64_nonbootable_dialog", "rufusarm64_freedos_dialog")\n',
              ),
              (
                  "            for module_name, class_name in module.GUARDED_DIALOG_CLASSES:\n",
                  "            for module_name, class_name in module.SECONDARY_DIALOG_CLASSES:\n",
              ),
              (
                  "            module.install_guarded_dialog_localization()\n            module.install_guarded_dialog_localization()\n",
                  "            module.install_secondary_dialog_localization()\n            module.install_secondary_dialog_localization()\n",
              ),
              (
                  '            self.assertEqual([dialog.marker for dialog in dialogs], ["dialog-0", "dialog-1"])\n',
                  '            self.assertEqual([dialog.marker for dialog in dialogs], ["dialog-0", "dialog-1", "dialog-2"])\n',
              ),
              (
                  '        self.assertIn(\'msgid "Create non-bootable media"\', text)\n',
                  '        self.assertIn(\'msgid "Image checksums"\', text)\n        self.assertIn(\'msgid "Create non-bootable media"\', text)\n',
              ),
          )
          for source, replacement in replacements:
              if text.count(source) != 1:
                  raise SystemExit(f"secondary-dialog test anchor changed: {source!r}")
              text = text.replace(source, replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python3 -m py_compile gui/test_i18n.py
          git rm .github/workflows/patch-checksum-tests-once.yml
          git add gui/test_i18n.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: extend secondary-dialog installer coverage"
          git push origin HEAD:feature/gettext-checksum-dialog
