name: Repair PR 302 Staticcheck fixture

on:
  push:
    branches:
      - feature/ffu-authenticode-chain-policy

permissions:
  contents: write

concurrency:
  group: repair-pr302-staticcheck
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: feature/ffu-authenticode-chain-policy
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
      - name: Replace literal nil with typed nil context
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("internal/ffu/catalog_chain_linux_test.go")
          data = path.read_text()
          old = "\tif _, _, _, _, _, err := BuildCatalogCertificateChain(nil, bytes.NewReader(fixture.data), uint64(len(fixture.data)), fixture.activation, catalogChainEvaluationTime); err == nil || !strings.Contains(err.Error(), \"context is nil\") {"
          new = "\tvar nilContext context.Context\n\tif _, _, _, _, _, err := BuildCatalogCertificateChain(nilContext, bytes.NewReader(fixture.data), uint64(len(fixture.data)), fixture.activation, catalogChainEvaluationTime); err == nil || !strings.Contains(err.Error(), \"context is nil\") {"
          if data.count(old) != 1:
              raise SystemExit("expected exactly one nil-context fixture")
          path.write_text(data.replace(old, new))
          PY
          gofmt -w internal/ffu/catalog_chain_linux_test.go
      - name: Verify focused package and audit
        run: |
          set -euo pipefail
          go test -count=1 ./internal/ffu
          go vet ./internal/ffu
          audit_bin="${RUNNER_TEMP}/audit-tools"
          mkdir -p "${audit_bin}"
          GOBIN="${audit_bin}" go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          "${audit_bin}/staticcheck" ./internal/ffu
      - name: Commit only the correction and remove this workflow
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr302-staticcheck.yml
          git diff --check
          git add internal/ffu/catalog_chain_linux_test.go .github/workflows/repair-pr302-staticcheck.yml
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' .github/workflows/repair-pr302-staticcheck.yml internal/ffu/catalog_chain_linux_test.go | sort)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Fix nil-context Staticcheck fixture"
          git push origin HEAD:feature/ffu-authenticode-chain-policy
