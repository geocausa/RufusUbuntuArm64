name: Run translation-aware accessibility patch v3 once

on:
  pull_request:
    branches:
      - stage4/0.15.0

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/translation-aware-accessibility
      - name: Execute corrected reviewed one-shot patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/patch-translation-aware-accessibility-once.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == 'run: |')
          block = []
          for line in lines[start + 1:]:
              if not line:
                  block.append('')
              elif line.startswith('          '):
                  block.append(line[10:])
              else:
                  raise SystemExit(f'unexpected line outside run block: {line!r}')
          script = '\n'.join(block) + '\n'
          old = "('    N_(\"_FreeDOS…\"),\\n', '    N_(\"_FreeDOS…\"),\\n"
          new = "('    N_(\"FreeDOS…\"),\\n', '    N_(\"FreeDOS…\"),\\n    N_(\"_FreeDOS…\"),\\n"
          if script.count(old) != 1:
              raise SystemExit('FreeDOS catalog patch tuple changed')
          script = script.replace(old, new, 1)
          old = "('    N_(\"Post-operation actions\"),\\n', '    N_(\"Post-operation actions\"),\\n', \"existing post-operation message\"),"
          new = "('    N_(\"Operation status details\"),\\n', '    N_(\"Operation status details\"),\\n    N_(\"Post-operation actions\"),\\n', \"post-operation accessibility name\"),"
          if script.count(old) != 1:
              raise SystemExit('post-operation catalog patch tuple changed')
          script = script.replace(old, new, 1)
          Path('/tmp/accessibility-patch.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/accessibility-patch.sh
          git rm --ignore-unmatch \
            .github/workflows/run-translation-aware-accessibility-v2-once.yml \
            .github/workflows/run-translation-aware-accessibility-v3-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "ci: remove corrected accessibility patch triggers"
          git push origin HEAD:feature/translation-aware-accessibility
