name: Validate FFU target sector geometry discovery

on:
  push:
    branches: [feature/ffu-device-sector-geometry]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.22.x'
          cache: true
      - name: Apply geometry patch and format
        run: |
          python3 scripts/patch-ffu-device-geometry.py
          gofmt -w internal/device/device.go internal/device/device_test.go
      - name: Test affected packages
        run: go test -count=1 ./internal/device ./internal/safety ./internal/ffu ./cmd/rufus-linux
      - name: Vet affected packages
        run: go vet ./internal/device ./internal/safety ./internal/ffu ./cmd/rufus-linux
      - name: Race affected packages
        run: go test -race -count=1 ./internal/device ./internal/safety ./internal/ffu ./cmd/rufus-linux
      - name: Staticcheck affected packages
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          "$(go env GOPATH)/bin/staticcheck" ./internal/device ./internal/safety ./internal/ffu ./cmd/rufus-linux
      - name: Cross-compile ARM64 packages
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go test -c ./internal/device -o /tmp/device-arm64.test
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go test -c ./internal/ffu -o /tmp/ffu-arm64.test
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/rufusarm64-cli ./cmd/rufus-linux
      - name: Publish clean product tree
        env:
          BRANCH: feature/ffu-device-sector-geometry
        run: |
          git rm .github/workflows/check-ffu-device-geometry.yml scripts/patch-ffu-device-geometry.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/device/device.go internal/device/device_test.go .github/workflows/ffu-loop-qualification.yml
          git commit -m "FFU: expose target sector geometry in device discovery"
          git push origin "HEAD:${BRANCH}"
