name: Prepare RufusArm64 0.15.0 candidate contract

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-rufusarm64-0.15.0-candidate
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'geocausa/RufusUbuntuArm64' &&
      github.event.pull_request.head.ref == 'release/0.15.0-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_PRODUCT_COMMIT: 78850300e2681f015b0ae90c10356094fc5daeca
      RELEASE_VERSION: 0.15.0
      RELEASE_DATE: 2026-07-28
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply synchronized candidate metadata exactly once
        run: |
          set -euo pipefail
          test "$(git merge-base origin/main HEAD)" = "${EXPECTED_PRODUCT_COMMIT}"
          if test "$(tr -d '\r\n' < VERSION)" = "${RELEASE_VERSION}"; then
            echo "0.15.0 candidate metadata already applied."
            exit 0
          fi
          test "$(tr -d '\r\n' < VERSION)" = '0.14.0'

          printf '%s\n' "${RELEASE_VERSION}" > VERSION

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          release_date = os.environ["RELEASE_DATE"]
          product_commit = os.environ["EXPECTED_PRODUCT_COMMIT"]
          root = Path('.')

          changelog = root / 'CHANGELOG.md'
          text = changelog.read_text(encoding='utf-8')
          marker = '# Changelog\n\n'
          section = f'''## {version} — {release_date}

- Added a Rufus-style **ISO Image mode / DD Image mode** choice for suitable Linux ISOHybrid images, with ISO Image mode selected as the recommended default and the existing byte-for-byte DD path retained as an explicit alternative.
- Added a bounded Linux-native ISO extraction writer that creates conventional writable MBR/FAT32 UEFI media, binds exact source and target identities, inventories and hashes the complete accepted media tree before erasure, verifies the architecture fallback loader, copies transactionally, reads every file back by SHA-256, checks FAT32, and flushes the device.
- Added conservative refusal for media that cannot be represented safely in the reviewed ISO mode scope, including missing native UEFI fallback loaders, FAT32-incompatible paths or file sizes, case collisions, escaping links, insufficient capacity, unsupported geometry, and changed source or target identities.
- Hardened target acquisition with bounded cancellable retry for short-lived device-manager lock contention while preserving fail-closed exclusive locking.
- Added real privileged qualification that writes a synthetic ARM64 ISO through the production MBR/FAT32 backend, detaches and reopens the completed image, probes FAT32 independently, mounts it read-only, and compares copied files.
- Kept physical ARM64 firmware boot, Secure Boot, broad distribution compatibility, FFU hardware restoration, and universal device compatibility explicitly outside software-only claims pending the 0.15.0 prerelease checklist.

'''
          if f'## {version} —' not in text:
              if not text.startswith(marker):
                  raise SystemExit('unexpected CHANGELOG header')
              changelog.write_text(marker + section + text[len(marker):], encoding='utf-8')

          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          replacements = {
              '**Version 0.14.0** is the Stage 3 advanced imaging and recovery release candidate.':
                  '**Version 0.15.0** is the ISO Image mode parity and physical-qualification release candidate.',
              'sha256sum -c rufusarm64_0.14.0_arm64.deb.sha256':
                  'sha256sum -c rufusarm64_0.15.0_arm64.deb.sha256',
              'sudo apt install ./rufusarm64_0.14.0_arm64.deb':
                  'sudo apt install ./rufusarm64_0.15.0_arm64.deb',
              'docs/hardware-checklist-0.14.0.md': 'docs/hardware-checklist-0.15.0.md',
              'dist/rufusarm64_0.14.0_arm64.deb': 'dist/rufusarm64_0.15.0_arm64.deb',
              'docs/release-0.14.0.md': 'docs/release-0.15.0.md',
              'sudo apt install --allow-downgrades ./rufusarm64_0.13.0_arm64.deb':
                  'sudo apt install --allow-downgrades ./rufusarm64_0.14.0_arm64.deb',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'README marker missing: {old}')
              text = text.replace(old, new)
          highlight = '- Direct writing of recognized Linux ISOHybrid images and GPT/MBR raw disk images.\n'
          iso_highlight = '- A Rufus-style **ISO Image mode / DD Image mode** choice for suitable Linux ISOHybrid images, with conventional writable FAT32 extraction recommended by default and exact cloning retained as the alternative.\n'
          if iso_highlight not in text:
              text = text.replace(highlight, highlight + iso_highlight)
          anchor = 'This structural report does not prove that a physical computer will boot the media.\n\n'
          iso_section = '''## ISO Image mode and DD Image mode

For suitable Linux ISOHybrid images, RufusArm64 presents an explicit choice before destructive authorization:

- **Write in ISO Image mode (Recommended)** creates one conventional writable FAT32 partition and extracts the accepted ISO filesystem tree.
- **Write in DD Image mode** retains the existing exact byte-for-byte image writer, including the source image's embedded partition and boot structures.

ISO Image mode is offered only after bounded compatibility analysis confirms a native architecture fallback UEFI loader, FAT32-safe paths and file sizes, sufficient target capacity, and the reviewed source and target identities. The privileged helper repeats those checks before erasure, copies every admitted file transactionally, hashes every file back from the USB, checks FAT32, and flushes the device. Unsupported images remain on the DD path; RufusArm64 never silently converts an ISO-mode refusal into a destructive DD write.

Ordinary ISO Image mode does not enable persistence or modify boot configuration. Software and loop-device verification do not prove that every physical computer will boot the result; that is recorded separately in the 0.15.0 hardware checklist.

'''
          if '## ISO Image mode and DD Image mode\n' not in text:
              if anchor not in text:
                  raise SystemExit('README ISO section anchor missing')
              text = text.replace(anchor, anchor + iso_section)
          readme.write_text(text, encoding='utf-8')

          roadmap = root / 'ROADMAP.md'
          text = roadmap.read_text(encoding='utf-8')
          section = '''## 0.15 — ISO Image mode parity and qualification (completed)

- Rufus-style ISO Image mode versus DD Image mode choice for suitable Linux ISOHybrid media
- ISO Image mode selected as the recommended default, with explicit exact-clone DD fallback
- Identity-bound MBR/FAT32 extraction, native UEFI fallback validation, complete manifest and copied-file verification, FAT32 checking, and device flushing
- Bounded cancellable target-lock retry and real detach/reopen loop-device qualification of the production writer
- Release-candidate package and focused physical Surface Pro 11 ARM64 boot checklist; stable promotion remains gated on recorded hardware evidence

'''
          if '## 0.15 —' not in text:
              marker = '## 1.0 — supportable stable release\n'
              if marker not in text:
                  raise SystemExit('ROADMAP 1.0 marker missing')
              text = text.replace(marker, section + marker)
          roadmap.write_text(text, encoding='utf-8')

          meta = root / 'packaging/io.github.geocausa.RufusArm64.metainfo.xml'
          text = meta.read_text(encoding='utf-8')
          release = f'''    <release version="{version}" date="{release_date}">
      <description>
        <p>Adds Rufus-style ISO Image mode with recommended-by-default FAT32 extraction, retained DD fallback, identity-bound complete file verification, hardened target locking, and real reopened-device qualification.</p>
      </description>
    </release>
'''
          if f'<release version="{version}"' not in text:
              marker = '  <releases>\n'
              if marker not in text:
                  raise SystemExit('AppStream releases marker missing')
              text = text.replace(marker, marker + release, 1)
          meta.write_text(text, encoding='utf-8')

          for name in (
              'rufusarm64.1',
              'rufusarm64-cli.1',
              'rufusarm64-persistence.1',
              'rufusarm64-device-qualify.1',
              'rufusarm64-device-backup.1',
              'rufusarm64-freedos-format.1',
              'rufusarm64-nonbootable-format.1',
          ):
              path = root / 'docs' / name
              lines = path.read_text(encoding='utf-8').splitlines()
              if not lines or '"RufusArm64 0.14.0"' not in lines[0]:
                  raise SystemExit(f'unexpected man-page header: {name}')
              lines[0] = re.sub(r'"[0-9]{1,2} [A-Za-z]+ 2026"', '"28 July 2026"', lines[0])
              lines[0] = lines[0].replace('"RufusArm64 0.14.0"', f'"RufusArm64 {version}"')
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          parity_path = root / 'docs/upstream-rufus-parity.json'
          parity = json.loads(parity_path.read_text(encoding='utf-8'))
          parity['generated_on'] = release_date
          parity['project']['baseline'] = 'main'
          parity['project']['baseline_commit'] = product_commit
          if not any(item.get('id') == 'linux-iso-image-mode' for item in parity['features']):
              entry = {
                  'id': 'linux-iso-image-mode',
                  'upstream_feature': 'Choose ISO Image mode or DD Image mode for ISOHybrid media',
                  'status': 'implemented',
                  'notes': 'Suitable Linux ISOHybrid media receive an explicit Rufus-style choice with ISO Image mode recommended by default and DD retained as the exact-clone alternative. ISO mode uses identity-bound MBR/FAT32 extraction, native fallback UEFI validation, bounded complete-tree inspection, transactional copy, SHA-256 readback, filesystem checking, flushing, cancellable locking, and real reopened-loop qualification. Physical firmware boot remains release-qualification evidence.',
                  'upstream_sources': ['src/format.c', 'src/iso.c'],
              }
              parity['features'].insert(1, entry)
          parity_path.write_text(json.dumps(parity, indent=2) + '\n', encoding='utf-8')
          PY

          cat > docs/release-0.15.0.md <<'EOF'
          # RufusArm64 0.15.0

          ## Highlights

          RufusArm64 0.15.0 is the ISO Image mode parity and physical-qualification release candidate for Ubuntu ARM64.

          - Suitable Linux ISOHybrid images now present a Rufus-style **ISO Image mode / DD Image mode** choice.
          - **ISO Image mode (Recommended)** is selected by default when the image and target pass the bounded compatibility analysis.
          - ISO Image mode creates conventional writable MBR/FAT32 UEFI media rather than cloning the source image's fixed partition layout.
          - The existing DD writer remains available as the explicit byte-for-byte alternative and stays automatic for images outside the reviewed extraction scope.
          - The privileged creator repeats source, target, UEFI, FAT32, path, file-size, collision, capacity, and geometry checks before erasure; then it copies transactionally, reads every file back by SHA-256, checks FAT32, and flushes the target.
          - Target locking tolerates only short-lived expected contention through a bounded cancellable retry and continues to fail closed on sustained or unexpected contention.
          - A dedicated privileged qualification writes through the production backend, detaches and reopens the completed image, probes FAT32 independently, mounts it read-only, and compares copied content.

          Existing DD writing, Windows media creation, persistent Linux media, data-only formatting, FreeDOS, USB qualification, drive backup, checksums, UEFI analysis, and the experimental FFU boundary remain available.

          ## Prerelease purpose and physical testing

          Physical hardware testing remains required before 0.15.0 is promoted from prerelease to stable. The candidate checklist is `docs/hardware-checklist-0.15.0.md`.

          The central physical observation is an Ubuntu ARM64 ISOHybrid written with ISO Image mode on the intended Surface Pro 11 ARM64 host. The record must show the choice dialog, ISO mode selected by default, successful creation and verification, actual UEFI boot, and ordinary writable FAT32 behavior. A bounded DD-mode regression should also be recorded where practical.

          Software, CI, and loop-device passes do not establish universal physical boot, firmware, controller, flash-health, Secure Boot, distribution, or vendor compatibility.

          ## ISO Image mode boundary

          ISO Image mode currently accepts a plain raw-bootable Linux ISOHybrid image whose complete accepted tree can be represented by one FAT32 partition and which contains the architecture fallback UEFI loader, such as `EFI/BOOT/BOOTAA64.EFI` on ARM64.

          It refuses unsupported or unsafe sources before target mutation, including missing fallback loaders, compressed or virtual-disk input, optical-only media, FAT32-incompatible paths, case-insensitive collisions, files at or above FAT32's single-file boundary, escaping or cyclic links, unsupported sector geometry, insufficient target capacity, source mutation, target substitution, and protected/system disks.

          An ISO-mode refusal is not proof that an image is corrupt. DD Image mode remains the exact-clone alternative. RufusArm64 does not silently start DD writing after an ISO-mode refusal; the user must explicitly choose and confirm the alternative.

          Ordinary ISO Image mode does not patch boot configuration or enable persistence. Persistent media remains a separate explicit workflow.

          ## Safety and support boundaries

          Every media-creation path can destroy all accessible data on the selected target. Confirm the exact device path, model, capacity, source identity, target identity, chosen write mode, and generated confirmation before authentication.

          The package-owned ARM64 `uefi-md5sum` loader remains unsigned. **Secure Boot compatibility is not established** for that optional persistent-media wrapper. ISO Image mode itself does not claim Secure Boot acceptance merely because a fallback loader is structurally present.

          The production built-in acquisition channel remains disabled until reviewed public mirrors, offline root-key operations, and a signed catalogue are provisioned. FFU restoration remains experimental and narrowly scoped; FFU capture is not implemented. Windows To Go remains deferred.

          ## Verification and release construction

          The exact candidate must pass Go 1.22 compatibility, unit/race/shuffle coverage, vet, static and vulnerability checks, native ARM64 execution, packaged-binary execution, the dedicated ISO Image mode reopened-loop qualification, existing privileged loop regressions, Lintian/AppStream/desktop validation, WIM/UEFI reproduction, and byte-for-byte Debian package reproducibility.

          The canonical stable workflow will publish:

          - `rufusarm64_0.15.0_arm64.deb`;
          - `rufusarm64_0.15.0_arm64.deb.sha256`;
          - the corresponding deterministic source and required corresponding-source archives.

          A separate explicitly marked prerelease uses Debian version `0.15.0~rc1`, which sorts before stable `0.15.0`.

          ## Install and rollback

          Verify the package checksum:

          ```bash
          sha256sum -c rufusarm64_0.15.0_arm64.deb.sha256
          ```

          Install or upgrade:

          ```bash
          sudo apt install ./rufusarm64_0.15.0_arm64.deb
          ```

          To roll back to 0.14.0, keep its package and run:

          ```bash
          sudo apt install --allow-downgrades ./rufusarm64_0.14.0_arm64.deb
          ```

          Rollback does not repair USB or block devices already modified by a newer release.
          EOF
          sed -i 's/^          //' docs/release-0.15.0.md

          cat > docs/hardware-checklist-0.15.0.md <<'EOF'
          # RufusArm64 0.15.0 hardware and prerelease checklist

          This record gates promotion of the 0.15.0 candidate. Software and loop-device evidence are necessary but do not replace the physical ARM64 observations below.

          ## Candidate identity

          - Candidate commit: to be recorded after the release-contract PR is merged.
          - Prerelease tag: to be recorded after publication.
          - Debian package filename and SHA-256: to be recorded after publication.
          - Source archive SHA-256 and publication workflow: to be recorded after publication.
          - Tester, date, host, kernel, firmware, Secure Boot state, source-image identity, USB model/path/capacity: to be recorded for every physical run.

          ## Installation and desktop smoke

          - [ ] Verify the downloaded SHA-256 sidecar independently.
          - [ ] Install or upgrade `rufusarm64_0.15.0~rc1_arm64.deb` on an ARM64 machine.
          - [ ] Confirm package, CLI, helper, and graphical About versions are `0.15.0~rc1`.
          - [ ] Launch the composed graphical application and confirm the ordinary writer and existing specialist entry points still open.

          ## ISO Image mode choice

          Use a disposable or fully backed-up removable USB and a known Linux ARM64 ISOHybrid image.

          - [ ] Select a compatible ISOHybrid image and confirm a visible **ISO Image mode / DD Image mode** choice appears.
          - [ ] Confirm **ISO Image mode (Recommended)** is selected by default.
          - [ ] Confirm **DD Image mode** remains selectable and is described as the exact byte-for-byte alternative.
          - [ ] Cancel the choice dialog and confirm no target mutation occurs.
          - [ ] Confirm an unsupported image does not receive a misleading ISO-mode offer or silent destructive fallback.

          ## ISO Image mode creation and physical boot

          - [ ] Create the USB in ISO Image mode and record the exact source and target identities shown before authentication.
          - [ ] Confirm the operation reports complete copied-file verification, FAT32 checking, synchronization, and success.
          - [ ] Independently inspect the completed USB: one active MBR FAT32-LBA partition, expected label, native `EFI/BOOT/BOOTAA64.EFI`, and representative files matching the source.
          - [ ] Confirm the FAT32 filesystem is conventionally writable by creating, reading, hashing, deleting, and synchronizing a harmless test file.
          - [ ] Boot the Surface Pro 11 from the USB and record the first visible Ubuntu boot/live-session evidence.
          - [ ] Confirm ordinary live boot works without claiming persistence; ISO Image mode does not create a persistence partition.
          - [ ] Record any firmware, Secure Boot, driver, display, input, networking, storage, or shutdown limitation separately from the media-write result.

          ## DD regression and refusal behavior

          - [ ] Where practical, write the same image in DD Image mode to disposable media and confirm the existing direct-write behavior remains available and bootable on the bounded test host.
          - [ ] Confirm source or target change invalidates the reviewed destructive plan.
          - [ ] Confirm sustained target-lock contention fails before mutation; short-lived contention may retry only within the bounded cancellable window.
          - [ ] Confirm cancellation before erasure leaves the target unchanged and cancellation/failure after erasure is never reported as success.
          - [ ] Confirm system/root disks, protected mounts, partitions, read-only targets, and normal fixed disks remain refused or absent from selection.

          ## Existing workflow regression

          - [ ] Confirm at least one previously qualified ordinary function still works after upgrade, such as checksums, data-only formatting, persistence entry, drive backup, FreeDOS entry, or Check USB.
          - [ ] Keep the 0.14.0 qualification evidence bounded to its exact candidate; do not relabel it as 0.15.0 evidence.
          - [ ] Physical FFU restoration remains untested unless authentic supported FFU material and suitable disposable hardware become available.

          ## GO / NO-GO

          - [ ] Every exercised observation is recorded with exact hardware, media, candidate, image, tester, date, result, and evidence.
          - [ ] Every unexercised item is marked **UNTESTED**, not passed.
          - [ ] Blocking defects are fixed on a new candidate and affected observations are repeated.
          - [ ] A bounded GO/NO-GO decision is recorded for this exact candidate without universal firmware, Secure Boot, distribution, controller, flash-health, or FFU claims.

          Until this record is complete, 0.15.0 remains a prerelease candidate rather than a stable hardware-qualified release.
          EOF
          sed -i 's/^          //' docs/hardware-checklist-0.15.0.md

          rm -f .github/workflows/prepare-0.15.0-candidate.yml
          python3 scripts/check-version-sync.py
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Release: prepare the RufusArm64 0.15.0 candidate contract'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
