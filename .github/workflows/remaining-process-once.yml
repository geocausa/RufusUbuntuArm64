name: Apply remaining helper process migration once

on:
  pull_request:
    branches:
      - stage4/0.15.0

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/remaining-helper-process-workers
      - name: Preserve generated code and refresh exact source contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/remaining-process-once.py')
          text = path.read_text(encoding='utf-8')
          count = text.count("'''    def")
          if count < 10:
              raise SystemExit(f'generated method anchors changed: {count}')
          text = text.replace("'''    def", "r'''    def")
          marker = '# Remove bootstrap files before focused/full qualification.'
          if text.count(marker) != 1:
              raise SystemExit('bootstrap qualification marker changed')
          text = text.replace(marker, 'run("python3", ".github/remaining-test-contracts.py")\n\n' + marker, 1)
          old_rm = 'run("git", "rm", "-f", "--ignore-unmatch", ".github/remaining-process-once.py", ".github/workflows/remaining-process-once.yml")'
          new_rm = 'run("git", "rm", "-f", "--ignore-unmatch", ".github/remaining-process-once.py", ".github/remaining-test-contracts.py", ".github/workflows/remaining-process-once.yml")'
          if text.count(old_rm) != 1:
              raise SystemExit('bootstrap removal command changed')
          path.write_text(text.replace(old_rm, new_rm, 1), encoding='utf-8')
          PY
      - name: Apply, qualify, commit, and remove the one-shot
        shell: bash
        run: |
          set -o pipefail
          python3 .github/remaining-process-once.py > /tmp/remaining-process.log 2>&1
      - name: Upload focused qualification log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remaining-process-log-${{ github.run_id }}
          path: /tmp/remaining-process.log
          if-no-files-found: error
          retention-days: 7
