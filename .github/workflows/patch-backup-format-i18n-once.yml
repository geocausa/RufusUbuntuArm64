name: Patch backup format localization once

on:
  pull_request:
    branches:
      - stage4/0.15.0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/gettext-backup-format-presentation
      - name: Add presentation-only backup format localization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{label} changed")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          i18n = Path("gui/rufusarm64_i18n.py")
          additions = (
              ('    N_("Download verified image"),\n', '    N_("Download verified image"),\n    N_("Dynamic VHD (.vhd)"),\n    N_("Dynamic VHDX (.vhdx)"),\n', "dynamic backup labels"),
              ('    N_("FAT32"),\n', '    N_("FAT32"),\n    N_("Filesystem ISO/UDF (.iso)"),\n', "ISO backup label"),
              ('    N_("Image checksums"),\n', '    N_("Image checksums"),\n    N_("Image format"),\n', "image format heading"),
              ('    N_("Quick format"),\n', '    N_("Quick format"),\n    N_("Raw image (.img)"),\n    N_("Raw is byte-for-byte. VHD and VHDX are dynamic sparse containers verified against the held source."),\n', "raw backup presentation"),
              ('    N_("Choose a new .img path"),\n', '    N_("Choose a new .img path"),\n    N_("Choose a new Dynamic VHD (.vhd) file"),\n    N_("Choose a new Dynamic VHDX (.vhdx) file"),\n    N_("Choose a new Filesystem ISO/UDF (.iso) file"),\n    N_("Choose a new Raw image (.img) file"),\n', "backup chooser titles"),
          )
          for old, new, label in additions:
              replace_once(i18n, old, new, label)

          formats = Path("gui/rufusarm64_drive_backup_formats.py")
          replace_once(
              formats,
              'from gi.repository import GLib, Gtk\n\nimport rufusarm64_device_qualify_dialog as backup_dialog\n',
              'from gi.repository import GLib, Gtk\n\nfrom rufusarm64_i18n import gettext as _\nimport rufusarm64_device_qualify_dialog as backup_dialog\n',
              "backup format gettext import",
          )
          replace_once(
              formats,
              '_FORMAT_EXTENSIONS = {"raw": ".img", "vhd": ".vhd", "vhdx": ".vhdx"}\n_SOURCE_PHASES = {"capture", "hash_source", "convert"}\n',
              '_FORMAT_EXTENSIONS = {"raw": ".img", "vhd": ".vhd", "vhdx": ".vhdx"}\n_FORMAT_CHOOSER_TITLES = {\n    "raw": "Choose a new Raw image (.img) file",\n    "vhd": "Choose a new Dynamic VHD (.vhd) file",\n    "vhdx": "Choose a new Dynamic VHDX (.vhdx) file",\n    "iso": "Choose a new Filesystem ISO/UDF (.iso) file",\n}\n_SOURCE_PHASES = {"capture", "hash_source", "convert"}\n\n\ndef _format_presentation_label(format_name):\n    """Translate only the reviewed display label; canonical format IDs remain unchanged."""\n    source = _FORMAT_LABELS.get(str(format_name or ""), "")\n    return _(source) if source else source\n\n\ndef _format_chooser_title(format_name):\n    """Return one exact translated Save-dialog title without formatting an operation value."""\n    source = _FORMAT_CHOOSER_TITLES.get(str(format_name or ""), "")\n    return _(source) if source else source\n',
              "backup presentation helpers",
          )
          replace_once(
              formats,
              '        row.pack_start(Gtk.Label(label="Image format"), False, False, 0)\n        dialog.format_selector = Gtk.ComboBoxText()\n        for format_name, label in _FORMAT_LABELS.items():\n            dialog.format_selector.append(format_name, label)\n',
              '        row.pack_start(Gtk.Label(label=_("Image format")), False, False, 0)\n        dialog.format_selector = Gtk.ComboBoxText()\n        for format_name in _FORMAT_LABELS:\n            dialog.format_selector.append(format_name, _format_presentation_label(format_name))\n',
              "translated format selector",
          )
          replace_once(
              formats,
              '        dialog.format_selector.set_tooltip_text(\n            "Raw is byte-for-byte. VHD and VHDX are dynamic sparse containers verified against the held source."\n        )\n',
              '        dialog.format_selector.set_tooltip_text(\n            _("Raw is byte-for-byte. VHD and VHDX are dynamic sparse containers verified against the held source.")\n        )\n',
              "translated format tooltip",
          )
          replace_once(
              formats,
              '        chooser = Gtk.FileChooserDialog(\n            title=f"Choose a new {_FORMAT_LABELS[format_name]} file",\n',
              '        chooser = Gtk.FileChooserDialog(\n            title=_format_chooser_title(format_name),\n',
              "translated chooser title",
          )
          replace_once(
              formats,
              '        chooser.add_buttons("Cancel", Gtk.ResponseType.CANCEL, "Choose", Gtk.ResponseType.OK)\n',
              '        chooser.add_buttons(_("Cancel"), Gtk.ResponseType.CANCEL, _("Choose"), Gtk.ResponseType.OK)\n',
              "translated chooser buttons",
          )
          replace_once(
              formats,
              '        image_filter.set_name(_FORMAT_LABELS[format_name])\n',
              '        image_filter.set_name(_format_presentation_label(format_name))\n',
              "translated chooser filter",
          )

          test_source = dedent('''
              import importlib.util
              from pathlib import Path
              import sys
              import tempfile
              import types
              import unittest


              GUI_DIR = Path(__file__).resolve().parent
              if str(GUI_DIR) not in sys.path:
                  sys.path.insert(0, str(GUI_DIR))

              from test_i18n import load_i18n_module, write_mo


              FORMAT_SOURCE = GUI_DIR / "rufusarm64_drive_backup_formats.py"
              ISO_SOURCE = GUI_DIR / "rufusarm64_drive_backup_iso.py"


              def load_format_module(i18n):
                  names = (
                      "gi",
                      "gi.repository",
                      "rufusarm64_i18n",
                      "rufusarm64_device_qualify_dialog",
                      "rufusarm64_device_qualify",
                  )
                  saved = {name: sys.modules.get(name) for name in names}
                  fake_gi = types.ModuleType("gi")
                  repository = types.ModuleType("gi.repository")
                  repository.GLib = types.SimpleNamespace()
                  repository.Gtk = types.SimpleNamespace()
                  backup_dialog = types.ModuleType("rufusarm64_device_qualify_dialog")
                  backup_dialog.DriveImageBackupDialog = type("DriveImageBackupDialog", (), {})
                  qualify = types.ModuleType("rufusarm64_device_qualify")
                  for name in (
                      "backup_build_dry_run_command",
                      "backup_build_run_command",
                      "backup_confirmation_phrase",
                      "backup_decode_progress_line",
                      "backup_normalize_plan",
                      "backup_normalize_report",
                      "backup_progress_summary",
                  ):
                      setattr(qualify, name, lambda *args, **kwargs: None)
                  sys.modules["gi"] = fake_gi
                  sys.modules["gi.repository"] = repository
                  sys.modules["rufusarm64_i18n"] = i18n
                  sys.modules["rufusarm64_device_qualify_dialog"] = backup_dialog
                  sys.modules["rufusarm64_device_qualify"] = qualify
                  try:
                      spec = importlib.util.spec_from_file_location("rufusarm64_backup_format_i18n_test", FORMAT_SOURCE)
                      module = importlib.util.module_from_spec(spec)
                      spec.loader.exec_module(module)
                      return module
                  finally:
                      for name, previous in saved.items():
                          if previous is None:
                              sys.modules.pop(name, None)
                          else:
                              sys.modules[name] = previous


              class BackupFormatLocalizationTests(unittest.TestCase):
                  def test_real_catalog_translates_only_presentation_and_preserves_canonical_ids(self):
                      i18n, _ = load_i18n_module()
                      translations = {
                          "Image format": "Format d'image",
                          "Raw image (.img)": "Image brute (.img)",
                          "Dynamic VHD (.vhd)": "VHD dynamique (.vhd)",
                          "Dynamic VHDX (.vhdx)": "VHDX dynamique (.vhdx)",
                          "Filesystem ISO/UDF (.iso)": "Système de fichiers ISO/UDF (.iso)",
                          "Choose a new Raw image (.img) file": "Choisir un nouveau fichier d'image brute (.img)",
                          "Choose a new Dynamic VHD (.vhd) file": "Choisir un nouveau fichier VHD dynamique (.vhd)",
                          "Choose a new Dynamic VHDX (.vhdx) file": "Choisir un nouveau fichier VHDX dynamique (.vhdx)",
                          "Choose a new Filesystem ISO/UDF (.iso) file": "Choisir un nouveau fichier ISO/UDF (.iso)",
                      }
                      with tempfile.TemporaryDirectory() as directory:
                          locale_root = Path(directory)
                          write_mo(locale_root / "zz" / "LC_MESSAGES" / "rufusarm64.mo", translations)
                          i18n.configure_translation(str(locale_root), ["zz"])
                          module = load_format_module(i18n)
                          module._FORMAT_LABELS["iso"] = "Filesystem ISO/UDF (.iso)"
                          module._FORMAT_EXTENSIONS["iso"] = ".iso"

                          self.assertEqual(tuple(module._FORMAT_LABELS), ("raw", "vhd", "vhdx", "iso"))
                          self.assertEqual(module._FORMAT_EXTENSIONS, {"raw": ".img", "vhd": ".vhd", "vhdx": ".vhdx", "iso": ".iso"})
                          self.assertEqual(module._format_presentation_label("raw"), translations["Raw image (.img)"])
                          self.assertEqual(module._format_presentation_label("vhd"), translations["Dynamic VHD (.vhd)"])
                          self.assertEqual(module._format_presentation_label("vhdx"), translations["Dynamic VHDX (.vhdx)"])
                          self.assertEqual(module._format_presentation_label("iso"), translations["Filesystem ISO/UDF (.iso)"])
                          for format_name in ("raw", "vhd", "vhdx", "iso"):
                              source_title = module._FORMAT_CHOOSER_TITLES[format_name]
                              self.assertEqual(module._format_chooser_title(format_name), translations[source_title])
                          self.assertEqual(module._format_presentation_label("unknown"), "")
                          self.assertEqual(module._format_chooser_title("unknown"), "")

                  def test_source_uses_ids_for_behavior_and_translations_only_for_presentation(self):
                      text = FORMAT_SOURCE.read_text(encoding="utf-8")
                      iso = ISO_SOURCE.read_text(encoding="utf-8")
                      for marker in (
                          'value = str(dialog.format_selector.get_active_id() or "raw")',
                          'dialog.format_selector.append(format_name, _format_presentation_label(format_name))',
                          'title=_format_chooser_title(format_name)',
                          'image_filter.set_name(_format_presentation_label(format_name))',
                          'extension = _FORMAT_EXTENSIONS[format_name]',
                          'if not filename.lower().endswith(extension)',
                          'filename += extension',
                          'payload["destination"]["format"] != format_name',
                          'dialog.plan["destination"]["format"] != format_name',
                      ):
                          self.assertIn(marker, text)
                      self.assertIn('formats._FORMAT_LABELS["iso"] = "Filesystem ISO/UDF (.iso)"', iso)
                      self.assertIn('formats._FORMAT_EXTENSIONS["iso"] = ".iso"', iso)
                      self.assertNotIn('append(_format_presentation_label(format_name),', text)
                      self.assertNotIn('get_active_text()', text)


              if __name__ == "__main__":
                  unittest.main()
          ''').lstrip()
          Path("gui/test_drive_backup_format_i18n.py").write_text(test_source, encoding="utf-8")

          structure = Path("gui/test_device_backup_dialog.py")
          replace_once(
              structure,
              '        self.assertIn("dialog.format_selector = Gtk.ComboBoxText()", self.format_source)\n',
              '        self.assertIn("dialog.format_selector = Gtk.ComboBoxText()", self.format_source)\n        self.assertIn("dialog.format_selector.append(format_name, _format_presentation_label(format_name))", self.format_source)\n        self.assertIn("title=_format_chooser_title(format_name)", self.format_source)\n        self.assertIn("image_filter.set_name(_format_presentation_label(format_name))", self.format_source)\n',
              "backup structure presentation assertions",
          )

          release = Path("docs/release-0.15.0.md")
          replace_once(
              release,
              "- Static opening-state localization for authenticated experimental FFU review/restore while preserving trust inputs, source/target binding, exact confirmation, evidence, cancellation, and verification.\n",
              "- Static opening-state localization for authenticated experimental FFU review/restore while preserving trust inputs, source/target binding, exact confirmation, evidence, cancellation, and verification.\n- Presentation-only localization for drive-backup format labels and Save-dialog chrome while preserving canonical format IDs, extensions, destination paths, planning, publication, and verification.\n",
              "backup format release note",
          )

          localization = Path("docs/localization.md")
          replace_once(
              localization,
              "The authenticated experimental FFU dialog is limited to its static opening shell. Warning markup, image/target summary, trust and policy paths, file-chooser text, generated `RESTORE AUTHENTICATED FFU ...` confirmation, exact comparison, immutable review evidence, restore reports, diagnostics, dynamic status, cancellation evidence, and final safety messages remain untranslated.\n",
              "The authenticated experimental FFU dialog is limited to its static opening shell. Warning markup, image/target summary, trust and policy paths, file-chooser text, generated `RESTORE AUTHENTICATED FFU ...` confirmation, exact comparison, immutable review evidence, restore reports, diagnostics, dynamic status, cancellation evidence, and final safety messages remain untranslated.\n\nDrive-backup format presentation translates only the visible Image format heading, labels, selector tooltip, and Save-dialog chrome. Canonical IDs (`raw`, `vhd`, `vhdx`, `iso`), extensions, selected IDs, generated filenames, destination paths, plans, reports, confirmation values, and operation evidence remain untranslated.\n",
              "backup format localization guide",
          )

          roadmap = Path("ROADMAP.md")
          replace_once(
              roadmap,
              "- Static opening-state localization for authenticated experimental FFU review/restore without changing trust, target, evidence, or verification\n",
              "- Static opening-state localization for authenticated experimental FFU review/restore without changing trust, target, evidence, or verification\n- Presentation-only localization for drive-backup format selection and Save-dialog chrome without changing canonical IDs or paths\n",
              "backup format roadmap note",
          )

          changelog = Path("CHANGELOG.md")
          replace_once(
              changelog,
              "- Extended exact static localization to authenticated experimental FFU review/restore while preserving trust inputs, source/target identity, generated restore confirmation, immutable evidence, privileged execution, cancellation, and complete verification byte-for-byte.\n",
              "- Extended exact static localization to authenticated experimental FFU review/restore while preserving trust inputs, source/target identity, generated restore confirmation, immutable evidence, privileged execution, cancellation, and complete verification byte-for-byte.\n- Localized drive-backup format labels and Save-dialog presentation while preserving canonical raw/VHD/VHDX/ISO identifiers, extensions, generated paths, confirmation, planning, publication, and verification byte-for-byte.\n",
              "backup format changelog note",
          )

          parity = Path("docs/upstream-rufus-parity.json")
          old = "A standard GNU gettext runtime, deterministic source-only POT, package closure, safe English fallback, and exact post-construction translation are implemented for the primary window plus static opening shells for guarded data-only formatting, FreeDOS creation, read-only image checksums, destructive USB qualification, read-only drive-image backup, and authenticated experimental FFU review/restore. Generated confirmation values, comparison logic, profile IDs, trust inputs, source/destination paths, target identities, calculated digests, immutable review evidence, plans, byte/progress evidence, restore reports, machine-readable JSON, flags, publication checks, dynamic status, diagnostics, cancellation evidence, and report schemas remain byte-stable. Broader secondary-dialog and dynamic status/diagnostic migration, plural review, completed language packs, and full translation-aware accessibility review remain planned."
          new = "A standard GNU gettext runtime, deterministic source-only POT, package closure, safe English fallback, and exact post-construction translation are implemented for the primary window plus static opening shells for guarded data-only formatting, FreeDOS creation, read-only image checksums, destructive USB qualification, read-only drive-image backup, and authenticated experimental FFU review/restore. Drive-backup format labels and Save-dialog chrome also use a presentation-only translation boundary. Canonical format IDs/extensions, generated confirmation values, comparison logic, profile IDs, trust inputs, source/destination paths, target identities, calculated digests, immutable review evidence, plans, byte/progress evidence, restore reports, machine-readable JSON, flags, publication checks, dynamic status, diagnostics, cancellation evidence, and report schemas remain byte-stable. Broader secondary-dialog and dynamic status/diagnostic migration, plural review, completed language packs, and full translation-aware accessibility review remain planned."
          replace_once(parity, old, new, "backup format parity note")
          PY
          python3 scripts/update-pot.py
          python3 -m py_compile gui/rufusarm64_i18n.py gui/rufusarm64_drive_backup_formats.py gui/test_drive_backup_format_i18n.py
          python3 -m unittest gui.test_drive_backup_format_i18n gui.test_device_backup_dialog
          python3 scripts/update-pot.py --check
          git rm .github/workflows/patch-backup-format-i18n-once.yml
          git add \
            CHANGELOG.md \
            ROADMAP.md \
            docs/localization.md \
            docs/release-0.15.0.md \
            docs/upstream-rufus-parity.json \
            gui/rufusarm64_drive_backup_formats.py \
            gui/rufusarm64_i18n.py \
            gui/test_device_backup_dialog.py \
            gui/test_drive_backup_format_i18n.py \
            po/rufusarm64.pot
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "i18n: localize drive-backup format presentation"
          git push origin HEAD:feature/gettext-backup-format-presentation
