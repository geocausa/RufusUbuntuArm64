name: Apply corrected Windows options localization once

on:
  pull_request:
    branches:
      - stage4/0.15.0

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/gettext-windows-options-dialog
      - name: Apply embedded patch with corrected escaped-markup expectation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/patch-windows-options-i18n-once.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 - <<'PY'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          program = textwrap.dedent('\n'.join(lines[start + 1:end]))
          old = "<span size='large' weight='bold'>Personnaliser l'installation de Windows</span>"
          new = "<span size='large' weight='bold'>Personnaliser l&#x27;installation de Windows</span>"
          if program.count(old) != 1:
              raise SystemExit('embedded Windows heading expectation changed')
          program = program.replace(old, new, 1)
          exec(compile(program, str(workflow), 'exec'), {'__name__': '__main__'})
          PY
          python3 scripts/update-pot.py
          python3 -m py_compile gui/rufusarm64_i18n.py gui/test_windows_options_dialog_i18n.py
          python3 -m unittest gui.test_windows_options_dialog_i18n gui.test_i18n gui.test_windows_qol_selection_scope
          python3 scripts/update-pot.py --check
          git rm --ignore-unmatch \
            .github/workflows/apply-windows-options-i18n-fixed-once.yml \
            .github/workflows/patch-windows-options-i18n-once.yml \
            .github/workflows/fix-windows-options-i18n-expectation-once.yml \
            .github/workflows/diagnose-windows-options-i18n-once.yml \
            .github/workflows/diagnose-windows-options-tests-once.yml \
            docs/windows-options-i18n-diagnostic.txt \
            docs/windows-options-i18n-test-diagnostic.txt
          git add \
            CHANGELOG.md \
            ROADMAP.md \
            docs/localization.md \
            docs/release-0.15.0.md \
            docs/upstream-rufus-parity.json \
            gui/rufusarm64_i18n.py \
            gui/test_checksum_dialog_i18n.py \
            gui/test_device_qualification_i18n.py \
            gui/test_ffu_dialog_i18n.py \
            gui/test_guarded_dialog_i18n_contract.py \
            gui/test_i18n.py \
            gui/test_windows_options_dialog_i18n.py \
            po/rufusarm64.pot
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "i18n: translate the Windows Setup options shell"
          git push origin HEAD:feature/gettext-windows-options-dialog
