name: Patch persistence materialization matrix once

on:
  push:
    branches:
      - feature/persistence-materialization-failures
  pull_request:
    branches:
      - stage4/0.15.0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/persistence-materialization-failures
      - name: Replace persistence materialization gap with executable rows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          matrix_path = Path("docs/interruption-qualification.json")
          matrix = json.loads(matrix_path.read_text(encoding="utf-8"))
          gaps = matrix["residual_software_gaps"]
          matched = [gap for gap in gaps if gap.get("id") == "gap-persistence-materialization"]
          if len(matched) != 1:
              raise SystemExit("persistence materialization residual row changed")
          matrix["residual_software_gaps"] = [
              gap for gap in gaps if gap.get("id") != "gap-persistence-materialization"
          ]
          entries = [
              {
                  "id": "persistence-mbr-write-sync-failure",
                  "boundary": "persistence-materialization",
                  "component": "MBR persistence partition materialization",
                  "failure_mode": "the MBR metadata write is partial or the post-write synchronization fails",
                  "phase": "post-mutation",
                  "status": "automated",
                  "test_file": "internal/persistence/materialize_mbr_failure_test.go",
                  "test_name": "TestApplyMBRPartitionPlanFailureStates",
                  "platforms": ["linux-amd64", "linux-arm64"],
                  "invariant": "Failure is returned, the protective boot signature remains intact, and partial or fully written metadata stays inspectable rather than being reported as successful materialization."
              },
              {
                  "id": "persistence-gpt-prewrite-entropy-failure",
                  "boundary": "persistence-materialization",
                  "component": "GPT persistence partition materialization",
                  "failure_mode": "unique partition GUID entropy fails before the first metadata write",
                  "phase": "pre-mutation",
                  "status": "automated",
                  "test_file": "internal/persistence/materialize_gpt_failure_test.go",
                  "test_name": "TestApplyGPTPartitionPlanEntropyFailureLeavesMetadataUnchanged",
                  "platforms": ["linux-amd64", "linux-arm64"],
                  "invariant": "No write or synchronization occurs and the complete primary and original backup metadata ranges remain byte-for-byte unchanged."
              },
              {
                  "id": "persistence-gpt-backup-first-interruption",
                  "boundary": "persistence-materialization",
                  "component": "GPT persistence partition materialization",
                  "failure_mode": "interruption occurs during relocated backup publication, its first durable sync, primary publication, or obsolete-backup cleanup",
                  "phase": "post-mutation",
                  "status": "automated",
                  "test_file": "internal/persistence/materialize_gpt_failure_test.go",
                  "test_name": "TestApplyGPTPartitionPlanInterruptedWriteOrdering",
                  "platforms": ["linux-amd64", "linux-arm64"],
                  "invariant": "Every interruption returns failure and preserves conservative evidence consistent with backup-first ordering: the primary is not moved early, the original backup is not removed before the new pair is durable, and cleanup failure remains visible."
              },
              {
                  "id": "persistence-filesystem-command-failure-cleanup",
                  "boundary": "persistence-materialization",
                  "component": "ext4 persistence filesystem initialization",
                  "failure_mode": "format, mount, unmount, or read-only filesystem check fails after the partition has been selected",
                  "phase": "post-mutation",
                  "status": "automated",
                  "test_file": "internal/persistence/filesystem_failure_test.go",
                  "test_name": "TestCreateFilesystemFailureStagesSuppressCompletionAndCleanup",
                  "platforms": ["linux-amd64", "linux-arm64"],
                  "invariant": "Every stage failure returns an error, suppresses the complete event, retries owned unmount cleanup where required, and removes the private workspace after successful cleanup."
              },
              {
                  "id": "persistence-config-symlink-initialization-failure",
                  "boundary": "persistence-materialization",
                  "component": "Debian persistence filesystem initialization",
                  "failure_mode": "a symbolic link occupies persistence.conf after the new filesystem is mounted",
                  "phase": "post-mutation",
                  "status": "automated",
                  "test_file": "internal/persistence/filesystem_test.go",
                  "test_name": "TestCreateFilesystemRejectsPersistenceConfigSymlinkAndUnmounts",
                  "platforms": ["linux-amd64", "linux-arm64"],
                  "invariant": "The outside target remains unchanged, initialization fails, and cleanup unmount is attempted."
              },
              {
                  "id": "persistence-boot-patch-later-path-failure",
                  "boundary": "persistence-materialization",
                  "component": "persistent live-media boot configuration",
                  "failure_mode": "a later detected boot configuration is replaced by a symbolic link after an earlier owned configuration was patched",
                  "phase": "post-mutation",
                  "status": "automated",
                  "test_file": "internal/persistence/patch_failure_test.go",
                  "test_name": "TestPatchBootTreeLaterFailurePreservesOwnedPartialEvidence",
                  "platforms": ["linux-amd64", "linux-arm64"],
                  "invariant": "The operation returns failure and no success list, the earlier owned patch remains visible as incomplete-media evidence, the outside symbolic-link target is unchanged, and no owned temporary patch file remains."
              }
          ]
          existing_ids = {entry["id"] for entry in matrix["entries"]}
          if existing_ids.intersection(entry["id"] for entry in entries):
              raise SystemExit("persistence materialization executable rows already exist")
          physical_index = next(
              (index for index, entry in enumerate(matrix["entries"]) if entry.get("status") == "physical-only"),
              len(matrix["entries"]),
          )
          matrix["entries"][physical_index:physical_index] = entries
          matrix_path.write_text(json.dumps(matrix, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          documentation = Path("docs/interruption-crash-consistency.md")
          text = documentation.read_text(encoding="utf-8")
          old = "- raw, dynamic-container, and filesystem-ISO backup cleanup, no-replace collision, directory substitution, post-rename sync rollback, and ambiguous rollback evidence.\n"
          new = old[:-2] + ";\n- MBR/GPT persistence metadata failure ordering, ext4 initialization cleanup, and partial boot-tree patch evidence.\n"
          if text.count(old) != 1:
              raise SystemExit("persistence documentation coverage anchor changed")
          text = text.replace(old, new, 1)
          old_gap = "The inventory deliberately keeps uncovered software cases visible. A missing partition/filesystem mutation, persistence materialization, or helper-process cleanup case may not disappear from review merely because another component has a similar test."
          new_gap = "The inventory deliberately keeps uncovered software cases visible. A missing general partition/filesystem mutation or helper-process cleanup case may not disappear from review merely because persistence or another component has a similar test."
          if text.count(old_gap) != 1:
              raise SystemExit("persistence documentation residual-gap text changed")
          text = text.replace(old_gap, new_gap, 1)
          insertion = "\nPersistence materialization uses conservative stage-specific evidence. Before the first GPT write, failure must leave both authoritative metadata copies unchanged. After mutation, errors never become completion; backup-first ordering, retained old metadata, cleanup attempts, and visible partial boot patches describe the recovery state without claiming electrical power-loss behavior.\n"
          anchor = "\n## Required result semantics\n"
          if text.count(anchor) != 1:
              raise SystemExit("persistence documentation result-semantics anchor changed")
          documentation.write_text(text.replace(anchor, insertion + anchor, 1), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          anchor = "- Qualified raw/container and filesystem-ISO backup publication rollback, preserving no-replace collisions and surfacing unlink or rollback-sync failures as ambiguous rather than successful publication.\n"
          addition = anchor + "- Qualified persistence partition and filesystem materialization failures, including GPT backup-first ordering, MBR partial/sync errors, cleanup without false completion, and visible partial boot-patch evidence.\n"
          if text.count(anchor) != 1:
              raise SystemExit("persistence changelog anchor changed")
          changelog.write_text(text.replace(anchor, addition, 1), encoding="utf-8")
          PY
          gofmt -w \
            internal/persistence/materialize_mbr_failure_test.go \
            internal/persistence/materialize_gpt_failure_test.go \
            internal/persistence/filesystem_failure_test.go \
            internal/persistence/patch_failure_test.go
          go test ./internal/persistence ./internal/qualification
          git rm .github/workflows/patch-persistence-materialization-matrix-once.yml
          git add \
            CHANGELOG.md \
            docs/interruption-crash-consistency.md \
            docs/interruption-qualification.json \
            internal/persistence/materialize_mbr_failure_test.go \
            internal/persistence/materialize_gpt_failure_test.go \
            internal/persistence/filesystem_failure_test.go \
            internal/persistence/patch_failure_test.go
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "reliability: qualify persistence materialization failures"
          git push origin HEAD:feature/persistence-materialization-failures
