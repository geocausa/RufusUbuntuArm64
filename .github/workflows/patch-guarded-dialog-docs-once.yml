name: Patch guarded dialog docs once

on:
  push:
    branches:
      - feature/gettext-guarded-dialogs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/gettext-guarded-dialogs
      - name: Add exact Unreleased entry and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          anchor = "- Added a standard GNU gettext runtime, deterministic primary-interface POT, safe English fallback, and exact post-composition translation for reviewed static main-window, tooltip, appearance, and accessibility text while keeping machine and destructive-operation contracts byte-stable.\n"
          addition = anchor + "- Extended exact static localization to the guarded data-only formatter and FreeDOS dialog shells while preserving generated confirmation phrases, identities, dynamic plans, reports, and operation paths byte-for-byte.\n"
          if text.count(anchor) != 1:
              raise SystemExit("Unreleased localization entry changed")
          path.write_text(text.replace(anchor, addition, 1), encoding="utf-8")
          PY
          git rm .github/workflows/patch-guarded-dialog-docs-once.yml
          git add CHANGELOG.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "docs: record guarded dialog localization"
          git push origin HEAD:feature/gettext-guarded-dialogs
