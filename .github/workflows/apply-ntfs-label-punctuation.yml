name: Apply NTFS label punctuation parity

on:
  push:
    branches: [parity/unicode-volume-labels]
    paths:
      - scripts/apply_ntfs_label_punctuation.py
      - .github/workflows/apply-ntfs-label-punctuation.yml

permissions:
  contents: write

concurrency:
  group: apply-ntfs-label-punctuation
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'geocausa/RufusUbuntuArm64'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Apply guarded parity correction
        run: python3 scripts/apply_ntfs_label_punctuation.py
      - name: Format and test affected contracts
        run: |
          set -euo pipefail
          gofmt -w \
            internal/volumelabel/volumelabel.go \
            internal/volumelabel/volumelabel_test.go \
            internal/windowsmedia/windowsmedia_test.go \
            internal/linuxmedia/extracted_ntfs_loop_test.go \
            internal/nonbootable/backend_loop_test.go
          go test ./internal/volumelabel ./internal/nonbootable ./internal/linuxmedia ./internal/windowsmedia
          (cd gui && python3 -m unittest test_logic.py test_iso_write_mode.py)
      - name: Publish product-only branch head
        env:
          BRANCH: parity/unicode-volume-labels
        run: |
          set -euo pipefail
          rm -f \
            scripts/apply_ntfs_label_punctuation.py \
            .github/workflows/apply-ntfs-label-punctuation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "labels: preserve valid NTFS punctuation"
          git push origin "HEAD:${BRANCH}"
