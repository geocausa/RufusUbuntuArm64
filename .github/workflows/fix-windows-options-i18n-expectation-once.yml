name: Fix Windows options localization expectation once

on:
  pull_request:
    branches:
      - stage4/0.15.0

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: feature/gettext-windows-options-dialog
      - name: Correct escaped markup expectation and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/patch-windows-options-i18n-once.yml')
          text = path.read_text(encoding='utf-8')
          old = "<span size='large' weight='bold'>Personnaliser l'installation de Windows</span>"
          new = "<span size='large' weight='bold'>Personnaliser l&#x27;installation de Windows</span>"
          if text.count(old) != 1:
              raise SystemExit('Windows options markup expectation changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-windows-options-i18n-expectation-once.yml
          git rm docs/windows-options-i18n-diagnostic.txt docs/windows-options-i18n-test-diagnostic.txt
          git add .github/workflows/patch-windows-options-i18n-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: expect escaped localized Windows heading"
          git push origin HEAD:feature/gettext-windows-options-dialog
