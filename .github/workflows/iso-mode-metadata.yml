name: Finalize ISO mode metadata

on:
  push:
    branches:
      - feature/iso-image-mode

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/iso-image-mode
          persist-credentials: true
      - name: Update changelog and parity audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          heading = "## Unreleased\n"
          block = """## Unreleased

          - Added a Rufus-style ISOHybrid write-mode choice with **ISO Image mode (Recommended)** selected by default and the existing byte-for-byte DD Image mode retained as the exact fallback.
          - Added a guarded ARM64 UEFI/FAT32 ISO extraction path with source/target identity binding, pre-erasure compatibility and capacity checks, transactional file copying, SHA-256 readback of every copied file, FAT32 consistency checking, cancellation, and final device flushing.
          - Kept unsupported ISO trees fail-closed and explicitly left physical ARM64 firmware-boot qualification for a new release candidate; the earlier 0.14.0-rc1 DD and persistence evidence does not qualify this new extraction path.

          """
          if heading not in text:
              marker = "# Changelog\n\n"
              if text.count(marker) != 1:
                  raise SystemExit("canonical changelog heading was not found exactly once")
              text = text.replace(marker, marker + block, 1)
              changelog.write_text(text, encoding="utf-8")

          parity_path = Path("docs/upstream-rufus-parity.json")
          parity = json.loads(parity_path.read_text(encoding="utf-8"))
          feature_id = "linux-iso-image-mode"
          if not any(item.get("id") == feature_id for item in parity["features"]):
              entry = {
                  "id": feature_id,
                  "upstream_feature": "Offer ISO Image mode or DD Image mode for suitable ISOHybrid images",
                  "status": "implemented",
                  "notes": "Suitable UEFI ISOHybrid Linux images now present a Rufus-style choice with ISO Image mode selected by default. The Linux-native extraction path creates one writable FAT32 partition only after complete source/target identity, UEFI fallback-loader, FAT32 filename, collision, symlink, file-size, and capacity checks; it transactionally copies and SHA-256 verifies every file, checks FAT32, supports cancellation, and flushes the device. The existing DD writer remains unchanged and is the explicit or automatic fallback. Physical ARM64 firmware-boot qualification remains required on a new candidate.",
                  "upstream_sources": [
                      "src/format.c",
                      "src/iso.c",
                      "src/ui.c"
                  ],
                  "project_sources": [
                      "internal/linuxmedia/extracted.go",
                      "gui/rufusarm64_iso_write_mode.py",
                      "docs/iso-image-mode.md"
                  ]
              }
              features = parity["features"]
              insert_at = next((index + 1 for index, item in enumerate(features) if item.get("id") == "raw-image-write"), 0)
              features.insert(insert_at, entry)
          parity["generated_on"] = "2026-07-28"
          parity_path.write_text(json.dumps(parity, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
          git rm .github/workflows/iso-mode-metadata.yml
          git diff --check
      - name: Commit final metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md docs/upstream-rufus-parity.json .github/workflows/iso-mode-metadata.yml
          git commit -m "Docs: record Rufus-style ISO Image mode parity"
          git push origin HEAD:feature/iso-image-mode
