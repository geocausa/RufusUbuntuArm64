name: Fix PR 415 CA 2023 architecture whitelist

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fix-pr415-ca2023-architecture-whitelist
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: parity/windows-ca2023-bootloaders
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.x'
      - name: Whitelist supported CA 2023 architectures and verify
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('internal/windowsmedia/ca2023.go')
          text = path.read_text(encoding='utf-8')
          old = '''\tbootArchitecture := normalizeWIMArchitecture(metadata.Architecture)
\tif bootArchitecture == "" {
\t\treturn WindowsCA2023Capability{Reason: "boot.wim architecture is missing or unsupported"}, nil
\t}
\tindexes := make([]int, 0, 2)
'''
          new = '''\tbootArchitecture := normalizeWIMArchitecture(metadata.Architecture)
\tswitch bootArchitecture {
\tcase "arm64", "amd64", "x86":
\tcase "":
\t\treturn WindowsCA2023Capability{Reason: "boot.wim architecture is missing"}, nil
\tdefault:
\t\treturn WindowsCA2023Capability{Reason: fmt.Sprintf("boot.wim architecture %q is unsupported for Windows UEFI CA 2023 replacement", bootArchitecture)}, nil
\t}
\tindexes := make([]int, 0, 2)
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one CA 2023 architecture-validation anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          gofmt -w internal/windowsmedia/ca2023.go
          go test ./...
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
      - name: Run pinned static analysis and focused tests
        run: |
          set -euo pipefail
          audit_bin="${RUNNER_TEMP}/audit-tools"
          mkdir -p "${audit_bin}"
          GOBIN="${audit_bin}" go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          "${audit_bin}/staticcheck" ./internal/windowsmedia/...
          go test ./internal/windowsmedia ./internal/windowsconfig ./cmd/rufus-linux
      - name: Publish product-only whitelist commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/windowsmedia/ca2023.go
          git commit -m "windowsmedia: whitelist CA 2023 boot architectures"
          git push origin HEAD:parity/windows-ca2023-bootloaders
