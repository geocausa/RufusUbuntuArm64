name: Fix PR 415 CA 2023 architecture whitelist

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fix-pr415-ca2023-architecture-whitelist
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Preserve trusted whitelist patch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          path: trusted-main
          persist-credentials: false
      - name: Check out exact PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: parity/windows-ca2023-bootloaders
          path: product
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.x'
      - name: Apply whitelist and run minimum-version suite
        working-directory: product
        run: |
          set -euo pipefail
          python3 ../trusted-main/.github/scripts/patch-pr415-ca2023-architecture-whitelist.py
          gofmt -w internal/windowsmedia/ca2023.go
          go test ./...
      - name: Publish product-only whitelist commit
        working-directory: product
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/windowsmedia/ca2023.go
          git commit -m "windowsmedia: whitelist CA 2023 boot architectures"
          git push origin HEAD:parity/windows-ca2023-bootloaders
