name: Apply localized Windows account names

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-localized-windows-account-names
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'audit/localized-windows-account-names'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: audit/localized-windows-account-names
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
      - name: Apply deterministic source changes
        run: |
          python3 .github/scripts/apply-localized-windows-account-names.py
          gofmt -w internal/windowsconfig/config.go internal/windowsconfig/config_test.go
          go test ./internal/windowsconfig
          PYTHONPATH=gui python3 gui/test_windows_username_validation.py
          python3 -m py_compile gui/rufusarm64_logic.py gui/test_windows_username_validation.py
      - name: Publish one atomic product commit
        run: |
          if git diff --quiet -- \
            internal/windowsconfig/config.go \
            internal/windowsconfig/config_test.go \
            gui/rufusarm64_logic.py \
            gui/test_windows_username_validation.py; then
            echo "Localized account-name protection is already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            internal/windowsconfig/config.go \
            internal/windowsconfig/config_test.go \
            gui/rufusarm64_logic.py \
            gui/test_windows_username_validation.py
          git commit -m "windows: reject localized reserved account names"
          git push origin HEAD:audit/localized-windows-account-names
