name: Validate graphical FFU review logic

on:
  push:
    branches: [feature/ffu-graphical-review-logic]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Apply graphical review patch
        run: python3 scripts/patch-ffu-graphical-review-logic.py
      - name: Compile Python sources
        run: python3 -m py_compile gui/rufusarm64_logic.py gui/test_logic.py
      - name: Run complete GUI logic suite
        run: PYTHONPATH=gui python3 -m unittest discover -s gui -p 'test_*.py'
      - name: Verify read-only source boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('gui/rufusarm64_logic.py').read_text()
          start = source.index('def build_ffu_review_command(')
          end = source.index('\ndef normalize_ffu_review(', start)
          command = source[start:end]
          for forbidden in ('pkexec', '"restore"', '--confirm', '--allow-fixed', '--yes'):
              if forbidden in command:
                  raise SystemExit(f'forbidden graphical FFU review token: {forbidden}')
          PY
      - name: Publish clean product tree
        env:
          BRANCH: feature/ffu-graphical-review-logic
        run: |
          git rm .github/workflows/check-ffu-graphical-review-logic.yml scripts/patch-ffu-graphical-review-logic.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gui/rufusarm64_logic.py gui/test_logic.py docs/ffu-graphical-review-boundary.md
          git commit -m "FFU: add graphical review command and evidence normalization"
          git push origin "HEAD:${BRANCH}"
